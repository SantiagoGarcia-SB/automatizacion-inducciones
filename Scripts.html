<script>

  // ============================================================
  //  INICIALIZACIÓN DE ZONAS DE CARGA
  // ============================================================

  // FIX #5: setupDropZone ahora recibe subLabelId como parámetro
  // para que cada zona actualice su propio texto de estado
  function setupDropZone(zoneId, inputId, labelId, subLabelId, onFileLoaded) {
    const zone  = document.getElementById(zoneId);
    const input = document.getElementById(inputId);
    const label = document.getElementById(labelId);
    if (!zone || !input) return;

    zone.onclick     = () => input.click();
    zone.ondragover  = (e) => { e.preventDefault(); zone.style.borderColor = '#0033a0'; zone.style.backgroundColor = 'rgba(0, 51, 160, 0.05)'; };
    zone.ondragleave = ()  => { zone.style.borderColor = ''; zone.style.backgroundColor = ''; };
    zone.ondrop      = (e) => {
      e.preventDefault();
      zone.style.borderColor = '';
      zone.style.backgroundColor = '';
      input.files = e.dataTransfer.files;
      actualizarLabel(input, label, subLabelId, zoneId, onFileLoaded);
    };
    input.onchange = () => actualizarLabel(input, label, subLabelId, zoneId, onFileLoaded);
  }

  function actualizarLabel(input, label, subLabelId, zoneId, onFileLoaded) {
    if (input && input.files[0]) {
      const zona     = document.getElementById(zoneId);
      const subLabel = subLabelId ? document.getElementById(subLabelId) : null;
      label.innerHTML = `<b>${input.files[0].name}</b>`;
      if (subLabel) subLabel.textContent = '✅ Archivo cargado correctamente';
      if (zona) zona.classList.add('loaded');
      if (onFileLoaded) onFileLoaded(input.files[0]);
    }
  }

  // Inicializar zona Excel con conteo de contratos al cargar
  setupDropZone('dropZoneExcel', 'fileExcel', 'labelExcel', 'subLabelExcel', contarContratosExcel);

  // Inicializar zona PDF
  setupDropZone('dropZonePdf', 'filePdf', 'labelPdf', 'subLabelPdf');

  // Variable global para guardar los datos parseados del Excel
  var _datosExcelParseados = null;
  var _metadatosExcel = null;

  function contarContratosExcel(file) {
    const sub = document.getElementById('subLabelExcel');
    if (!sub) return;
    _datosExcelParseados = null;
    _metadatosExcel = null;

    const reader = new FileReader();
    reader.onload = function (e) {
      try {
        const wb = XLSX.read(e.target.result, { type: 'array' });
        const datos = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });

        // ── Validación pre-vuelo: detectar plantilla incorrecta ──
        if (datos.length >= 4) {
          const encabezadoC4 = String(datos[3] && datos[3][2] || '').trim().toUpperCase();
          if (encabezadoC4 !== 'AMPARO INTEGRAL') {
            sub.textContent = '⚠️ Plantilla incorrecta — usa el formato rojo actualizado';
            sub.style.color = '#991B1B';
            _datosExcelParseados = null;
            return;
          }
        }

        // Guardar datos parseados para enviar al servidor sin conversión Drive
        _datosExcelParseados = datos;
        _metadatosExcel = { nombre: file.name, tipo: file.type };

        let count = 0;
        for (let i = 4; i < datos.length; i++) {
          if (datos[i] && String(datos[i][9] || '').trim()) count++;
        }
        sub.style.color = '';
        sub.textContent = count > 0
          ? '✅ ' + count + (count === 1 ? ' contrato detectado' : ' contratos detectados')
          : '⚠️ No se detectaron contratos en la planilla';
      } catch (err) {
        sub.textContent = '✅ Archivo cargado correctamente';
        _datosExcelParseados = null;
      }
      // 4: Actualizar stepper al cargar archivo
      actualizarStepper();
    };
    reader.readAsArrayBuffer(file);
  }


  // ============================================================
  //  PROCESAMIENTO Y ENVÍO
  // ============================================================

  async function procesarRadicacion() {
    const btn   = document.getElementById('btnEnviar');
    const modal = document.getElementById('loadingModal');

    const poliza          = document.getElementById('poliza').value.trim();
    const tasaNegociacion = document.getElementById('tasaNegociacion').value.trim();
    const fileExcel       = document.getElementById('fileExcel').files[0];
    const radioA          = document.getElementById('radioA');
    const radioB          = document.getElementById('radioB');
    const filePdf         = document.getElementById('filePdf').files[0];

    // ── Validaciones previas de formulario ──
    if (!poliza || !tasaNegociacion) {
      const campoFaltante = !poliza ? 'poliza' : 'tasaNegociacion';
      Swal.fire({
        title: 'Información incompleta',
        text: 'Para continuar, por favor diligencia el número de póliza y la tasa de inducción.',
        icon: 'warning',
        confirmButtonText: 'OK',
        confirmButtonColor: '#253150'
      }).then(function() { enfocarCampoFaltante(campoFaltante); });
      return;
    }
    if (!fileExcel) {
      Swal.fire({
        title: 'Planilla pendiente',
        text: 'Carga la planilla de inducción en formato Excel para poder radicar el lote.',
        icon: 'warning',
        confirmButtonText: 'OK',
        confirmButtonColor: '#253150'
      }).then(function() { enfocarCampoFaltante('dropZoneExcel'); });
      return;
    }
    if (!_datosExcelParseados || _datosExcelParseados.length < 5) {
      Swal.fire({
        title: 'Planilla inválida',
        text: 'No se pudieron leer datos de la planilla. Verifica que sea un Excel válido (.xlsx) con contratos.',
        icon: 'warning',
        confirmButtonText: 'OK',
        confirmButtonColor: '#253150'
      }).then(function() { enfocarCampoFaltante('dropZoneExcel'); });
      return;
    }

    if (!radioA.checked && !radioB.checked) {
      Swal.fire({
        title: 'Paz y salvo pendiente',
        text: 'Selecciona una de las dos opciones de certificación de paz y salvo antes de continuar.',
        icon: 'warning',
        confirmButtonText: 'OK',
        confirmButtonColor: '#253150'
      }).then(function() { enfocarCampoFaltante('opcionesPS'); });
      return;
    }
    if (radioB.checked && !filePdf) {
      Swal.fire({
        title: 'Documento pendiente',
        text: 'Seleccionaste adjuntar el paz y salvo, pero aún no has cargado el archivo PDF.',
        icon: 'warning',
        confirmButtonText: 'OK',
        confirmButtonColor: '#253150'
      }).then(function() { enfocarCampoFaltante('dropZonePdf'); });
      return;
    }

    // ── V2: Pre-validación completa en frontend ──
    const erroresFront = validarExcelEnFrontend(_datosExcelParseados);
    if (erroresFront.length > 0) {
      mostrarErrores(erroresFront, null);
      Swal.fire({
        title: 'Planilla con observaciones',
        text: 'Encontramos ' + erroresFront.length + ' dato(s) que necesitan ajuste. Revisa el detalle, corrige y vuelve a cargar.',
        icon: 'warning',
        confirmButtonText: 'Entendido',
        confirmButtonColor: '#253150'
      });
      return;
    }

    // Activar interfaz de carga
    btn.disabled  = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Radicando lote...';
    if (modal) {
      modal.style.display = 'flex';
      avanzarProgreso(0);
      // Iniciar temporizador regresivo
      const eta = document.getElementById('loadingEta');
      if (eta) eta.textContent = 'Tiempo restante aproximado:';
      iniciarCronometro();
    }

    try {
      avanzarProgreso(1);

      // V1: Enviar Excel como blob para Drive + datos parseados para auditoría
      const excelObj     = await archivoABase64(fileExcel);
      const pazYSalvoObj = (radioB.checked && filePdf)
        ? await archivoABase64(filePdf)
        : null;

      avanzarProgreso(2);

      const dataParaEnviar = {
        poliza:           poliza,
        tasaNegociacion:  tasaNegociacion,
        observaciones:    document.getElementById('observaciones').value,
        excel:            excelObj,
        excelParseado:    _datosExcelParseados,  // V1: datos ya parseados
        tipoPazYSalvo:    radioA.checked ? "checkbox" : "adjunto",
        pazYSalvoPdf:     pazYSalvoObj
      };

      avanzarProgreso(3);

      google.script.run
        .withSuccessHandler((res) => { avanzarProgreso(5); setTimeout(() => { if (modal) modal.style.display = 'none'; alRecibirRespuesta(res); }, 400); })
        .withFailureHandler((err) => { if (modal) modal.style.display = 'none'; alDarErrorGrave(err); })
        .motorDeAuditoria(dataParaEnviar);

    } catch (err) {
      if (modal) modal.style.display = 'none';
      resetBoton();
      Swal.fire('Archivo no válido', 'No fue posible leer el archivo cargado. Verifica que sea un Excel válido (.xlsx) y vuelve a intentarlo.', 'warning');
    }
  }

  // ============================================================
  //  V2: VALIDACIÓN COMPLETA EN FRONTEND (pre-vuelo)
  //  Mismas reglas que el servidor, excepto IA de Destino.
  //  Feedback instantáneo sin esperar 15-30 seg del backend.
  // ============================================================

  function validarExcelEnFrontend(data) {
    const errores = [];
    if (!data || data.length < 5) return errores;

    const titulos = data[3] || [];
    const mapaLlaves = {};

    for (let i = 4; i < data.length; i++) {
      const fila = data[i];
      const nF   = i + 1;
      const inquilino = String(fila[9] || '').trim();
      if (!inquilino) continue;

      // 1. Campos obligatorios
      const obligatorios = [1, 2, 4, 5, 6, 9, 10, 11];
      obligatorios.forEach(idx => {
        if (!String(fila[idx] || '').trim()) {
          errores.push({ fila: nF, campo: String(titulos[idx] || 'Col ' + (idx+1)), motivo: 'Dato faltante.' });
        }
      });

      // 2. Celular o correo del inquilino
      const celInq = String(fila[12] || '').trim().replace(/[\s-]/g, '');
      const corInq = String(fila[13] || '').trim();
      if (!celInq && !corInq) {
        errores.push({ fila: nF, campo: 'Celular / Correo (INQ)', motivo: 'Debe diligenciar al menos el Celular o el Correo del Inquilino.' });
      } else {
        if (celInq) {
          const celLimpio = celInq.replace(/^\+?57/, '');
          if (!/^3\d{9}$/.test(celLimpio)) {
            errores.push({ fila: nF, campo: 'Celular (INQ)', motivo: 'El celular "' + fila[12] + '" no es válido. Verifique el número.' });
          }
        }
        if (corInq && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(corInq)) {
          errores.push({ fila: nF, campo: 'Correo (INQ)', motivo: 'El correo "' + corInq + '" no tiene formato válido.' });
        }
      }

      // 3. Campos monetarios
      [{ idx: 6, nombre: 'Canon' }, { idx: 7, nombre: 'Administración' }, { idx: 8, nombre: 'IVA' }].forEach(cm => {
        const val = String(fila[cm.idx] || '').trim();
        if (val) {
          const sinFmt = val.replace(/[$.,\s]/g, '');
          if (!/^\d+$/.test(sinFmt)) {
            errores.push({ fila: nF, campo: cm.nombre, motivo: '"' + val + '" contiene letras o símbolos no permitidos.' });
          }
        }
      });

      // 4. Codeudores — contacto requerido
      const coaSlots = [
        { nombre: 14, cel: 17, correo: 18, label: 'COA 1' },
        { nombre: 19, cel: 22, correo: 23, label: 'COA 2' },
        { nombre: 24, cel: 27, correo: 28, label: 'COA 3' },
        { nombre: 29, cel: 32, correo: 33, label: 'COA 4' },
        { nombre: 34, cel: 37, correo: 38, label: 'COA 5' }
      ];
      coaSlots.forEach(coa => {
        const nombreCoa = String(fila[coa.nombre] || '').trim();
        if (!nombreCoa) return;
        const celCoa = String(fila[coa.cel] || '').trim().replace(/[\s-]/g, '');
        const corCoa = String(fila[coa.correo] || '').trim();
        if (!celCoa && !corCoa) {
          errores.push({ fila: nF, campo: 'Celular / Correo (' + coa.label + ')', motivo: 'Debe diligenciar al menos el Celular o Correo de ' + coa.label + '.' });
        }
      });

      // 5. Duplicados verticales
      const llave = (String(fila[11] || '').trim() + '|' + String(fila[5] || '').trim()).toUpperCase();
      if (mapaLlaves[llave]) {
        errores.push({ fila: nF, campo: 'DUPLICADO', motivo: 'Contrato repetido — misma identificación y dirección (ver fila ' + mapaLlaves[llave] + ').' });
      } else {
        mapaLlaves[llave] = nF;
      }
    }

    return errores;
  }


  // ============================================================
  //  MANEJO DE RESPUESTA DEL SERVIDOR
  // ============================================================

  function alRecibirRespuesta(res) {
    resetBoton();
    detenerCronometro();
    const panelErrores = document.getElementById('errorPanel');

    if (res.status === "ERROR") {
      mostrarErrores(res.detalles || res.errores || [], res.archivoMarcado);
      Swal.fire({
        title: 'Planilla con observaciones',
        text: 'Encontramos algunos datos que necesitan ajuste en tu planilla. Revisa el detalle, corrige y vuelve a cargarla.',
        icon: 'warning',
        confirmButtonText: 'Entendido',
        confirmButtonColor: '#253150'
      });

    } else if (res.status === "OK" || res.status === "success") {
      if (panelErrores) panelErrores.style.display = 'none';
      localStorage.removeItem('borradorLibertador');

      // 10: Confetti de celebración
      lanzarConfetti();

      Swal.fire({
        title: '¡Lote radicado con éxito!',
        html: `
          <div style="margin-top: 15px;">
            <p style="color:#64748B;">Tu lote fue recibido correctamente por El Libertador SA y será procesado por el equipo de inducciones.</p>
            <div style="background: #f1f8e9; padding: 20px; border-radius: 12px; border: 2px dashed #2e7d32; margin-top: 20px;">
              <span style="font-size: 0.85em; color: #555; text-transform: uppercase; letter-spacing: 1px;">ID de Lote:</span><br>
              <b style="font-family: 'Roboto Mono', monospace; font-size: 1.4em; color: #1b5e20;">${res.idLote}</b>
            </div>
            <p style="font-size:12px; color:#94A3B8; margin-top:14px;">Guarda este ID para consultar el estado de tu lote en cualquier momento.</p>
          </div>`,
        icon: 'success',
        confirmButtonText: 'Finalizar',
        confirmButtonColor: '#253150',
        allowOutsideClick: false,
        showClass: { popup: 'animate__animated animate__backInDown' }
      }).then((result) => {
        if (result.isConfirmed) {
          document.getElementById('formInducciones').reset();
          resetLabels();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });
    }
  }

  function alDarErrorGrave(error) {
    resetBoton();
    detenerCronometro();
    Swal.fire('No pudimos procesar tu solicitud', 'Ocurrió un problema de conexión. Por favor intenta de nuevo en unos minutos. Si el problema persiste, contacta al equipo de inducciones.', 'error');
  }


  // ============================================================
  //  UTILIDADES DE INTERFAZ
  // ============================================================

  function mostrarErrores(lista, archivoMarcado) {
    const panel = document.getElementById('errorPanel');
    const tbody = document.getElementById('errorBody');
    if (!tbody || !panel) return;

    tbody.innerHTML = "";
    lista.forEach(err => {
      tbody.innerHTML += `
        <tr class="animate__animated animate__fadeIn">
          <td><span class="badge bg-danger">${err.fila || '-'}</span></td>
          <td><b>${err.campo || 'General'}</b></td>
          <td>${err.motivo || err.descripcion}</td>
        </tr>`;
    });

    // Botón de descarga del Excel marcado
    const btnDescargar = document.getElementById('btnDescargarMarcado');
    if (btnDescargar) {
      if (archivoMarcado && archivoMarcado.base64 && archivoMarcado.nombre) {
        btnDescargar.style.display = 'inline-block';
        btnDescargar.onclick = function () {
          const byteChars = atob(archivoMarcado.base64);
          const byteNums  = new Array(byteChars.length);
          for (let i = 0; i < byteChars.length; i++) byteNums[i] = byteChars.charCodeAt(i);
          const blob = new Blob([new Uint8Array(byteNums)], {
            type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
          });
          const url = URL.createObjectURL(blob);
          const a   = document.createElement('a');
          a.href     = url;
          a.download = archivoMarcado.nombre;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        };
      } else {
        btnDescargar.style.display = 'none';
      }
    }

    panel.style.display = 'block';
    panel.classList.add('animate__animated', 'animate__headShake');
    panel.scrollIntoView({ behavior: 'smooth' });
  }

  function resetBoton() {
    const btn = document.getElementById('btnEnviar');
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-bolt"></i> Revisar y enviar a radicación'; }
  }

  // ============================================================
  //  ENFOQUE Y RESALTADO DE CAMPO FALTANTE
  //  Al cerrar el Swal, hace scroll suave al campo y lo marca
  //  con un borde rojo + fondo rosado por 3 segundos.
  // ============================================================

  function enfocarCampoFaltante(elementId) {
    const el = document.getElementById(elementId);
    if (!el) return;

    // Scroll suave al elemento
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });

    // Resaltar con borde rojo y fondo rosado
    el.style.transition = 'border-color 0.3s, background-color 0.3s, box-shadow 0.3s';
    el.style.borderColor = '#BD0F14';
    el.style.backgroundColor = '#FFF5F5';
    el.style.boxShadow = '0 0 0 4px rgba(189, 15, 20, 0.15)';

    // Si es un input/textarea, darle focus
    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
      el.focus();
    }

    // Quitar el resaltado después de 3 segundos
    setTimeout(function() {
      el.style.borderColor = '';
      el.style.backgroundColor = '';
      el.style.boxShadow = '';
    }, 3000);
  }

  function resetLabels() {
    const lblExcel = document.getElementById('labelExcel');
    const subLbl   = document.getElementById('subLabelExcel');
    const zona     = document.getElementById('dropZoneExcel');

    if (lblExcel) lblExcel.innerHTML = 'Planilla de Inducción';
    if (subLbl)   subLbl.textContent = 'Haz clic o arrastra el archivo aquí (.xlsx)';
    if (zona)     zona.classList.remove('loaded');

    // Resetear también la zona del PDF
    resetDropPdf();

    // Resetear radio buttons y ocultar zona PDF
    const radioA  = document.getElementById('radioA');
    const radioB  = document.getElementById('radioB');
    const labelA  = document.getElementById('labelOpcionA');
    const labelB  = document.getElementById('labelOpcionB');
    const zonaPdf = document.getElementById('zonaPdfWrapper');

    if (radioA)  radioA.checked          = false;
    if (radioB)  radioB.checked          = false;
    if (labelA)  { labelA.style.borderColor = '#e2e8f0'; labelA.style.background = 'white'; }
    if (labelB)  { labelB.style.borderColor = '#e2e8f0'; labelB.style.background = 'white'; }
    if (zonaPdf) zonaPdf.style.display   = 'none';
  }

  function seleccionarOpcion(opcion) {
    const labelA  = document.getElementById('labelOpcionA');
    const labelB  = document.getElementById('labelOpcionB');
    const zonaPdf = document.getElementById('zonaPdfWrapper');
    const radioA  = document.getElementById('radioA');
    const radioB  = document.getElementById('radioB');

    if (opcion === 'A') {
      radioA.checked            = true;
      labelA.style.borderColor  = '#BD0F14';
      labelA.style.background   = '#FFF8F8';
      labelB.style.borderColor  = '#e2e8f0';
      labelB.style.background   = 'white';
      zonaPdf.style.display     = 'none';
      document.getElementById('filePdf').value = '';
      resetDropPdf();
    } else {
      radioB.checked            = true;
      labelB.style.borderColor  = '#BD0F14';
      labelB.style.background   = '#FFF8F8';
      labelA.style.borderColor  = '#e2e8f0';
      labelA.style.background   = 'white';
      zonaPdf.style.display     = 'block';
    }
    // 4: Actualizar stepper + U3: guardar borrador
    actualizarStepper();
    guardarBorrador();
  }

  function resetDropPdf() {
    const zona = document.getElementById('dropZonePdf');
    const lbl  = document.getElementById('labelPdf');
    const sub  = document.getElementById('subLabelPdf');
    if (zona) zona.classList.remove('loaded');
    if (lbl)  lbl.innerHTML   = 'Paz y Salvo (PDF)';
    if (sub)  sub.textContent = 'Haz clic o arrastra el archivo aquí';
  }

  function validarComa(input) {
    input.value = input.value.replace(/\./g, ',').replace(/[^0-9,]/g, '');
    const partes = input.value.split(',');
    if (partes.length > 2) input.value = partes[0] + ',' + partes.slice(1).join('');
  }

  function archivoABase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload  = () => resolve({ bytes: reader.result, nombre: file.name, tipo: file.type });
      reader.onerror = e  => reject(e);
    });
  }


  // ============================================================
  //  CONSULTA DE LOTES DESDE EL FRONT
  // ============================================================

  function consultarLoteDesdeUI() {
    const idLote = document.getElementById('inputConsultaLote').value.trim();
    if (!idLote) return;

    const btn = document.getElementById('btnConsultaLote');
    btn.disabled = true;
    btn.textContent = 'Buscando...';

    google.script.run
      .withSuccessHandler(mostrarResultadoLote)
      .withFailureHandler(() => {
        btn.disabled = false;
        btn.textContent = 'Consultar lote';
        Swal.fire('No pudimos consultar el lote', 'Ocurrió un problema al buscar la información. Por favor intenta de nuevo.', 'error');
      })
      .consultarLote(idLote);
  }

  function getLoteBadgeClass(estado) {
    const e = estado.toUpperCase();
    if (e.includes('TERMINADO'))  return 'lb-terminado';
    if (e.includes('ANÁLISIS'))   return 'lb-analisis';
    if (e.includes('RADICADO'))   return 'lb-radicado';
    if (e.includes('ERROR'))      return 'lb-error';
    if (e.includes('PENDIENTE'))  return 'lb-pendiente';
    return 'lb-default';
  }

  function mostrarResultadoLote(resultados) {
    const btn = document.getElementById('btnConsultaLote');
    btn.disabled = false;
    btn.textContent = 'Consultar lote';

    const container = document.getElementById('loteModalContainer');

    if (!resultados || resultados.length === 0) {
      container.innerHTML = `
        <div class="lote-modal-bg" onclick="if(event.target===this) cerrarModalLote()">
          <div class="lote-modal">
            <div class="lote-modal__head">
              <p class="lote-modal__title">Consulta de lote</p>
              <button class="lote-modal__close" onclick="cerrarModalLote()">&#x2715;</button>
            </div>
            <div class="lote-empty">
              <p style="font-weight:700;color:#253150;margin:0 0 6px">No encontramos ese lote</p>
              <p style="margin:0">Verifica que el ID sea correcto e intenta nuevamente.</p>
            </div>
          </div>
        </div>`;
      return;
    }

    const fi      = resultados[0];
    const estados = [...new Set(resultados.map(r => r.estado))].join(', ');
    const cards   = resultados.map(r => `
      <div class="lote-contract-card">
        <div>
          <div class="lcc-name">${r.arrendatario || '—'}</div>
          <div class="lcc-meta">${r.comercial} &middot; Ingreso: ${r.fechaIngreso}</div>
        </div>

// U4: Calcular tiempo estimado basado en contratos
function calcularTiempoEstimado() {
  if (!_datosExcelParseados) return '';
  let count = 0;
  for (let i = 4; i < _datosExcelParseados.length; i++) {
    if (_datosExcelParseados[i] && String(_datosExcelParseados[i][9] || '').trim()) count++;
  }
  // Aproximación: 2 seg base + 1 seg por cada 5 contratos (por la validación IA)
  const segs = Math.max(5, Math.round(2 + count * 0.2));
  return segs <= 10 ? '~10 segundos' : '~' + segs + ' segundos';
}

// Temporizador regresivo en el modal de carga
var _cronometroInterval = null;
var _cronometroSegsRestantes = 0;

function iniciarCronometro() {
  const el = document.getElementById('loadingCronometro');
  if (!el) return;

  // Calcular segundos estimados
  // Realidad medida: ~14s para 3 contratos, la IA de destino toma ~10s fijos
  var segsEstimados = 15;
  if (_datosExcelParseados) {
    let count = 0;
    for (let i = 4; i < _datosExcelParseados.length; i++) {
      if (_datosExcelParseados[i] && String(_datosExcelParseados[i][9] || '').trim()) count++;
    }
    // Base: 12s (IA + Drive + escritura) + 1s por cada 10 contratos
    segsEstimados = Math.max(15, Math.round(12 + count * 0.1));
  }

  _cronometroSegsRestantes = segsEstimados;
  el.textContent = _cronometroSegsRestantes + 's';
  el.style.display = 'inline-block';

  if (_cronometroInterval) clearInterval(_cronometroInterval);
  _cronometroInterval = setInterval(function() {
    _cronometroSegsRestantes--;
    if (_cronometroSegsRestantes <= 0) {
      el.textContent = 'Casi listo...';
      clearInterval(_cronometroInterval);
      _cronometroInterval = null;
    } else {
      el.textContent = _cronometroSegsRestantes + 's';
    }
  }, 1000);
}

function detenerCronometro() {
  if (_cronometroInterval) {
    clearInterval(_cronometroInterval);
    _cronometroInterval = null;
  }
  const el = document.getElementById('loadingCronometro');
  if (el) el.style.display = 'none';
}

function restaurarBorrador() {
  const dataGuardada = localStorage.getItem('borradorLibertador');

// ============================================================
//  1: SALUDO PERSONALIZADO + 2: RESUMEN SEMANAL
// ============================================================

function cargarSaludo() {
  const container = document.getElementById('saludoContainer');
  const textoEl   = document.getElementById('saludoTexto');
  const resumenEl = document.getElementById('resumenSemanal');
  if (!container || !textoEl) return;

  // Saludo inmediato basado en hora
  const hora = new Date().getHours();
  let saludo = 'Buenas noches';
  if (hora >= 5 && hora < 12) saludo = 'Buenos días';
  else if (hora >= 12 && hora < 18) saludo = 'Buenas tardes';

  textoEl.textContent = saludo;
  container.style.display = 'block';

  // Obtener nombre desde el email (instantáneo, no lee hojas)
  google.script.run
    .withSuccessHandler(function(nombre) {
      if (nombre) {
        textoEl.textContent = saludo + ', ' + nombre;
        const badge = document.getElementById('userBadge');
        if (badge) badge.innerHTML = '<i class="fas fa-user-circle"></i> ' + nombre;
      }
    })
    .obtenerNombreUsuarioActual();

  // Resumen semanal aparte (puede tardar, no bloquea el saludo)
  if (resumenEl) resumenEl.textContent = '';
  google.script.run
    .withSuccessHandler(function(resumen) {
      if (!resumen || !resumenEl) return;
      const r = resumen;
      const partes = [];
      if (r.radicados > 0) partes.push(r.radicados + ' lote(s) radicado(s) esta semana');
      if (r.enAnalisis > 0) partes.push(r.enAnalisis + ' en análisis');
      if (r.pendientePS > 0) partes.push(r.pendientePS + ' pendiente(s) de paz y salvo');
      if (r.terminados > 0) partes.push(r.terminados + ' terminado(s)');
      resumenEl.textContent = partes.length > 0
        ? partes.join(' · ')
        : '';
    })
    .withFailureHandler(function() {})
    .obtenerResumenSemanal();
}

// ============================================================
//  4: STEPPER VISUAL DE PROGRESO DEL FORMULARIO
// ============================================================

function actualizarStepper() {
  const poliza  = document.getElementById('poliza').value.trim();
  const tasa    = document.getElementById('tasaNegociacion').value.trim();
  const radioA  = document.getElementById('radioA');
  const radioB  = document.getElementById('radioB');
  const excel   = document.getElementById('fileExcel').files[0] || _datosExcelParseados;

  const paso1 = poliza && tasa;
  const paso2 = radioA.checked || radioB.checked;
  const paso3 = !!excel;
  const paso4 = paso1 && paso2 && paso3;

  setStepState('step1', 'line1', paso1 ? 'done' : (true ? 'active' : ''));
  setStepState('step2', 'line2', paso2 ? 'done' : (paso1 ? 'active' : ''));
  setStepState('step3', 'line3', paso3 ? 'done' : (paso1 && paso2 ? 'active' : ''));
  setStepState('step4', null, paso4 ? 'active' : '');
}

function setStepState(stepId, lineId, state) {
  const step = document.getElementById(stepId);
  const line = lineId ? document.getElementById(lineId) : null;
  if (!step) return;

  step.classList.remove('active', 'done');
  if (line) line.classList.remove('done');

  if (state === 'done') {
    step.classList.add('done');
    if (line) line.classList.add('done');
  } else if (state === 'active') {
    step.classList.add('active');
  }
}

// Observar cambios en el formulario para actualizar stepper
document.addEventListener('DOMContentLoaded', function() {
  const campos = ['poliza', 'tasaNegociacion', 'radioA', 'radioB'];
  campos.forEach(function(id) {
    const el = document.getElementById(id);
    if (el) el.addEventListener('change', actualizarStepper);
    if (el) el.addEventListener('input', actualizarStepper);
  });
});


// ============================================================
//  10: CONFETTI DE CELEBRACIÓN AL ÉXITO
//  Implementación ligera sin librería externa (canvas puro)
// ============================================================

function lanzarConfetti() {
  const canvas = document.getElementById('confettiCanvas');
  if (!canvas) return;

  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const colores = ['#BD0F14', '#253150', '#16A34A', '#F59E0B', '#3B82F6', '#8B5CF6'];
  const particulas = [];
  const TOTAL = 120;

  for (let i = 0; i < TOTAL; i++) {
    particulas.push({
      x: canvas.width / 2 + (Math.random() - 0.5) * 200,
      y: canvas.height / 2 - 100,
      vx: (Math.random() - 0.5) * 12,
      vy: -(Math.random() * 10 + 4),
      w: Math.random() * 8 + 4,
      h: Math.random() * 4 + 2,
      color: colores[Math.floor(Math.random() * colores.length)],
      rotation: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 10,
      gravity: 0.25 + Math.random() * 0.1,
      opacity: 1
    });
  }

  let frame = 0;
  const maxFrames = 150;

  function animar() {
    frame++;
    if (frame > maxFrames) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      return;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particulas.forEach(function(p) {
      p.x += p.vx;
      p.vy += p.gravity;
      p.y += p.vy;
      p.vx *= 0.99;
      p.rotation += p.rotSpeed;

      if (frame > maxFrames - 30) {
        p.opacity = Math.max(0, p.opacity - 0.03);
      }

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation * Math.PI / 180);
      ctx.globalAlpha = p.opacity;
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });

    requestAnimationFrame(animar);
  }

  animar();
}
