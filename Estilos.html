<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap');

  /* ============================================================
     VARIABLES GLOBALES — Alineadas con Brand Book El Libertador
     Fuente de verdad: styles_tokens.html / manual-marca.md
  ============================================================ */
  :root {
    /* Primarios (Brand Book §1.1) */
    --navy:      #253150;
    --accent:    #1c2640;

    /* Monocromáticos (Brand Book §1.3) */
    --bg:        #ebe7e8;
    --card-bg:   #ffffff;
    --text-main: #231f20;
    --text-muted:#6b6969;
    --border:    #bfbebe;

    /* Layout (Brand Book §6) */
    --radius:    16px;
    --radius-md: 12px;
    --radius-sm: 8px;

    /* Semánticos (Brand Book §1.2 + §1.4) */
    --success:   #0d7a54;
    --danger:    #bd0f14;
    --warning:   #ffa300;
    --teal:      #0fbdb7;

    /* Sombras (Brand Book §6) */
    --shadow-sm: 0 1px 3px rgba(35, 31, 32, 0.08);
    --shadow-md: 0 4px 6px -1px rgba(35, 31, 32, 0.06), 0 2px 4px -2px rgba(35, 31, 32, 0.04);
    --shadow-lg: 0 10px 20px -4px rgba(35, 31, 32, 0.1);

    /* Gradiente corporativo (Brand Book §1.4) */
    --gradient-brand: linear-gradient(90deg, #bd0f14 0%, #253150 100%);
  }

  /* ============================================================
     BASE
  ============================================================ */
  body {
    font-family: 'Inter', 'Poppins', system-ui, sans-serif;
    background-color: var(--bg);
    margin: 0;
    color: var(--text-main);
    display: flex;
    justify-content: center;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .main-canvas {
    width: 100%;
    max-width: 960px;
    padding: 40px 20px;
    animation: fadeIn 0.8s ease-out;
  }

  /* ============================================================
     HEADER (Brand Book §3.3)
  ============================================================ */
  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
    padding: 0 4px;
  }
  .logo-area            { display: flex; align-items: center; gap: 16px; }
  .logo-area img        { height: 32px; }
  .v-divider            { width: 1.5px; height: 24px; background: var(--border); }
  .logo-area h1         { font-family: 'Inter', 'Poppins', sans-serif; font-size: 18px; margin: 0; color: var(--navy); font-weight: 700; letter-spacing: -0.02em; }
  .user-badge           { font-size: 12px; font-weight: 600; color: var(--navy); background: rgba(37, 49, 80, 0.08); padding: 6px 14px; border-radius: 9999px; text-transform: uppercase; letter-spacing: 0.04em; }

  /* ============================================================
     BARRA DE DESCARGAS
  ============================================================ */
  .downloads-bar {
    z-index: 100;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px 20px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    box-shadow: var(--shadow-sm);
  }
  .downloads-bar__label {
    font-size: 12px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap;
  }
  .downloads-bar__btns  { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .downloads-bar__btn   { display: inline-flex; align-items: center; gap: 7px; padding: 8px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; color: white; text-decoration: none; transition: 0.2s ease; white-space: nowrap; }
  .downloads-bar__btn:hover { opacity: 0.88; transform: translateY(-1px); }
  .downloads-bar__btn.green { background: var(--success); }
  .downloads-bar__btn.navy  { background: var(--navy); }

  /* ============================================================
     SECCIONES (CARDS) — Brand Book §7
  ============================================================ */
  .glass-section {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 24px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    transition: transform 0.2s ease;
  }
  .section-title         { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; color: var(--navy); font-weight: 700; font-size: 15px; }
  .section-title i       { color: var(--navy); font-size: 18px; }

  #zonaPdfWrapper {
    width: 100%;
    max-width: 100%;
  }

  #zonaPdfWrapper .drop-card {
    width: 100%;
    box-sizing: border-box;
  }

  /* ============================================================
     FORMULARIO — Brand Book §7 (inputs)
  ============================================================ */
  .form-grid  { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .full-width { margin-top: 16px; }

  label {
    display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px;
    color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em;
  }
  input, textarea {
    width: 100%; padding: 12px 16px; border: 1.5px solid var(--border);
    border-radius: var(--radius-md); box-sizing: border-box; font-size: 14px;
    font-family: inherit; transition: all 0.2s ease; background: var(--card-bg);
  }
  input:focus, textarea:focus {
    outline: none; border-color: var(--navy); background: white;
    box-shadow: 0 0 0 3px rgba(37, 49, 80, 0.08);
  }
  textarea { resize: none; min-height: 90px; }

  input[type="checkbox"] { width: 20px; height: 20px; margin-top: 3px; cursor: pointer; accent-color: var(--navy); }

  /* ============================================================
     DROP CARD (ZONA DE CARGA)
  ============================================================ */
  .drop-card {
    width: 100%; max-width: 550px; margin: 0 auto;
    border: 2px dashed var(--border); padding: 24px; border-radius: var(--radius-md);
    display: flex; align-items: center; gap: 20px;
    cursor: pointer; transition: 0.2s; background: var(--card-bg);
  }
  .drop-card:hover         { border-color: var(--navy); background: rgba(37, 49, 80, 0.02); transform: translateY(-2px); }
  .drop-card.loaded        { border: 2px solid var(--success); background: rgba(13, 122, 84, 0.04); }
  .drop-card.loaded .drop-icon.excel { background: var(--success); color: white; }

  .drop-icon.excel {
    background: rgba(13, 122, 84, 0.08); color: var(--success); font-size: 26px;
    width: 52px; height: 52px; border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .drop-info b    { display: block; font-size: 15px; color: var(--navy); }
  .drop-info span { font-size: 12px; color: var(--text-muted); }

  .drop-check              { display: none; color: var(--success); font-size: 22px; margin-left: auto; flex-shrink: 0; }
  .drop-card.loaded .drop-check { display: block; }

  /* ============================================================
     BOTÓN PRINCIPAL — Brand Book §7 (botón primario)
  ============================================================ */
  .submit-area { margin-top: 20px; }
  .btn-main {
    width: 100%; padding: 14px 24px; border-radius: var(--radius-md); border: none;
    background: var(--navy); color: white; font-weight: 700; font-size: 16px;
    cursor: pointer; transition: 0.2s; display: flex; justify-content: center;
    align-items: center; gap: 10px; letter-spacing: -0.02em;
    box-shadow: var(--shadow-sm);
  }
  .btn-main:hover    { background: var(--accent); box-shadow: var(--shadow-lg); }
  .btn-main:active   { transform: scale(0.98); }
  .btn-main:disabled { background: #94A3B8; cursor: not-allowed; box-shadow: none; }

  :focus-visible {
    outline: 2px solid var(--navy);
    outline-offset: 3px;
  }

  /* ============================================================
     PANEL DE ERRORES
  ============================================================ */
  .result-box       { display: none; margin-top: 24px; padding: 24px; border-radius: var(--radius); }
  .result-box.error { background: rgba(189, 15, 20, 0.04); border: 1px solid rgba(189, 15, 20, 0.15); }

  .table-container  { background: white; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid rgba(189, 15, 20, 0.15); margin-top: 16px; overflow-x: auto; }
  table             { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  th                { background: rgba(189, 15, 20, 0.08); padding: 12px 14px; text-align: left; color: #991B1B; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  td                { padding: 12px 14px; border-top: 1px solid rgba(189, 15, 20, 0.08); word-wrap: break-word; overflow-wrap: break-word; }
  th:nth-child(1), td:nth-child(1) { width: 60px; text-align: center; }
  th:nth-child(2), td:nth-child(2) { width: 120px; }
  th:nth-child(3), td:nth-child(3) { width: auto; }

  /* ============================================================
     MODAL DE CARGA
  ============================================================ */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(35, 31, 32, 0.5); backdrop-filter: blur(6px);
    display: flex; justify-content: center; align-items: center; z-index: 1000;
  }
  .loader-card {
    background: white; padding: 40px; border-radius: var(--radius); text-align: center;
    box-shadow: var(--shadow-lg);
  }
  .custom-loader {
    border: 4px solid var(--bg); border-top: 4px solid var(--navy);
    border-radius: 50%; width: 40px; height: 40px;
    animation: spin 0.8s linear infinite; margin: 0 auto 16px;
  }

  /* ============================================================
     BARRA DE PROGRESO — Gradiente corporativo
  ============================================================ */
  .progress-bar-fill {
    height: 6px; width: 0%;
    background: var(--gradient-brand);
    border-radius: 9999px;
    transition: width 0.5s ease-out;
  }

  /* ============================================================
     ANIMACIONES GLOBALES
  ============================================================ */
  @keyframes spin    { 100% { transform: rotate(360deg); } }
  @keyframes fadeIn  { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* ============================================================
     BARRA DE CONSULTA DE LOTES
  ============================================================ */
  .query-bar {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 20px;
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 24px;
    box-shadow: var(--shadow-sm);
  }
  .query-bar__icon { color: var(--navy); flex-shrink: 0; }
  .query-bar__input {
    flex: 1; border: 1.5px solid var(--border); border-radius: var(--radius-md);
    padding: 11px 16px; font-size: 14px; font-family: inherit;
    background: var(--card-bg); transition: .2s;
  }
  .query-bar__input:focus {
    outline: none; border-color: var(--navy); background: white;
    box-shadow: 0 0 0 3px rgba(37, 49, 80, 0.08);
  }
  .query-bar__btn {
    padding: 11px 20px; background: var(--navy); color: white;
    border: none; border-radius: var(--radius-md); font-weight: 700; font-size: 13px;
    cursor: pointer; transition: .2s; white-space: nowrap;
  }
  .query-bar__btn:hover    { background: var(--accent); }
  .query-bar__btn:disabled { background: #94A3B8; cursor: not-allowed; }

  /* ============================================================
     MODAL DE CONSULTA DE LOTES
  ============================================================ */
  .lote-modal-bg {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(35, 31, 32, 0.5); backdrop-filter: blur(4px);
    display: flex; align-items: flex-start; justify-content: center;
    z-index: 2000; padding: 40px 16px; box-sizing: border-box;
    overflow-y: auto;
  }
  .lote-modal {
    background: white; border-radius: var(--radius); width: 100%;
    max-width: 740px; overflow: hidden;
    border: 1px solid var(--border); margin: auto;
    animation: fadeIn .25s ease-out;
  }
  .lote-modal__head {
    background: var(--navy); padding: 20px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .lote-modal__title { margin: 0; font-size: 15px; font-weight: 700; color: white; }
  .lote-modal__id    { font-family: 'Roboto Mono', monospace; font-size: 12px; color: rgba(255,255,255,.75); background: rgba(255,255,255,.12); padding: 4px 12px; border-radius: 9999px; }
  .lote-modal__close {
    width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.15);
    border: none; color: white; font-size: 16px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .lote-modal__close:hover { background: rgba(255,255,255,.3); }
  .lote-modal__summary {
    padding: 14px 24px; background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex; gap: 24px; flex-wrap: wrap;
  }
  .lote-sum__label { font-size: 10px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: .1em; display: block; margin-bottom: 2px; }
  .lote-sum__val   { font-size: 14px; font-weight: 700; color: var(--navy); }
  .lote-contracts  { padding: 16px 24px; display: flex; flex-direction: column; gap: 10px; max-height: 400px; overflow-y: auto; }
  .lote-contract-card {
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 14px 18px; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start;
  }
  .lcc-name { font-weight: 700; font-size: 14px; color: var(--navy); }
  .lcc-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .lote-badge { display: inline-flex; padding: 4px 12px; border-radius: 9999px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .lb-terminado  { background: rgba(13, 122, 84, 0.08); color: var(--success); }
  .lb-analisis   { background: rgba(37, 49, 80, 0.06); color: var(--navy); }
  .lb-radicado   { background: rgba(255, 163, 0, 0.08); color: #92400e; }
  .lb-error      { background: rgba(189, 15, 20, 0.06); color: var(--danger); }
  .lb-pendiente  { background: rgba(15, 189, 183, 0.08); color: #0a8f8a; }
  .lb-default    { background: var(--bg); color: var(--text-muted); }
  .lote-empty    { text-align: center; padding: 40px 24px; color: var(--text-muted); font-size: 14px; }

  /* ============================================================
     CERTIFICACIÓN PAZ Y SALVO — Clases extraídas de inline
  ============================================================ */
  .opcion-card {
    cursor: pointer; padding: 18px; border-radius: var(--radius-md);
    border: 2px solid var(--border); background: white; transition: 0.2s;
    display: flex; align-items: flex-start; gap: 12px;
  }
  .opcion-card:hover { border-color: var(--navy); background: rgba(37, 49, 80, 0.02); }
  .opcion-card--selected { border-color: var(--danger); background: rgba(189, 15, 20, 0.03); }
  .opcion-card__radio { margin-top: 3px; accent-color: var(--danger); flex-shrink: 0; width: 18px; height: 18px; }
  .opcion-card__title { display: block; color: var(--navy); font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  .opcion-card__title i { color: var(--danger); margin-right: 6px; font-size: 13px; }
  .opcion-card__desc { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
  .opcion-card__highlight { color: var(--danger); display: block; margin-top: 4px; font-weight: 700; }
  .opcion-card__highlight--success { color: var(--success); }

  /* ============================================================
     SALUDO PERSONALIZADO + RESUMEN SEMANAL
  ============================================================ */
  .saludo-bar {
    background: linear-gradient(135deg, #253150 0%, #1a2540 100%);
    border-radius: var(--radius);
    padding: 18px 24px;
    margin-bottom: 20px;
    animation: fadeIn 0.6s ease-out;
  }
  .saludo-bar__left {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .saludo-bar__greeting {
    font-size: 17px;
    font-weight: 700;
    color: #ffffff;
  }
  .saludo-bar__summary {
    font-size: 13px;
    color: rgba(255,255,255,0.75);
    line-height: 1.5;
  }

  /* ============================================================
     STEPPER VISUAL DE PROGRESO
  ============================================================ */
  .stepper-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    padding: 14px 20px;
    margin-bottom: 20px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .stepper-step {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 9999px;
    transition: 0.2s;
  }
  .stepper-step span {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    transition: 0.2s;
  }
  .stepper-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    transition: 0.2s;
    flex-shrink: 0;
  }
  .stepper-line {
    width: 30px;
    height: 2px;
    background: var(--border);
    transition: 0.2s;
  }
  .stepper-step.active .stepper-dot {
    background: var(--navy);
    border-color: var(--navy);
    box-shadow: 0 0 0 3px rgba(37, 49, 80, 0.15);
  }
  .stepper-step.active span {
    color: var(--navy);
  }
  .stepper-step.done .stepper-dot {
    background: var(--success);
    border-color: var(--success);
  }
  .stepper-step.done span {
    color: var(--success);
  }
  .stepper-line.done {
    background: var(--success);
  }

  /* ============================================================
     HISTORIAL DE LOTES RECIENTES
  ============================================================ */
  .historial-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    cursor: pointer;
    transition: 0.2s;
    background: white;
  }
  .historial-card:hover {
    border-color: var(--navy);
    background: rgba(37, 49, 80, 0.02);
    transform: translateX(4px);
  }
  .historial-card__info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .historial-card__id {
    font-family: 'Roboto Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--navy);
  }
  .historial-card__meta {
    font-size: 11px;
    color: var(--text-muted);
  }

  /* ============================================================
     RESPONSIVE — Mobile first adjustments
  ============================================================ */
  @media (max-width: 640px) {
    .main-canvas { padding: 24px 16px; }
    .app-header { flex-direction: column; align-items: flex-start; gap: 12px; }
    .form-grid { grid-template-columns: 1fr; gap: 16px; }
    .downloads-bar { flex-direction: column; align-items: stretch; gap: 10px; }
    .downloads-bar__btns { justify-content: stretch; flex-direction: column; }
    .downloads-bar__btn { justify-content: center; text-align: center; }
    .query-bar { flex-direction: column; align-items: stretch; }
    .query-bar__btn { width: 100%; text-align: center; }
    .drop-card { padding: 16px; gap: 14px; }
    .drop-icon.excel { width: 44px; height: 44px; font-size: 22px; }
    .glass-section { padding: 20px 16px; }
    .lote-modal-bg { padding: 20px 12px; }
    .stepper-step span { font-size: 10px; }
    .stepper-line { width: 16px; }
  }

  /* Certificación grid responsive */
  @media (max-width: 700px) {
    #opcionesPS { grid-template-columns: 1fr !important; }
  }
</style>
