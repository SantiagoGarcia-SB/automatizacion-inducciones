<script>
/**
 * ============================================================
 * API Client — Wrapper promisificado de google.script.run
 * Con retry automático para errores transitorios.
 * ============================================================
 */

var _requestsActivos = 0;

/**
 * Llama una función del backend con retry y manejo de errores.
 * @param {string} fn - Nombre de la función en Api.js
 * @param {...*} args - Argumentos para la función
 * @returns {Promise<*>} Resultado de la función
 */
function callServer(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  var MAX_RETRIES = 2;
  var BASE_DELAY = 1500;

  return _intentarLlamada(fn, args, 0, MAX_RETRIES, BASE_DELAY);
}

function _intentarLlamada(fn, args, intento, maxRetries, baseDelay) {
  return new Promise(function(resolve, reject) {
    var runner = google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(function(error) {
        var msg = String(error.message || error || '');
        var esTransitorio = msg.indexOf('Service') !== -1
          || msg.indexOf('Timeout') !== -1
          || msg.indexOf('unavailable') !== -1;

        if (intento < maxRetries && esTransitorio) {
          var delay = baseDelay * Math.pow(2, intento);
          setTimeout(function() {
            _intentarLlamada(fn, args, intento + 1, maxRetries, baseDelay)
              .then(resolve)
              .catch(reject);
          }, delay);
        } else {
          reject(error);
        }
      });

    runner[fn].apply(runner, args);
  });
}

/**
 * Versión con spinner automático.
 * @param {string} fn - Nombre de la función
 * @param {...*} args - Argumentos
 * @returns {Promise<*>}
 */
function callServerConSpinner(fn) {
  var args = Array.prototype.slice.call(arguments);
  _requestsActivos++;
  if (_requestsActivos === 1) _mostrarSpinner();

  return callServer.apply(null, args)
    .then(function(result) {
      _requestsActivos--;
      if (_requestsActivos === 0) _ocultarSpinner();
      return result;
    })
    .catch(function(error) {
      _requestsActivos--;
      if (_requestsActivos === 0) _ocultarSpinner();
      throw error;
    });
}

function _mostrarSpinner() {
  var el = document.getElementById('viewLoading');
  if (el) el.style.display = 'flex';
}

function _ocultarSpinner() {
  var el = document.getElementById('viewLoading');
  if (el) el.style.display = 'none';
}

/**
 * Toast/notificación on-brand (reemplaza alert() nativo).
 * @param {string} mensaje - Texto a mostrar
 * @param {string} tipo - 'error' | 'success' | 'warning' | 'info'
 * @param {number} duracion - Milisegundos (default 4000)
 */
function _toast(mensaje, tipo, duracion) {
  tipo = tipo || 'info';
  duracion = duracion || 4000;

  var colores = {
    error: 'var(--rojo, var(--color-primary-red))',
    success: 'var(--verde, var(--color-success))',
    warning: 'var(--amarillo, var(--color-accent-orange))',
    info: 'var(--azul, var(--color-primary-navy))'
  };
  var iconos = { error: '⚠️', success: '✓', warning: '⚡', info: 'ℹ️' };

  var toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;top:20px;right:20px;z-index:400;'
    + 'background:var(--bg-card, var(--color-mono-0));border-radius:14px;padding:14px 18px;'
    + 'box-shadow:var(--shadow, var(--shadow-3));border-left:4px solid ' + colores[tipo] + ';'
    + 'display:flex;align-items:center;gap:10px;max-width:400px;'
    + 'font-family:"Manrope",sans-serif;font-size:0.875rem;font-weight:500;color:var(--text-main, var(--color-mono-900));'
    + 'animation:toast-in 0.2s ease-out;';
  toast.innerHTML = '<span style="font-size:1.1rem;flex-shrink:0;">' + iconos[tipo] + '</span>'
    + '<span>' + mensaje + '</span>';

  document.body.appendChild(toast);

  setTimeout(function() {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(20px)';
    toast.style.transition = 'opacity var(--duration-base), transform var(--duration-base)';
    setTimeout(function() { toast.remove(); }, 300);
  }, duracion);
}

/**
 * Modal de confirmación on-brand (reemplaza confirm() nativo).
 * @param {string} mensaje
 * @param {function} onConfirm - Se ejecuta si el usuario confirma
 */
function _confirmar(mensaje, onConfirm) {
  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(35,31,32,0.4);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:400;animation:modal-bg-in var(--duration-base) var(--ease-out);';

  overlay.innerHTML = '<div style="background:var(--bg-card, var(--color-mono-0));border-radius:var(--radius, var(--radius-lg));padding:32px;max-width:380px;width:100%;box-shadow:0 6px 20px rgba(37,49,80,0.12);text-align:center;animation:modal-scale-in var(--duration-slow) var(--ease-out);font-family:\'Manrope\',sans-serif;">'
    + '<p style="font-size:1rem;color:var(--text-main, var(--color-mono-900));margin:0 0 24px;line-height:1.5;">' + mensaje + '</p>'
    + '<div style="display:flex;gap:10px;justify-content:center;">'
    + '<button class="btn-outline-brand" id="_confirmCancelar" style="justify-content:center;">Cancelar</button>'
    + '<button class="btn-primary-brand" id="_confirmAceptar" style="justify-content:center;">Confirmar</button>'
    + '</div></div>';

  document.body.appendChild(overlay);

  document.getElementById('_confirmCancelar').onclick = function() { overlay.remove(); };
  document.getElementById('_confirmAceptar').onclick = function() { overlay.remove(); if (onConfirm) onConfirm(); };
  overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
}
</script>
