<style>
/**
 * ============================================================
 * DESIGN TOKENS — El Libertador Brand Book
 * Fuente única de verdad. Ningún valor (hex, px, ms, cubic-bezier)
 * puede aparecer hardcodeado fuera de este archivo.
 * ============================================================
 */
:root {
  /* ══ COLORES ══════════════════════════════════════════════ */

  /* Primarios (predominan siempre) */
  --color-primary-navy: #253150;
  --color-primary-red: #bd0f14;

  /* Secundarios (acento puntual: badges, alertas, CTAs) */
  --color-accent-darkred: #a1161b;
  --color-accent-red: #e11f27;
  --color-accent-orange: #ffa300;
  --color-accent-teal: #0fbdb7;

  /* Escala monocromática */
  --color-mono-900: #231f20;
  --color-mono-800: #403f3f;
  --color-mono-700: #524f4f;
  --color-mono-600: #5c5a5a;
  --color-mono-500: #6b6969; /* Ajustado: ratio ≥5.0:1 sobre blanco — WCAG AA */
  --color-mono-400: #918f8f;
  --color-mono-300: #bfbebe;
  --color-mono-200: #d5d3d4;
  --color-mono-100: #ebe7e8;
  --color-mono-0: #ffffff;

  /* Gradiente corporativo (rojo izq → azul der, horizontal) */
  --gradient-brand: linear-gradient(90deg, var(--color-primary-red) 0%, var(--color-primary-navy) 100%);

  /* Semánticos (derivados, para estados) */
  --color-success: #0d7a54;
  --color-success-bg: rgba(13, 122, 84, 0.06);
  --color-error: var(--color-primary-red);
  --color-error-bg: rgba(189, 15, 20, 0.04);
  --color-warning: #92400e;
  --color-warning-bg: rgba(255, 163, 0, 0.06);

  /* ══ TIPOGRAFÍA ═══════════════════════════════════════════ */

  --font-body: 'Ciencuadras', 'Inter', 'Poppins', system-ui, sans-serif;
  --font-heading: 'Ciencuadras', 'Inter', 'Poppins', system-ui, sans-serif;
  --font-mono: 'Roboto Mono', 'SF Mono', monospace;

  /* Escala tipográfica (alineada con Brand Book El Libertador) */
  --text-display: 2rem;      /* 32px — hero / dashboard KPIs */
  --text-h1: 1.5rem;         /* 24px — títulos principales */
  --text-h2: 1.25rem;        /* 20px — títulos de sección */
  --text-h3: 1.125rem;       /* 18px — subtítulos */
  --text-body: 1rem;         /* 16px — cuerpo principal */
  --text-sm: 0.875rem;       /* 14px — texto secundario */
  --text-xs: 0.75rem;        /* 12px — captions, labels */

  /* Pesos */
  --font-light: 300;
  --font-regular: 400;
  --font-medium: 500;
  --font-semibold: 600;
  --font-bold: 700;
  --font-extrabold: 800;

  /* Tracking */
  --tracking-tight: -0.02em;
  --tracking-normal: 0;
  --tracking-wide: 0.04em;
  --tracking-caps: 0.1em;

  /* Line height */
  --leading-tight: 1.15;
  --leading-normal: 1.5;
  --leading-relaxed: 1.65;

  /* ══ ESPACIADO (escala de 4px) ════════════════════════════ */

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* ══ RADIOS (Brand Book El Libertador) ═════════════════════ */

  --radius-xs: 6px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 28px;
  --radius-full: 9999px;

  /* ══ SOMBRAS (Brand Book — 3 niveles + elevaciones extra) ══ */

  --shadow-0: none;
  --shadow-1: 0 1px 3px rgba(35, 31, 32, 0.08);
  --shadow-2: 0 4px 6px -1px rgba(35, 31, 32, 0.06), 0 2px 4px -2px rgba(35, 31, 32, 0.04);
  --shadow-3: 0 10px 20px -4px rgba(35, 31, 32, 0.10);
  --shadow-4: 0 16px 48px rgba(35, 31, 32, 0.14);

  /* ══ TRANSICIONES ═════════════════════════════════════════ */

  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
  --duration-fast: 120ms;
  --duration-base: 200ms;
  --duration-slow: 350ms;

  /* ══ LAYOUT ═══════════════════════════════════════════════ */

  --sidebar-width: 232px;
  --header-height: 56px;
  --lifeline-height: 3px;
  --max-width-content: 960px;
  --max-width-narrow: 720px;
  --max-width-wide: 1200px;
}

/* ══ FUENTES ══════════════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap');

/* ══ REDUCED MOTION ═══════════════════════════════════════ */
@media (prefers-reduced-motion: reduce) {
  :root {
    --duration-fast: 0ms;
    --duration-base: 0ms;
    --duration-slow: 0ms;
  }
}
</style>
