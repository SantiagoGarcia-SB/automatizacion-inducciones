<style>
/**
 * ============================================================
 * Métricas Operativas de Lotes — Estilos del componente
 * ============================================================
 */

/* ═══ Etiqueta de sección (marca dónde empieza cada bloque: equipo / período / detalle) ═══ */
.metricas-lotes__section-label {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted, var(--color-mono-500));
  margin: var(--space-5) 0 var(--space-2);
  display: flex;
  align-items: center;
  gap: 8px;
}
.metricas-lotes__section-label::before {
  content: "";
  width: 16px;
  height: 2px;
  background: var(--rojo, var(--color-primary-red));
  border-radius: 2px;
  flex-shrink: 0;
}

/* ═══ BARRA DE FILTROS UNIFICADA ═══
   Diseño moderno con glassmorphism sutil, grupos diferenciados visualmente
   y transiciones fluidas para una experiencia premium. */
.metricas-lotes__filtro-grupo {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  flex-wrap: wrap;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-radius: 12px;
  padding: 10px 16px;
  border: 1px solid rgba(37, 49, 80, 0.06);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.metricas-lotes__filtro-grupo:hover {
  border-color: rgba(37, 49, 80, 0.12);
  box-shadow: 0 2px 8px rgba(37, 49, 80, 0.04);
}

.metricas-lotes__filtro-divisor {
  width: 1px;
  align-self: stretch;
  min-height: 36px;
  background: linear-gradient(180deg, transparent, var(--color-mono-200), transparent);
  flex-shrink: 0;
}

.drilldown-filters {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  flex-wrap: wrap;
}

.drilldown-filters__group {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.drilldown-filters__label {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--color-mono-500);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 0;
  white-space: nowrap;
}

.drilldown-filters__select {
  height: 36px;
  padding: 0 var(--space-8) 0 var(--space-3);
  border: 1.5px solid var(--color-mono-200);
  border-radius: 10px;
  font-size: 0.82rem;
  font-family: var(--font-body);
  font-weight: 500;
  background: var(--color-mono-0);
  color: var(--color-mono-800);
  cursor: pointer;
  appearance: auto;
  transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
}

.drilldown-filters__select:hover {
  border-color: var(--color-mono-400);
}

.drilldown-filters__select:focus {
  border-color: var(--color-primary-navy);
  outline: none;
  box-shadow: 0 0 0 3px rgba(37, 49, 80, 0.08);
  transform: translateY(-1px);
}

/* Cuando drilldown-filters está dentro del grupo "Equipo", se integra en su flujo flex */
.metricas-lotes__filtro-grupo .drilldown-filters {
  display: contents;
}

/* ═══ FILTROS DE MÉTRICAS ═══ */
.metricas-lotes__filtros-card {
  padding: var(--space-4) var(--space-5);
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(248,249,252,0.9));
  border: 1px solid rgba(37, 49, 80, 0.07);
  box-shadow: 0 1px 3px rgba(37, 49, 80, 0.04), 0 4px 16px rgba(37, 49, 80, 0.02);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  transition: box-shadow 0.25s ease;
}

.metricas-lotes__filtros-card:hover {
  box-shadow: 0 2px 6px rgba(37, 49, 80, 0.06), 0 8px 24px rgba(37, 49, 80, 0.04);
}

.metricas-lotes__filtros {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
}

.metricas-lotes__input-date {
  height: 36px;
  padding: 0 var(--space-3);
  border: 1.5px solid var(--color-mono-200);
  border-radius: 10px;
  font-size: 0.82rem;
  font-weight: 500;
  font-family: var(--font-body);
  background: var(--color-mono-0);
  color: var(--color-mono-800);
  cursor: pointer;
  transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
}

.metricas-lotes__input-date:hover {
  border-color: var(--color-mono-400);
}

.metricas-lotes__input-date:focus {
  border-color: var(--color-primary-navy);
  box-shadow: 0 0 0 3px rgba(37, 49, 80, 0.08);
  outline: none;
  transform: translateY(-1px);
}

.metricas-lotes__filtro-error {
  font-size: var(--text-xs);
  color: var(--color-primary-red);
  width: 100%;
  margin-top: calc(-1 * var(--space-2));
}

.metricas-lotes__chips {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: var(--space-2) 0;
}

.metricas-lotes__chips-label {
  font-size: 0.68rem;
  font-weight: 700;
  color: var(--color-mono-400);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-right: 4px;
}

.metricas-lotes__chip {
  padding: 6px 14px;
  border: 1.5px solid var(--color-mono-200);
  border-radius: 20px;
  font-size: 0.76rem;
  font-weight: 500;
  color: var(--color-mono-600);
  background: var(--color-mono-0);
  cursor: pointer;
  transition: all 0.2s cubic-bezier(.16,1,.3,1);
  white-space: nowrap;
  user-select: none;
}

.metricas-lotes__chip:hover {
  border-color: var(--color-primary-navy);
  color: var(--color-primary-navy);
  background: rgba(37, 49, 80, 0.03);
  transform: translateY(-1px);
  box-shadow: 0 2px 6px rgba(37, 49, 80, 0.08);
}

.metricas-lotes__chip--active {
  background: var(--color-primary-navy);
  color: #fff;
  border-color: var(--color-primary-navy);
  box-shadow: 0 3px 10px rgba(37, 49, 80, 0.2);
  transform: translateY(-1px);
}

.metricas-lotes__chip--active:hover {
  background: var(--color-primary-navy);
  color: #fff;
  box-shadow: 0 4px 14px rgba(37, 49, 80, 0.25);
}

.metricas-lotes__chip--disabled,
.metricas-lotes__chip--disabled:hover {
  opacity: 0.4;
  cursor: not-allowed;
  pointer-events: none;
  transform: none;
  box-shadow: none;
}

.metricas-lotes__input-date:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  background: var(--color-mono-100, #f0f0f0);
}

/* ═══ Resumen: hero + barra proporcional + detalle (reemplaza los 4 grupos de tarjetas repetidas) ═══
   Apilado a ancho completo (Lotes arriba, Solicitudes debajo) — con 4
   categorías en Solicitudes, lado a lado quedaba muy angosto y las
   tarjetas de detalle se desbordaban. */
.metricas-lotes__resumen-grid {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  margin-bottom: var(--space-2);
}

.metricas-lotes__resumen-bloque .metric-hero-card { margin-bottom: 14px; }
.metricas-lotes__resumen-bloque .metric-split-bar { margin-bottom: 14px; }
.metricas-lotes__resumen-bloque .metrics-row-detail { margin-bottom: 0; }

/* min-width:0 en las tarjetas de detalle: por defecto un ítem de grid no
   se achica por debajo del tamaño de su contenido, así que con 4
   categorías (Solicitudes) el texto largo ("Reconsideradas") empujaba el
   ancho real más allá de la columna — causa real del desborde. */
.metricas-lotes__resumen-bloque .metrics-row-detail > .metric-detail-card {
  min-width: 0;
}
@media (max-width: 640px) {
  .metricas-lotes__resumen-bloque .metrics-row-detail { grid-template-columns: 1fr 1fr !important; }
}
@media (max-width: 420px) {
  .metricas-lotes__resumen-bloque .metrics-row-detail { grid-template-columns: 1fr !important; }
}

/* .metricas-lotes__kpi es ahora solo un hook funcional (selector de JS para
   click-to-filter) sobre .metric-detail-card — sin estilos de caja propios
   para no pelear con los de esa clase. Solo aporta el estado "activo". */
.metricas-lotes__kpi--active {
  border-color: var(--azul, var(--color-primary-navy)) !important;
  background: var(--azul-light, rgba(37, 49, 80, 0.06)) !important;
  box-shadow: 0 0 0 2px var(--azul, var(--color-primary-navy)) inset;
}

/* Ahora vive dentro de .table-container, que ya aporta fondo/borde/radio */
.metricas-lotes__tabla-wrap {
  overflow-x: auto;
  max-height: none;
}

/* Grilla de totales por columna — desglose de solicitudes */
.metricas-lotes__totales-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 10px;
  margin-bottom: 16px;
  padding: 14px 16px;
  background: linear-gradient(135deg, rgba(37,49,80,0.02), rgba(37,49,80,0.04));
  border-radius: 12px;
  border: 1px solid rgba(37,49,80,0.06);
}

.metricas-lotes__total-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 8px 4px;
  border-radius: 8px;
  transition: background 0.15s ease;
}

.metricas-lotes__total-item:hover {
  background: rgba(255,255,255,0.8);
}

.metricas-lotes__total-item--active {
  background: rgba(255,255,255,0.95);
  box-shadow: 0 2px 8px rgba(37,49,80,0.1);
  outline: 2px solid var(--color-primary-navy);
  outline-offset: -2px;
  border-radius: 8px;
}

.metricas-lotes__badge-filtro {
  transition: all 0.15s ease;
}

.metricas-lotes__badge-filtro:hover {
  transform: translateY(-1px);
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.metricas-lotes__badge-filtro--active {
  transform: translateY(-1px);
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

.metricas-lotes__total-value {
  font-size: 1.3rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}

.metricas-lotes__total-label {
  font-size: 0.65rem;
  font-weight: 600;
  color: var(--color-mono-500);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  text-align: center;
  line-height: 1.2;
}

.metricas-lotes__tabla {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.875rem;
  min-width: 820px;
}

.metricas-lotes__tabla thead {
  background: var(--bg-page, #F4F5F8);
  position: sticky;
  top: 0;
  z-index: 1;
}

.metricas-lotes__tabla th {
  padding: 10px 12px;
  text-align: center;
  font-size: 0.67rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted, var(--color-mono-0));
  border-bottom: none;
  border-right: 1px solid var(--border, rgba(0,0,0,0.06));
  white-space: normal;
  line-height: 1.4;
  vertical-align: middle;
}

.metricas-lotes__tabla th:last-child {
  border-right: none;
}

.metricas-lotes__tabla th small {
  display: block;
  font-size: 10px;
  font-weight: var(--font-medium);
  color: var(--text-light, rgba(0,0,0,0.4));
  text-transform: none;
  letter-spacing: normal;
  margin-top: 2px;
}

.metricas-lotes__tabla th:first-child,
.metricas-lotes__tabla th:nth-child(2),
.metricas-lotes__tabla th:nth-child(3) {
  text-align: left;
}

.metricas-lotes__tabla td {
  padding: var(--space-3) var(--space-2);
  border-bottom: 1px solid rgba(0, 0, 0, 0.04);
  color: var(--color-mono-800);
  vertical-align: middle;
  text-align: center;
}

.metricas-lotes__tabla td:first-child,
.metricas-lotes__tabla td:nth-child(2),
.metricas-lotes__tabla td:nth-child(3) {
  text-align: left;
}

.metricas-lotes__tabla tbody tr:nth-child(even) {
  background: rgba(37, 49, 80, 0.02);
}

.metricas-lotes__tabla tbody tr:hover {
  background: rgba(37, 49, 80, 0.05);
}

.metricas-lotes__tabla .num-cell {
  text-align: center;
  font-weight: var(--font-medium);
  font-variant-numeric: tabular-nums;
}

.metricas-lotes__tabla .num-cell--highlight {
  font-weight: var(--font-bold);
  color: var(--color-primary-navy);
}

.metricas-lotes__paginacion {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-3) var(--space-4);
  border-top: 1px solid var(--color-mono-100);
  background: var(--color-mono-0);
}

.metricas-lotes__paginacion-info {
  font-size: var(--text-xs);
  color: var(--color-mono-500);
}

.metricas-lotes__paginacion-btns {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.metricas-lotes__pag-btn {
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-mono-200);
  border-radius: var(--radius-xs);
  background: var(--color-mono-0);
  font-size: var(--text-xs);
  font-weight: var(--font-medium);
  color: var(--color-mono-700);
  cursor: pointer;
  transition: background var(--duration-fast) var(--ease-in-out),
              border-color var(--duration-fast) var(--ease-in-out);
}

.metricas-lotes__pag-btn:hover:not(:disabled) {
  background: rgba(37, 49, 80, 0.05);
  border-color: var(--color-primary-navy);
}

.metricas-lotes__pag-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.metricas-lotes__pag-btn--active {
  background: var(--color-primary-navy);
  color: var(--color-mono-0);
  border-color: var(--color-primary-navy);
}

.metricas-lotes__pag-btn--active:hover {
  background: var(--color-primary-navy);
}

.metricas-lotes__badge--aprobado {
  display: inline-flex;
  padding: 4px 11px;
  border-radius: 20px;
  font-size: 0.72rem;
  font-weight: 700;
  background: var(--verde-light, rgba(5, 150, 105, 0.1));
  color: var(--verde, var(--color-accent-teal));
}

.metricas-lotes__badge--negado {
  display: inline-flex;
  padding: 4px 11px;
  border-radius: 20px;
  font-size: 0.72rem;
  font-weight: 700;
  background: var(--rojo-light, rgba(189, 15, 20, 0.08));
  color: var(--rojo, var(--color-primary-red));
}

.metricas-lotes__badge--proceso {
  display: inline-flex;
  padding: 4px 11px;
  border-radius: 20px;
  font-size: 0.72rem;
  font-weight: 700;
  background: var(--amarillo-light, rgba(255, 163, 0, 0.1));
  color: var(--amarillo, var(--color-accent-orange));
}

.metricas-lotes__empty {
  text-align: center;
  padding: var(--space-12) var(--space-6);
  animation: metricas-fadeIn 0.4s cubic-bezier(.16,1,.3,1);
}

.metricas-lotes__empty-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 72px;
  height: 72px;
  margin: 0 auto var(--space-4);
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(37,49,80,0.04), rgba(37,49,80,0.08));
  animation: metricas-empty-bob 3s ease-in-out infinite;
}

.metricas-lotes__empty-icon svg {
  width: 36px;
  height: 36px;
  opacity: 0.6;
}

@keyframes metricas-empty-bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

.metricas-lotes__empty-title {
  font-size: 1rem;
  font-weight: 600;
  color: var(--color-mono-700);
  margin: 0 0 6px;
}

.metricas-lotes__empty-text {
  font-size: var(--text-body);
  color: var(--color-mono-500);
  margin: 0 0 var(--space-4);
  max-width: 340px;
  margin-left: auto;
  margin-right: auto;
  line-height: 1.5;
}

.metricas-lotes__empty-action {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--color-primary-navy, #253150);
  opacity: 0.7;
  cursor: default;
}

.metricas-lotes__empty-action svg {
  width: 14px;
  height: 14px;
}

.metricas-lotes__loading {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-10);
  gap: var(--space-3);
}

.metricas-lotes__loading-text {
  font-size: var(--text-sm);
  color: var(--color-mono-500);
}

/* ===== Skeleton loading — shimmer wave ===== */
.metricas-lotes__skeleton {
  position: relative;
}

.metricas-lotes__skeleton-card,
.metricas-lotes__skeleton-chart,
.metricas-lotes__skeleton-table {
  background: linear-gradient(
    90deg,
    var(--color-mono-100) 0%,
    rgba(255,255,255,0.6) 40%,
    var(--color-mono-100) 80%
  );
  background-size: 300% 100%;
  animation: metricas-shimmer 1.8s ease-in-out infinite;
  border-radius: var(--radius-md);
  position: relative;
  overflow: hidden;
}

.metricas-lotes__skeleton-card { height: 80px; }
.metricas-lotes__skeleton-chart { height: 240px; }
.metricas-lotes__skeleton-table { height: 300px; }

/* Shimmer wave: gradiente que se desplaza horizontalmente */
@keyframes metricas-shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* Skeleton mejorado para los filtros tipo select */
.metricas-lotes__skeleton-select {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 38px;
  min-width: 160px;
  padding: 0 12px;
  border-radius: var(--radius-xs);
  border: 1px solid var(--color-mono-200);
  background: linear-gradient(
    90deg,
    var(--color-mono-50, #f9f9f9) 0%,
    rgba(255,255,255,0.8) 40%,
    var(--color-mono-50, #f9f9f9) 80%
  );
  background-size: 300% 100%;
  animation: metricas-shimmer 1.8s ease-in-out infinite;
}

.metricas-lotes__skeleton-select__icon {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--color-mono-200);
  flex-shrink: 0;
  animation: metricas-dot-pulse 1.4s ease-in-out infinite;
}

.metricas-lotes__skeleton-select__text {
  height: 10px;
  width: 80px;
  border-radius: 4px;
  background: var(--color-mono-200);
}

@keyframes metricas-dot-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.85); }
}

/* Skeleton para chips de sucursal */
.metricas-lotes__skeleton-chips {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.metricas-lotes__skeleton-chip {
  height: 28px;
  border-radius: 20px;
  background: linear-gradient(
    90deg,
    var(--color-mono-100) 0%,
    rgba(255,255,255,0.6) 40%,
    var(--color-mono-100) 80%
  );
  background-size: 300% 100%;
  animation: metricas-shimmer 1.8s ease-in-out infinite;
}

/* ===== Estado de loading — spinner central con fondo de puntos ===== */
.metricas-lotes__loading-fullstate {
  position: relative;
  min-height: 380px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-md);
  overflow: hidden;
  animation: metricas-fadeIn 0.3s ease-out;
}

/* Fondo sutil de puntos (dot pattern) */
.metricas-lotes__loading-dots-bg {
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle, rgba(37,49,80,0.06) 1px, transparent 1px);
  background-size: 20px 20px;
  opacity: 0.7;
}

.metricas-lotes__loading-center {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

/* Spinner ring circular — estilo brand (rojo) */
.metricas-lotes__spinner-ring {
  width: 48px;
  height: 48px;
  border: 3.5px solid rgba(189, 15, 20, 0.15);
  border-top-color: var(--rojo, #bd0f14);
  border-radius: 50%;
  animation: metricas-spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}

@keyframes metricas-spin {
  to { transform: rotate(360deg); }
}

.metricas-lotes__loading-msg {
  margin: 0;
  font-size: 0.92rem;
  font-weight: 600;
  color: var(--color-mono-700);
  letter-spacing: 0.01em;
}

.metricas-lotes__loading-sub {
  margin: 0;
  font-size: 0.78rem;
  font-weight: 400;
  color: var(--color-mono-400);
}

/* Banner inline (para el botón loading) */
.metricas-lotes__loading-spinner {
  width: 18px;
  height: 18px;
  border: 2.5px solid var(--color-mono-200);
  border-top-color: var(--rojo, #bd0f14);
  border-radius: 50%;
  animation: metricas-spin 0.8s linear infinite;
}

/* ===== Fade-in mejorado para resultados ===== */
.metricas-lotes__fade-in {
  animation: metricas-fadeIn 0.4s cubic-bezier(.16,1,.3,1);
}

@keyframes metricas-fadeIn {
  from { opacity: 0; transform: translateY(12px) scale(0.99); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@media (prefers-reduced-motion: reduce) {

<script>
/**
 * ============================================================
 * Métricas Operativas de Lotes — Lógica del componente
 * ============================================================
 */

// Cargar Google Charts al iniciar
if (typeof google !== 'undefined' && google.charts) {
  google.charts.load('current', { packages: ['corechart'] });
}

var MetricasLotesView = (function() {
  'use strict';

  var ROLES_PERMITIDOS = ['DIRECTOR', 'GERENTE', 'ADMIN', 'LIDER', 'ASESOR'];
  var _cargando = false;
  var _datosActuales = null;
  var _filtroActivo = null;
  var _filtroColumna = null; // Filtro por columna numérica (badges/grilla de totales)
  var _paginaActual = 1;
  var _filasPorPagina = 10;
  var _segmentoActivo = 'todos';
  var _sucursalActiva = 'todas';
  var _datosHistorico = null;
  var _desglosePrecargado = null;
  var _MAX_RANGO_DIAS = 183;
  // null = sin filtro de equipo; objeto {CODIGOLOTE: true, ...} = solo esos lotes
  // (lo puebla scripts_app.html al cambiar Director/Comercial — ver aplicarFiltroComercial)
  var _loteIdsFiltrados = null;

  /**
   * Aplica (o limpia) el filtro de equipo (Director/Comercial) sobre el
   * resumen, el análisis y la tabla de esta vista.
   * @param {Object|null} loteIdsPermitidos - Mapa {codigoLoteEnMayus: true} o null para quitar el filtro
   */
  function aplicarFiltroComercial(loteIdsPermitidos) {
    _loteIdsFiltrados = loteIdsPermitidos;
    _paginaActual = 1;
    if (_datosActuales) _renderizarVista();
  }

  /**
   * Inicializa el componente: llena inputs de fecha, carga datos.
   * Se invoca cuando el usuario navega a la vista de métricas.
   */
  function init() {
    _inicializarFechas();

    // Mostrar loading inmediatamente en el contenido para que el usuario
    // vea feedback instantáneo al navegar a la sección
    var contenedor = document.getElementById('metricasLotesContenido');
    if (contenedor && !contenedor.innerHTML.trim()) {
      contenedor.innerHTML = _htmlLoading();
    }

    _cargarMetricas();
    _conectarEventos();
  }

  /**
   * Verifica si el usuario actual tiene acceso a esta vista.
   * @returns {boolean}
   */
  function tieneAcceso() {
    if (!APP_USUARIO || !APP_USUARIO.rol) return false;
    return ROLES_PERMITIDOS.indexOf(APP_USUARIO.rol.toUpperCase()) !== -1;
  }

  /**
   * Inicializa los inputs de fecha nativos.
   * Desde = primer día del mes actual, Hasta = hoy.
   */
  function _inicializarFechas() {
    var hoy = new Date();
    var primerDia = new Date(hoy.getFullYear(), hoy.getMonth(), 1);

    var inputDesde = document.getElementById('metricasLotesFechaDesde');
    var inputHasta = document.getElementById('metricasLotesFechaHasta');

    if (inputDesde) inputDesde.value = _formatearFechaISO(primerDia);
    if (inputHasta) inputHasta.value = _formatearFechaISO(hoy);
  }

  /**
   * Formatea Date a YYYY-MM-DD.
   * @param {Date} fecha
   * @returns {string}
   */
  function _formatearFechaISO(fecha) {
    var y = fecha.getFullYear();
    var m = String(fecha.getMonth() + 1).padStart(2, '0');
    var d = String(fecha.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + d;
  }

  /**
   * Conecta los eventos de los filtros, botón consultar y chips de segmentación.
   */
  function _conectarEventos() {
    var btnConsultar = document.getElementById('metricasLotesBtn');
    if (btnConsultar) {
      btnConsultar.addEventListener('click', function() {
        _cargarMetricas();
      });
    }

    // Chips de segmentación
    var chips = document.querySelectorAll('.metricas-lotes__chip[data-segmento]');
    for (var i = 0; i < chips.length; i++) {
      chips[i].addEventListener('click', function() {
        _segmentoActivo = this.getAttribute('data-segmento');
        // Actualizar visual de chips
        var allChips = document.querySelectorAll('.metricas-lotes__chip[data-segmento]');
        for (var j = 0; j < allChips.length; j++) {
          allChips[j].classList.remove('metricas-lotes__chip--active');
        }
        this.classList.add('metricas-lotes__chip--active');
        _paginaActual = 1;
        _renderizarVista();
      });
    }
  }

  /**
   * Obtiene las fechas del rango seleccionado desde los inputs nativos.
   * @returns {{fechaDesde: string, fechaHasta: string}|null}
   */
  function _obtenerRangoFechas() {
    var inputDesde = document.getElementById('metricasLotesFechaDesde');
    var inputHasta = document.getElementById('metricasLotesFechaHasta');

    var fechaDesde = inputDesde ? inputDesde.value : '';
    var fechaHasta = inputHasta ? inputHasta.value : '';

    if (!fechaDesde || !fechaHasta) {
      _mostrarError('Selecciona ambas fechas (Desde y Hasta).');
      return null;
    }

    var dDesde = new Date(fechaDesde + 'T00:00:00');
    var dHasta = new Date(fechaHasta + 'T00:00:00');

    if (dDesde.getTime() > dHasta.getTime()) {
      _mostrarError('La fecha "Desde" no puede ser posterior a "Hasta".');
      return null;
    }

    var diffDias = Math.ceil((dHasta.getTime() - dDesde.getTime()) / (1000 * 60 * 60 * 24));
    if (diffDias > _MAX_RANGO_DIAS) {
      _mostrarError('El rango máximo es de 6 meses (' + _MAX_RANGO_DIAS + ' días). Rango actual: ' + diffDias + ' días.');
      return null;
    }

    _ocultarError();
    return { fechaDesde: fechaDesde, fechaHasta: fechaHasta };
  }

  /**
   * Muestra un mensaje de error en el panel de filtros.
   * @param {string} msg
   */
  function _mostrarError(msg) {
    var errorDiv = document.getElementById('metricasLotesFiltroError');
    if (errorDiv) {
      errorDiv.textContent = msg;
      errorDiv.style.display = 'block';
    }
  }

  /**
   * Oculta el mensaje de error.
   */
  function _ocultarError() {
    var errorDiv = document.getElementById('metricasLotesFiltroError');
    if (errorDiv) {
      errorDiv.style.display = 'none';
      errorDiv.textContent = '';
    }
  }

  /**
   * Carga las métricas del rango de fechas seleccionado desde el backend.
   * Si los datos ya están pre-cargados en CacheManager (carga inicial), los usa directamente.
   */
  function _cargarMetricas() {
    if (_cargando) return;

    var rango = _obtenerRangoFechas();
    if (!rango) return;

    // Verificar si ya tenemos datos pre-cargados para este rango exacto
    var rangoPrecargado = CacheManager.get('metricas-lotes-rango');
    var datosPrecargados = CacheManager.get('metricas-lotes');
    if (datosPrecargados && rangoPrecargado &&
        rangoPrecargado.fechaDesde === rango.fechaDesde &&
        rangoPrecargado.fechaHasta === rango.fechaHasta) {
      _renderizarResultados(datosPrecargados);
      // Limpiar para que la siguiente consulta vaya al servidor
      CacheManager.invalidar(['metricas-lotes', 'metricas-lotes-rango']);
      return;
    }

    _cargando = true;
    _deshabilitarFiltros();

    // Feedback visual en botón
    var btn = document.getElementById('metricasLotesBtn');
    if (btn) {
      btn.innerHTML = '<span class="metricas-lotes__loading-spinner" style="width:14px;height:14px;border-width:2px;display:inline-block;vertical-align:middle;margin-right:6px;"></span>Consultando';
      btn.classList.add('btn--loading');
    }

    var contenedor = document.getElementById('metricasLotesContenido');
    if (contenedor) {
      contenedor.innerHTML = _htmlLoading();
    }

    callServer('api_obtenerMetricasLotes', rango.fechaDesde, rango.fechaHasta)
      .then(function(datos) {
        _cargando = false;
        _restaurarBoton();
        _habilitarFiltros();
        _renderizarResultados(datos);
      })
      .catch(function(err) {
        _cargando = false;
        _restaurarBoton();
        _habilitarFiltros();
        console.error('Error cargando métricas de lotes:', err);
        _renderizarResultados(null);
      });

    // Cargar histórico en paralelo (no bloquea la vista principal)
    callServer('api_obtenerMetricasLotesHistorico', 6)
      .then(function(historico) {
        _datosHistorico = historico;
        _dibujarGraficasTendencia(historico);
      })
      .catch(function(err) {
        console.error('Error cargando histórico:', err);
        _datosHistorico = null;
      });
  }

  /**
   * Restaura el botón Consultar a su estado normal.
   */
  function _restaurarBoton() {
    var btn = document.getElementById('metricasLotesBtn');
    if (btn) {
      btn.textContent = 'Consultar';
      btn.classList.remove('btn--loading');
    }
  }

  /**
   * Deshabilita los controles de filtro (fechas, botón, chips de segmento)
   * para evitar interacciones mientras la vista está cargando datos.
   */
  function _deshabilitarFiltros() {
    var inputDesde = document.getElementById('metricasLotesFechaDesde');
    var inputHasta = document.getElementById('metricasLotesFechaHasta');
    var btn = document.getElementById('metricasLotesBtn');
    var chips = document.querySelectorAll('.metricas-lotes__chip[data-segmento]');

    if (inputDesde) inputDesde.disabled = true;
    if (inputHasta) inputHasta.disabled = true;
    if (btn) btn.disabled = true;
    for (var i = 0; i < chips.length; i++) {
      chips[i].disabled = true;
      chips[i].classList.add('metricas-lotes__chip--disabled');
    }
  }

  /**
   * Habilita los controles de filtro una vez finalizada la carga.
   */
  function _habilitarFiltros() {
    var inputDesde = document.getElementById('metricasLotesFechaDesde');
    var inputHasta = document.getElementById('metricasLotesFechaHasta');
    var btn = document.getElementById('metricasLotesBtn');
    var chips = document.querySelectorAll('.metricas-lotes__chip[data-segmento]');

    if (inputDesde) inputDesde.disabled = false;
    if (inputHasta) inputHasta.disabled = false;
    if (btn) btn.disabled = false;
    for (var i = 0; i < chips.length; i++) {
      chips[i].disabled = false;
      chips[i].classList.remove('metricas-lotes__chip--disabled');
    }
  }

  /**
   * Renderiza los resultados (resumen + tabla) o el estado vacío.
   * @param {Object|null} datos - Respuesta de api_obtenerMetricasLotes
   */
  function _renderizarResultados(datos) {
    var contenedor = document.getElementById('metricasLotesContenido');
    if (!contenedor) return;

    _datosActuales = datos;
    _filtroActivo = null;
    _paginaActual = 1;

    if (!datos || !datos.detallePorLote || datos.detallePorLote.length === 0) {
      contenedor.innerHTML = '<div class="metricas-lotes__fade-in">' + _htmlEstadoVacio() + '</div>';
      _ocultarChipsSucursal();
      return;
    }

    // Llenar chips de sucursal dinámicamente
    _llenarChipsSucursal(datos.sucursales || []);

    _renderizarVista();
  }

  /**
   * Renderiza KPIs + gráficas + tabla paginada + controles de paginación.
   * Los KPIs y gráficas se recalculan en base al segmento de solicitudes activo.
   */
  function _renderizarVista() {
    var contenedor = document.getElementById('metricasLotesContenido');
    if (!contenedor || !_datosActuales) return;

    var detalleFiltrado = _obtenerDetalleFiltrado();
    var totalPaginas = Math.ceil(detalleFiltrado.length / _filasPorPagina);
    if (_paginaActual > totalPaginas) _paginaActual = totalPaginas || 1;

    var inicio = (_paginaActual - 1) * _filasPorPagina;
    var fin = inicio + _filasPorPagina;
    var detallePagina = detalleFiltrado.slice(inicio, fin);

    var resumenVista = _calcularResumenFiltrado();

    var html = '<div class="metricas-lotes__fade-in">'
      + '<div class="metricas-lotes__section-label">Resumen del período</div>'
      + _htmlResumen(resumenVista)
      + '<div id="metricasLotesDesglose"></div>'
      + '<div class="metricas-lotes__section-label">Análisis del período</div>'
      + _htmlCharts()
      + '<div class="table-container" style="margin-top:24px;padding:20px;">'
      + '<div class="table-header">'
      + '<div><div class="table-title">Detalle por Lote</div>'
      + '<div class="table-sub">' + detalleFiltrado.length + ' registros</div></div>'
      + '<button class="metricas-lotes__csv-btn" id="metricasLotesCsvBtn" type="button" title="Descargar CSV">⬇ CSV</button>'
      + '</div>'
      + _htmlTotalesTabla(detalleFiltrado)
      + _htmlTablaDetalle(detallePagina)
      + _htmlPaginacion(detalleFiltrado.length, totalPaginas)
      + '</div>'
      + '</div>';

    contenedor.innerHTML = html;
    _conectarEventosKpis();
    _conectarEventosPaginacion();
    _conectarEventoCsv();
    _conectarEventosFiltroColumna();
    _actualizarEstadoActivoKpis();
    _dibujarGraficas(resumenVista);

    // Redibujar tendencia histórica si los datos están disponibles
    if (_datosHistorico) {
      _dibujarGraficasTendencia(_datosHistorico);
    }

    // Cargar pipeline de distribución En Proceso (siempre visible)
    _cargarDesgloseEnProceso();
  }

   * Conecta eventos click a los badges y grilla de totales para filtrar la tabla.
   * Click en un item activo lo desactiva (toggle). El filtro afecta tabla + CSV.
   */
  function _conectarEventosFiltroColumna() {

      items[i].addEventListener('click', function() {

        } else {
          _filtroColumna = filtro;
        }
        _paginaActual = 1;
        _renderizarVista();
      });
    }
  }

  /**
   * Recalcula el resumen (cards) considerando el segmento de solicitudes activo + sucursal.
   * @returns {Object} resumen recalculado
   */
  function _calcularResumenFiltrado() {
    if (!_datosActuales || !_datosActuales.detallePorLote) {
      return _datosActuales ? _datosActuales.resumen : {};
    }

    // Filtrar por equipo (Director/Comercial), si aplica
    var detalleSegmentado = _datosActuales.detallePorLote;
    if (_loteIdsFiltrados) {
      detalleSegmentado = detalleSegmentado.filter(function(d) {
        return !!_loteIdsFiltrados[(d.codigoLote || '').toUpperCase().trim()];
      });
    }

    // Filtrar detalle por segmento (si aplica)
    if (_segmentoActivo && _segmentoActivo !== 'todos') {
      detalleSegmentado = detalleSegmentado.filter(function(d) {
        var cant = d.cantidadSolicitudes || 0;
        switch (_segmentoActivo) {
          case '1-50': return cant >= 1 && cant <= 50;
          case '51-100': return cant >= 51 && cant <= 100;
          case '101-200': return cant >= 101 && cant <= 200;
          case '201-300': return cant >= 201 && cant <= 300;
          case '301+': return cant >= 301;
          default: return true;
        }
      });
    }

    // Filtrar por sucursal (si aplica)
    if (_sucursalActiva && _sucursalActiva !== 'todas') {
      detalleSegmentado = detalleSegmentado.filter(function(d) {
        return (d.sucursal || '').toUpperCase() === _sucursalActiva.toUpperCase();
      });
    }

    // Recalcular métricas de lotes
    var lotesAprobados = 0;
    var lotesNegados = 0;
    var lotesEnProceso = 0;
    var totalSolicitudes = 0;
    var solicitudesAprobadas = 0;
    var solicitudesNegadas = 0;
    var solicitudesReconsideradas = 0;
    var solicitudesEnProceso = 0;

    for (var i = 0; i < detalleSegmentado.length; i++) {
      var d = detalleSegmentado[i];
      var res = (d.resultadoLote || '').toUpperCase();

      if (res === 'APROBADO') lotesAprobados++;
      else if (res === 'NEGADO') lotesNegados++;
      else lotesEnProceso++;

      // Conteo crudo por REGISTRO ANALISTA SAI (sin cruzar con RESULTADO LOTE/SOLICITUD)
      totalSolicitudes += d.totalSolicitudesRaw || 0;
      solicitudesAprobadas += d.solicitudesAprobadasRaw || 0;
      solicitudesNegadas += d.solicitudesNegadasRaw || 0;
      solicitudesReconsideradas += d.solicitudesReconsideradasRaw || 0;
      solicitudesEnProceso += d.solicitudesEnProcesoRaw || 0;
    }

    return {
      totalLotes: detalleSegmentado.length,
      lotesAprobados: lotesAprobados,
      lotesNegados: lotesNegados,
      lotesEnProceso: lotesEnProceso,
      totalSolicitudes: totalSolicitudes,
      solicitudesAprobadas: solicitudesAprobadas,
      solicitudesNegadas: solicitudesNegadas,
      solicitudesReconsideradas: solicitudesReconsideradas,
      solicitudesEnProceso: solicitudesEnProceso
    };
  }

  /**
   * Aplica un filtro por tipo de card sobre la tabla de detalle (toggle).
   * @param {string} tipo - Tipo de filtro: 'totalLotes', 'lotesAprobados', 'lotesNegados', 'lotesEnProceso', 'totalSolicitudes', 'solicitudesAprobadas', 'solicitudesNegadas', 'solicitudesReconsideradas'
   */
  function _aplicarFiltro(tipo) {
    if (!_datosActuales || !_datosActuales.detallePorLote) return;

    // Toggle: si el mismo filtro está activo, desactivar
    if (_filtroActivo === tipo) {
      _filtroActivo = null;
    } else {
      _filtroActivo = tipo;
    }

    _paginaActual = 1;
    _renderizarVista();
  }

  function _conectarEventosKpis() {
    var kpis = document.querySelectorAll('.metricas-lotes__kpi[data-filtro]');

  /**

   */
  function _actualizarEstadoActivoKpis() {
    var kpis = document.querySelectorAll('.metricas-lotes__kpi[data-filtro]');
    for (var i = 0; i < kpis.length; i++) {
      var filtro = kpis[i].getAttribute('data-filtro');
      if (filtro === _filtroActivo) {

  /**
   * HTML de los controles de paginación.
   * @param {number} totalRegistros
   * @param {number} totalPaginas
   * @returns {string}
   */
  function _htmlPaginacion(totalRegistros, totalPaginas) {
    if (totalPaginas <= 1) {
      return '<div class="metricas-lotes__paginacion">'
        + '<span class="metricas-lotes__paginacion-info">' + totalRegistros + ' registro' + (totalRegistros !== 1 ? 's' : '') + '</span>'
        + '<span></span></div>';
    }

    var inicio = ((_paginaActual - 1) * _filasPorPagina) + 1;
    var fin = Math.min(_paginaActual * _filasPorPagina, totalRegistros);

    var html = '<div class="metricas-lotes__paginacion">';
    html += '<span class="metricas-lotes__paginacion-info">' + inicio + '–' + fin + ' de ' + totalRegistros + ' lotes</span>';
    html += '<div class="metricas-lotes__paginacion-btns">';

    // Botón anterior
    html += '<button class="metricas-lotes__pag-btn" data-pagina="prev"' + (_paginaActual <= 1 ? ' disabled' : '') + '>← Anterior</button>';

    // Números de página (mostrar máx 5 alrededor de la actual)
    var paginaInicio = Math.max(1, _paginaActual - 2);
    var paginaFin = Math.min(totalPaginas, paginaInicio + 4);
    if (paginaFin - paginaInicio < 4) {
      paginaInicio = Math.max(1, paginaFin - 4);
    }

    for (var p = paginaInicio; p <= paginaFin; p++) {
      var activeClass = (p === _paginaActual) ? ' metricas-lotes__pag-btn--active' : '';
      html += '<button class="metricas-lotes__pag-btn' + activeClass + '" data-pagina="' + p + '">' + p + '</button>';
    }

    // Botón siguiente
    html += '<button class="metricas-lotes__pag-btn" data-pagina="next"' + (_paginaActual >= totalPaginas ? ' disabled' : '') + '>Siguiente →</button>';

    html += '</div></div>';
    return html;
  }

  /**
   * Conecta eventos click a los botones de paginación.
   */
  function _conectarEventosPaginacion() {
    var btns = document.querySelectorAll('.metricas-lotes__pag-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function() {
        var pagina = this.getAttribute('data-pagina');
        if (pagina === 'prev') {
          if (_paginaActual > 1) _paginaActual--;
        } else if (pagina === 'next') {
          var detalleFiltrado = _obtenerDetalleFiltrado();
          var totalPaginas = Math.ceil(detalleFiltrado.length / _filasPorPagina);
          if (_paginaActual < totalPaginas) _paginaActual++;
        } else {
          _paginaActual = parseInt(pagina, 10);
        }
        _renderizarVista();
      });
    }
  }

  /**
   * Genera y descarga un archivo CSV con el detalle de solicitudes.
   * Siempre descarga TODOS los datos del periodo (ignora filtros de cards y chips).
   */
  function _descargarCSV() {
    if (!_datosActuales || !_datosActuales.detallePorLote || _datosActuales.detallePorLote.length === 0) return;

    // Usa el detalle YA filtrado (equipo + card KPI + segmento + sucursal),
    // no el crudo — para que el CSV coincida con lo que se ve en pantalla.
    var detalle = _obtenerDetalleFiltrado();

    var headers = [
      'Fecha Lote',
      'Código Lote',
      'Sucursal',
      'Resultado Lote',
      'No. Solicitud',
      'Estado SAI'
    ];

    var filas = [headers.join(';')];

    for (var i = 0; i < detalle.length; i++) {
      var d = detalle[i];
      var solicitudes = d.solicitudes || [];

      if (solicitudes.length === 0) {
        // Lote sin detalle de solicitudes (fallback)
        filas.push([
          d.fechaLote || '',
          d.codigoLote || '',
          d.sucursal || '',
          d.resultadoLote || '',
          '',
          ''
        ].join(';'));
      } else {
        for (var j = 0; j < solicitudes.length; j++) {
          filas.push([
            d.fechaLote || '',
            d.codigoLote || '',
            d.sucursal || '',
            d.resultadoLote || '',
            solicitudes[j].numero || '',
            solicitudes[j].estadoSAI || 'EN PROCESO'
          ].join(';'));
        }
      }
    }

    var csvContent = '\uFEFF' + filas.join('\r\n');
    var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);

    var inputDesde = document.getElementById('metricasLotesFechaDesde');
    var inputHasta = document.getElementById('metricasLotesFechaHasta');
    var desde = inputDesde ? inputDesde.value.replace(/-/g, '') : '';
    var hasta = inputHasta ? inputHasta.value.replace(/-/g, '') : '';
    var nombreArchivo = 'metricas_lotes_' + desde + '_' + hasta + '.csv';

    var link = document.createElement('a');
    link.href = url;
    link.download = nombreArchivo;
    link.style.display = 'none';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

  /**
   * Retorna el detalle filtrado según el filtro de card activo + segmentación por solicitudes + sucursal.
   * @returns {Array}
   */
  function _obtenerDetalleFiltrado() {
    if (!_datosActuales || !_datosActuales.detallePorLote) return [];

    var detalle = _datosActuales.detallePorLote;

    // 0. Filtro por equipo (Director/Comercial)
    if (_loteIdsFiltrados) {
      detalle = detalle.filter(function(d) {
        return !!_loteIdsFiltrados[(d.codigoLote || '').toUpperCase().trim()];
      });
    }

    // 1. Filtro por card KPI
    if (_filtroActivo && _filtroActivo !== 'totalLotes' && _filtroActivo !== 'totalSolicitudes') {
      if (_filtroActivo === 'lotesAprobados') {
        detalle = detalle.filter(function(d) { return (d.resultadoLote || '').toUpperCase() === 'APROBADO'; });
      } else if (_filtroActivo === 'lotesNegados') {
        detalle = detalle.filter(function(d) { return (d.resultadoLote || '').toUpperCase() === 'NEGADO'; });
      } else if (_filtroActivo === 'lotesEnProceso') {
        detalle = detalle.filter(function(d) { var r = (d.resultadoLote || '').toUpperCase(); return r !== 'APROBADO' && r !== 'NEGADO'; });
      } else if (_filtroActivo === 'solicitudesAprobadas') {
        detalle = detalle.filter(function(d) { return d.solicitudesAprobadasEnLote > 0; });
      } else if (_filtroActivo === 'solicitudesNegadas') {
        detalle = detalle.filter(function(d) { return d.solicitudesNegadas > 0; });
      } else if (_filtroActivo === 'solicitudesReconsideradas') {
        detalle = detalle.filter(function(d) { return d.negadaPorLoteReconsideradaPorGerencia > 0; });
      } else if (_filtroActivo === 'solicitudesEnProceso') {
        detalle = detalle.filter(function(d) { return d.solicitudesEnProcesoEnLote > 0; });
      }
    }

    // 2. Filtro por segmento de solicitudes/lote
    if (_segmentoActivo && _segmentoActivo !== 'todos') {
      detalle = detalle.filter(function(d) {
        var cant = d.cantidadSolicitudes || 0;
        switch (_segmentoActivo) {
          case '1-50': return cant >= 1 && cant <= 50;
          case '51-100': return cant >= 51 && cant <= 100;
          case '101-200': return cant >= 101 && cant <= 200;
          case '201-300': return cant >= 201 && cant <= 300;
          case '301+': return cant >= 301;
          default: return true;
        }
      });
    }

    // 3. Filtro por sucursal
    if (_sucursalActiva && _sucursalActiva !== 'todas') {
      detalle = detalle.filter(function(d) {
        return (d.sucursal || '').toUpperCase() === _sucursalActiva.toUpperCase();
      });
    }

    // 4. Filtro por columna numérica (badges/grilla de totales)
    if (_filtroColumna) {
      detalle = detalle.filter(function(d) {
        switch (_filtroColumna) {
          // Badges de resultado de lote
          case 'resultado-aprobado': return (d.resultadoLote || '').toUpperCase() === 'APROBADO';
          case 'resultado-negado': return (d.resultadoLote || '').toUpperCase() === 'NEGADO';
          case 'resultado-proceso': var r = (d.resultadoLote || '').toUpperCase(); return r !== 'APROBADO' && r !== 'NEGADO';
          // Grilla de totales por columna
          case 'col-solicitudes': return (parseInt(d.cantidadSolicitudes, 10) || 0) > 0;
          case 'col-aprobEnLote': return (parseInt(d.solicitudesAprobadasEnLote, 10) || 0) > 0;
          case 'col-aprobIndiv': return (parseInt(d.solicitudesAprobadasIndividualNegadaPorLote, 10) || 0) > 0;
          case 'col-negIndiv': return (parseInt(d.solicitudesNegadasIndividualAprobadasPorLote, 10) || 0) > 0;
          case 'col-negadas': return (parseInt(d.solicitudesNegadas, 10) || 0) > 0;
          case 'col-aprobLoteNegAn': return (parseInt(d.aprobadaPorLoteNegadaPorAnalista, 10) || 0) > 0;
          case 'col-recons': return (parseInt(d.negadaPorLoteReconsideradaPorGerencia, 10) || 0) > 0;
          default: return true;
        }
      });
    }

    return detalle;
  }

  /**
   * Dibuja las gráficas de Google Charts con los datos del resumen.
   * @param {Object} resumen - Resumen recalculado
   */
  function _dibujarGraficas(resumen) {
    if (!resumen) return;
    if (typeof google === 'undefined' || !google.visualization) {
      // Google Charts aún cargando — esperar callback
      if (typeof google !== 'undefined' && google.charts) {
        google.charts.setOnLoadCallback(function() {
          _dibujarGraficasInterno(resumen);
        });
      }
      return;
    }
    _dibujarGraficasInterno(resumen);
  }

  /**
   * Dibuja las gráficas (internamente, asumiendo google.visualization disponible).
   * @param {Object} resumen
   */
  function _dibujarGraficasInterno(resumen) {
    if (!google || !google.visualization) return;

    // ── Gráfica Dona: Distribución de Lotes ──
    var containerDona = document.getElementById('metricasLotesChartDona');
    if (containerDona) {
      var dataDona = google.visualization.arrayToDataTable([
        ['Estado', 'Cantidad'],
        ['Aprobados', resumen.lotesAprobados || 0],
        ['Negados', resumen.lotesNegados || 0],
        ['En Proceso', resumen.lotesEnProceso || 0]
      ]);

      var optionsDona = {
        pieHole: 0.45,
        colors: ['#0fbdb7', '#bd0f14', '#ffa300'],
        legend: { position: 'bottom', textStyle: { fontSize: 11 } },
        chartArea: { width: '90%', height: '75%' },
        pieSliceTextStyle: { fontSize: 12 },
        backgroundColor: 'transparent',
        tooltip: { textStyle: { fontSize: 12 } }
      };

      var chartDona = new google.visualization.PieChart(containerDona);
      chartDona.draw(dataDona, optionsDona);
    }

    // ── Gráfica Dona: Solicitudes por Estado ──
    var containerBarras = document.getElementById('metricasLotesChartBarras');
    if (containerBarras) {
      var dataSol = google.visualization.arrayToDataTable([
        ['Estado', 'Cantidad'],
        ['Aprobadas (' + (resumen.solicitudesAprobadas || 0) + ')', resumen.solicitudesAprobadas || 0],
        ['Negadas (' + (resumen.solicitudesNegadas || 0) + ')', resumen.solicitudesNegadas || 0],
        ['Reconsideradas (' + (resumen.solicitudesReconsideradas || 0) + ')', resumen.solicitudesReconsideradas || 0],
        ['En Proceso (' + (resumen.solicitudesEnProceso || 0) + ')', resumen.solicitudesEnProceso || 0]
      ]);

      var optionsSol = {
        pieHole: 0.45,
        colors: ['#0fbdb7', '#bd0f14', '#ffa300', '#706F6F'],
        legend: { position: 'bottom', textStyle: { fontSize: 11 } },
        chartArea: { width: '90%', height: '75%' },
        pieSliceTextStyle: { fontSize: 11 },
        pieSliceText: 'percentage',
        backgroundColor: 'transparent',
        tooltip: { textStyle: { fontSize: 12 }, text: 'both' }
      };

      var chartSol = new google.visualization.PieChart(containerBarras);
      chartSol.draw(dataSol, optionsSol);
    }
  }

  /**
   * HTML del resumen (KPIs): un bloque "hero + barra proporcional + detalle"
   * por cada total (Lotes, Solicitudes), en vez de 4 grupos de tarjetas que
   * repetían el mismo "Total Evaluados" dos veces seguidas. El total ahora
   * se ve una sola vez (como cifra grande) y su desglose se lee de un
   * vistazo en la barra + las filas clicables de abajo.
   * @param {Object} resumen
   * @returns {string}
   */
  function _htmlResumen(resumen) {
    var r = resumen || {};
    var tl = parseInt(r.totalLotes, 10) || 0;
    var ts = parseInt(r.totalSolicitudes, 10) || 0;

    var lotesAprobados = parseInt(r.lotesAprobados, 10) || 0;
    var lotesNegados = parseInt(r.lotesNegados, 10) || 0;
    var lotesEnProceso = parseInt(r.lotesEnProceso, 10) || 0;
    var lotesEvaluados = lotesAprobados + lotesNegados;

    var solAprobadas = parseInt(r.solicitudesAprobadas, 10) || 0;
    var solNegadas = parseInt(r.solicitudesNegadas, 10) || 0;
    var solReconsideradas = parseInt(r.solicitudesReconsideradas, 10) || 0;
    var solEnProceso = parseInt(r.solicitudesEnProceso, 10) || 0;
    var solEvaluadas = solAprobadas + solNegadas + solReconsideradas;

    var bloqueLotes = _bloqueResumen({
      icono: '📦',
      titulo: 'Lotes',
      total: tl,
      subtitulo: _pct(lotesEvaluados, tl) + ' evaluados (' + lotesEvaluados + ') · ' + _pct(lotesEnProceso, tl) + ' en proceso',
      segmentos: [
        { label: 'Aprobados', valor: lotesAprobados, color: 'success', filtro: 'lotesAprobados', base: lotesEvaluados },
        { label: 'Negados', valor: lotesNegados, color: 'danger', filtro: 'lotesNegados', base: lotesEvaluados },
        { label: 'En proceso', valor: lotesEnProceso, color: 'warning', filtro: 'lotesEnProceso', base: tl }
      ],
      totalParaPct: tl
    });

    var bloqueSolicitudes = _bloqueResumen({
      icono: '📋',
      titulo: 'Solicitudes',
      total: ts,
      subtitulo: _pct(solEvaluadas, ts) + ' evaluadas (' + solEvaluadas + ') · ' + _pct(solEnProceso, ts) + ' en proceso',
      segmentos: [
        { label: 'Aprobadas', valor: solAprobadas, color: 'success', filtro: 'solicitudesAprobadas', base: solEvaluadas },
        { label: 'Negadas', valor: solNegadas, color: 'danger', filtro: 'solicitudesNegadas', base: solEvaluadas },
        { label: 'Reconsideradas', valor: solReconsideradas, color: 'info', filtro: 'solicitudesReconsideradas', base: solEvaluadas },
        { label: 'En proceso', valor: solEnProceso, color: 'warning', filtro: 'solicitudesEnProceso', base: ts }
      ],
      totalParaPct: ts
    });

    return '<div class="metricas-lotes__resumen-grid">' + bloqueLotes + bloqueSolicitudes + '</div>';
  }

  /** Mapea el color semántico corto usado en _bloqueResumen/_filaDetalle a una variable CSS de marca. */
  function _colorSegmento(tipo) {
    var mapa = { success: 'var(--verde)', danger: 'var(--rojo)', warning: 'var(--amarillo)', info: 'var(--azul-mid)' };
    return mapa[tipo] || 'var(--azul)';
  }

  /**
   * Construye un bloque de resumen: hero (total) + barra proporcional + filas de detalle clicables.
   * @param {{icono:string, titulo:string, total:number, subtitulo:string, segmentos:Array, totalParaPct:number}} cfg
   * @returns {string}
   */
  function _bloqueResumen(cfg) {
    var html = '<div class="metricas-lotes__resumen-bloque">';

    // Hero: la cifra grande, sin filtro asociado (ver nota en _filaDetalle)
    html += '<div class="metric-hero-card metric-hero-azul" style="cursor:default;">'
      + '<div><div class="metric-hero-label">' + cfg.icono + ' ' + _escapeHtml(cfg.titulo) + '</div>'
      + '<div class="metric-hero-value">' + _num(cfg.total) + '</div>'
      + '<div class="metric-hero-sub">' + _escapeHtml(cfg.subtitulo) + '</div></div>'
      + '</div>';

    // Barra proporcional: una franja de color por segmento, ancho = % del total
    var total = cfg.totalParaPct || 0;
    html += '<div class="metric-split-bar">';
    for (var i = 0; i < cfg.segmentos.length; i++) {
      var seg = cfg.segmentos[i];
      var pctBar = total > 0 ? Math.max(0, (seg.valor / total) * 100) : 0;
      html += '<div class="metric-split-seg" style="width:' + pctBar + '%;background:' + _colorSegmento(seg.color) + ';" title="' + _escapeHtml(seg.label) + '"></div>';
    }
    html += '</div>';

    // Filas de detalle — mismo comportamiento clicable de siempre (data-filtro)
    html += '<div class="metrics-row-detail" style="grid-template-columns:repeat(' + cfg.segmentos.length + ',1fr);">';
    for (var j = 0; j < cfg.segmentos.length; j++) {
      html += _filaDetalle(cfg.segmentos[j], total);
    }
    html += '</div>';

    html += '</div>';
    return html;
  }

  /**
   * Genera una fila de detalle clicable (dot + label + valor + %) para filtrar la tabla.
   * Mantiene la clase .metricas-lotes__kpi y el atributo data-filtro para que
   * _conectarEventosKpis()/_actualizarEstadoActivoKpis() sigan funcionando sin cambios.
   * @param {{label:string, valor:number, color:string, filtro:string}} seg
   * @param {number} total
   * @returns {string}
   */
  function _filaDetalle(seg, total) {
    var activeClass = (_filtroActivo === seg.filtro) ? ' metricas-lotes__kpi--active' : '';
    // Usar base específica del segmento si existe (ej: evaluados para Aprobados/Negados)
    var basePct = (seg.base !== undefined && seg.base !== null) ? seg.base : total;
    var pctNum = basePct > 0 ? Math.max(0, Math.round((seg.valor / basePct) * 100)) : 0;
    var color = _colorSegmento(seg.color);
    // Indicar contra qué base se calcula el % (tooltip informativo)
    var pctTooltip = seg.base !== undefined && seg.base !== total
      ? pctNum + '% de evaluados'
      : pctNum + '% del total';
    return '<div class="metric-detail-card metricas-lotes__kpi' + activeClass + '" data-filtro="' + seg.filtro + '" role="button" tabindex="0" aria-pressed="' + (_filtroActivo === seg.filtro) + '" title="' + pctTooltip + ' — Click para filtrar la tabla">'
      + '<div class="metric-detail-dot" style="background:' + color + ';"></div>'
      + '<div class="metric-detail-text">'
      + '<span class="metric-detail-label">' + _escapeHtml(seg.label) + '</span>'
      + '<span class="metric-detail-value">' + _num(seg.valor) + '</span>'
      + '</div>'
      + '<div class="metric-detail-pct" style="color:' + color + ';">' + pctNum + '%</div>'
      + '</div>';
  }

  /**
   * Calcula el porcentaje y retorna string formateado (ej: "77%").
   * @param {*} valor
   * @param {number} total
   * @returns {string}
   */
  function _pct(valor, total) {
    var n = parseInt(valor, 10) || 0;
    if (!total || total === 0) return '0%';
    return Math.round((n / total) * 100) + '%';
  }

  /**
   * HTML de los totales por resultado sobre el detalle YA filtrado
   * (mismo criterio que el CSV y que las tarjetas de arriba) — para poder
   * verificar de un vistazo que la tabla cuadra con el resumen.
   * @param {Array} detalle - Detalle ya filtrado (todas las páginas, no solo la visible)
   * @returns {string}
   */
  function _htmlTotalesTabla(detalle) {
    // Totales por columna numérica (lo que el usuario quiere ver)
    var totSolicitudes = 0, totAprobEnLote = 0, totAprobIndiv = 0;
    var totNegIndiv = 0, totNegadas = 0, totAprobLoteNegAn = 0, totRecons = 0;
    // También contar por resultado de lote (para referencia)
    var lotesAprobados = 0, lotesNegados = 0, lotesEnProceso = 0;

    for (var i = 0; i < detalle.length; i++) {
      var d = detalle[i];
      totSolicitudes += parseInt(d.cantidadSolicitudes, 10) || 0;
      totAprobEnLote += parseInt(d.solicitudesAprobadasEnLote, 10) || 0;
      totAprobIndiv += parseInt(d.solicitudesAprobadasIndividualNegadaPorLote, 10) || 0;
      totNegIndiv += parseInt(d.solicitudesNegadasIndividualAprobadasPorLote, 10) || 0;
      totNegadas += parseInt(d.solicitudesNegadas, 10) || 0;
      totAprobLoteNegAn += parseInt(d.aprobadaPorLoteNegadaPorAnalista, 10) || 0;
      totRecons += parseInt(d.negadaPorLoteReconsideradaPorGerencia, 10) || 0;

      var r = (d.resultadoLote || '').toUpperCase();
      if (r === 'APROBADO') lotesAprobados++;
      else if (r === 'NEGADO') lotesNegados++;
      else lotesEnProceso++;
    }

    // Badges de resultado de lote (clicables como filtro)
    var badges = '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">'
      + _htmlBadgeFiltro('resultado-aprobado', 'Aprobados: ' + lotesAprobados, 'var(--verde-light)', 'var(--verde)')
      + _htmlBadgeFiltro('resultado-negado', 'Negados: ' + lotesNegados, 'var(--rojo-light)', 'var(--rojo)')
      + _htmlBadgeFiltro('resultado-proceso', 'En proceso: ' + lotesEnProceso, 'var(--amarillo-light)', 'var(--amarillo)')
      + '</div>';

    // Grilla de totales por columna — desglose real de solicitudes (clicables)
    var totales = '<div class="metricas-lotes__totales-grid">'
      + _htmlTotalItem('Solicitudes', totSolicitudes, 'var(--color-primary-navy)', 'col-solicitudes')
      + _htmlTotalItem('Aprob. en Lote', totAprobEnLote, 'var(--verde)', 'col-aprobEnLote')
      + _htmlTotalItem('Aprob. Indiv.', totAprobIndiv, 'var(--verde)', 'col-aprobIndiv')
      + _htmlTotalItem('Neg. Indiv.', totNegIndiv, 'var(--rojo)', 'col-negIndiv')
      + _htmlTotalItem('Negadas', totNegadas, 'var(--rojo)', 'col-negadas')
      + _htmlTotalItem('Aprob. Lote / Neg. Analista', totAprobLoteNegAn, 'var(--amarillo)', 'col-aprobLoteNegAn')
      + _htmlTotalItem('Reconsideradas', totRecons, 'var(--azul-mid, #6366f1)', 'col-recons')
      + '</div>';

    return badges + totales;
  }

  /** Badge clicable para filtrar por resultado de lote */
  function _htmlBadgeFiltro(filtroCol, texto, bg, color) {
    var activo = _filtroColumna === filtroCol;
    var estiloActivo = activo ? 'outline:2px solid ' + color + ';outline-offset:2px;' : '';
    return '<span class="badge-pill metricas-lotes__badge-filtro' + (activo ? ' metricas-lotes__badge-filtro--active' : '') + '" '
      + 'data-filtro-col="' + filtroCol + '" '
      + 'style="background:' + bg + ';color:' + color + ';cursor:pointer;' + estiloActivo + '" '
      + 'role="button" tabindex="0" title="Click para filtrar">'
      + texto + '</span>';
  }

  /** Genera un item individual para la grilla de totales por columna (clicable) */
  function _htmlTotalItem(label, valor, color, filtroCol) {
    var activo = _filtroColumna === filtroCol;
    var claseActiva = activo ? ' metricas-lotes__total-item--active' : '';
    return '<div class="metricas-lotes__total-item' + claseActiva + '" data-filtro-col="' + filtroCol + '" role="button" tabindex="0" title="Click para filtrar por ' + label + '">'
      + '<span class="metricas-lotes__total-value" style="color:' + color + ';">' + _num(valor) + '</span>'
      + '<span class="metricas-lotes__total-label">' + label + '</span>'
      + '</div>';
  }

  /**
   * HTML de la tabla de detalle por lote.
   * @param {Array} detalle
   * @returns {string}
   */
  function _htmlTablaDetalle(detalle) {
    var html = '<div class="card card--flat" style="padding:0;overflow:hidden;margin-top:var(--space-4);">'
      + '<div class="metricas-lotes__tabla-wrap">'
      + '<table class="metricas-lotes__tabla" role="table" aria-label="Detalle de métricas por lote">'
      + '<thead><tr>'
      + '<th scope="col">Fecha</th>'
      + '<th scope="col">Código Lote</th>'
      + '<th scope="col">Sucursal</th>'
      + '<th scope="col">Resultado</th>'
      + '<th scope="col" class="num-cell">Solicitudes</th>'
      + '<th scope="col" class="num-cell">Aprobadas<br><small>en Lote</small></th>'
      + '<th scope="col" class="num-cell">Aprob. Indiv.<br><small>Lote Negado</small></th>'
      + '<th scope="col" class="num-cell">Neg. Indiv.<br><small>Lote Aprob.</small></th>'
      + '<th scope="col" class="num-cell">Negadas</th>'
      + '<th scope="col" class="num-cell">Aprob. Lote<br><small>Neg. Analista</small></th>'
      + '<th scope="col" class="num-cell">Recons.</th>'
      + '</tr></thead><tbody>';

    for (var i = 0; i < detalle.length; i++) {
      var d = detalle[i];
      var resLote = (d.resultadoLote || '').toUpperCase();
      var badgeClass, badgeText;

      if (resLote === 'APROBADO') {
        badgeClass = 'metricas-lotes__badge--aprobado';
        badgeText = 'APROBADO';
      } else if (resLote === 'NEGADO') {
        badgeClass = 'metricas-lotes__badge--negado';
        badgeText = 'NEGADO';
      } else {
        badgeClass = 'metricas-lotes__badge--proceso';
        badgeText = 'EN PROCESO';
      }

      html += '<tr>'
        + '<td>' + _escapeHtml(d.fechaLote || '') + '</td>'
        + '<td style="font-family:var(--font-mono);font-size:var(--text-xs);">' + _escapeHtml(d.codigoLote || '') + '</td>'
        + '<td style="font-size:var(--text-xs);">' + _escapeHtml(d.sucursal || '') + '</td>'
        + '<td><span class="' + badgeClass + '">' + badgeText + '</span></td>'
        + '<td class="num-cell num-cell--highlight">' + _num(d.cantidadSolicitudes) + '</td>'
        + '<td class="num-cell">' + _num(d.solicitudesAprobadasEnLote) + '</td>'
        + '<td class="num-cell">' + _num(d.solicitudesAprobadasIndividualNegadaPorLote) + '</td>'
        + '<td class="num-cell">' + _num(d.solicitudesNegadasIndividualAprobadasPorLote) + '</td>'
        + '<td class="num-cell">' + _num(d.solicitudesNegadas) + '</td>'
        + '<td class="num-cell">' + _num(d.aprobadaPorLoteNegadaPorAnalista) + '</td>'
        + '<td class="num-cell">' + _num(d.negadaPorLoteReconsideradaPorGerencia) + '</td>'
        + '</tr>';
    }

    html += '</tbody></table></div></div>';
    return html;
  }

  /**
   * Formatea un número, mostrando 0 si es falsy.
   * @param {*} val
   * @returns {string}
   */
  function _num(val) {
    var n = parseInt(val, 10);
    return isNaN(n) ? '0' : String(n);
  }

  /**
   * Escapa HTML para prevenir XSS en datos provenientes del backend.
   * @param {string} str
   * @returns {string}
   */
  function _escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  /**
   * Llena dinámicamente los chips de sucursal basado en los datos recibidos.
   * @param {string[]} sucursales - Array de sucursales únicas
   */
  function _llenarChipsSucursal(sucursales) {
    var contenedor = document.getElementById('metricasLotesChipsSucursal');
    if (!contenedor) return;

    if (!sucursales || sucursales.length === 0) {
      contenedor.style.display = 'none';
      return;
    }

    var html = '<span class="metricas-lotes__chips-label">Sucursal:</span>';
    var activaTodas = (!_sucursalActiva || _sucursalActiva === 'todas') ? ' metricas-lotes__chip--active' : '';
    html += '<button class="metricas-lotes__chip' + activaTodas + '" data-sucursal="todas" type="button">Todas</button>';

    for (var i = 0; i < sucursales.length; i++) {
      var activa = (_sucursalActiva === sucursales[i]) ? ' metricas-lotes__chip--active' : '';
      html += '<button class="metricas-lotes__chip' + activa + '" data-sucursal="' + _escapeHtml(sucursales[i]) + '" type="button">' + _escapeHtml(sucursales[i]) + '</button>';
    }

    contenedor.innerHTML = html;
    contenedor.style.display = 'flex';

    // Conectar eventos
    var chips = contenedor.querySelectorAll('.metricas-lotes__chip[data-sucursal]');
    for (var j = 0; j < chips.length; j++) {
      chips[j].addEventListener('click', function() {
        _sucursalActiva = this.getAttribute('data-sucursal');
        var allChips = document.querySelectorAll('#metricasLotesChipsSucursal .metricas-lotes__chip');
        for (var k = 0; k < allChips.length; k++) {
          allChips[k].classList.remove('metricas-lotes__chip--active');
        }
        this.classList.add('metricas-lotes__chip--active');
        _paginaActual = 1;
        _renderizarVista();
        // Notificar a los gráficos SVG para que se refresquen con el filtro de sucursal
        if (typeof _aplicarFiltroYRenderizarCharts === 'function') {
          var lotesCached = (typeof CacheManager !== 'undefined') ? CacheManager.get('lotes') : null;
          var usuariosCached = (typeof CacheManager !== 'undefined') ? CacheManager.get('usuarios-dash') : null;
          if (lotesCached && usuariosCached) {
            _aplicarFiltroYRenderizarCharts(lotesCached, usuariosCached);
          }
        }
      });
    }
  }

  /**
   * Oculta los chips de sucursal cuando no hay datos.
   */
  function _ocultarChipsSucursal() {
    var contenedor = document.getElementById('metricasLotesChipsSucursal');
    if (contenedor) contenedor.style.display = 'none';
  }

  /**
   * Dibuja las gráficas de tendencia histórica (lotes y solicitudes).
   * Se llama cuando se reciben los datos del endpoint de histórico.
   * @param {Array} historico - Array de datos mensuales
   */
  function _dibujarGraficasTendencia(historico) {
    if (!historico || historico.length === 0) return;
    if (typeof google === 'undefined' || !google.visualization) {
      if (typeof google !== 'undefined' && google.charts) {
        google.charts.setOnLoadCallback(function() {
          _dibujarGraficasTendenciaInterno(historico);
        });
      }
      return;
    }
    _dibujarGraficasTendenciaInterno(historico);
  }

  /**
   * Dibuja las gráficas de tendencia (internamente, google.visualization disponible).
   * @param {Array} historico
   */
  function _dibujarGraficasTendenciaInterno(historico) {
    if (!google || !google.visualization) return;

    var contLotes = document.getElementById('metricasLotesChartTendLotes');
    var contSolicitudes = document.getElementById('metricasLotesChartTendSol');

    if (!contLotes || !contSolicitudes) return;

    // Mapeo de meses abreviados a completos (español)
    var mesesCompletos = {
      'Ene': 'Enero', 'Feb': 'Febrero', 'Mar': 'Marzo',
      'Abr': 'Abril', 'May': 'Mayo', 'Jun': 'Junio',
      'Jul': 'Julio', 'Ago': 'Agosto', 'Sep': 'Septiembre',
      'Oct': 'Octubre', 'Nov': 'Noviembre', 'Dic': 'Diciembre'
    };

    function _mesCompleto(etiqueta) {
      // "Ene 2026" → "Enero"
      var partes = (etiqueta || '').split(' ');
      return mesesCompletos[partes[0]] || partes[0];
    }

    // ── Tendencia de Lotes — ComboChart (barras + línea de % aprobación) ──
    var dataLotes = [['Mes', 'Aprobados', 'Negados', '% Aprobación']];
    for (var i = 0; i < historico.length; i++) {
      var aprobL = historico[i].lotesAprobados || 0;
      var negL = historico[i].lotesNegados || 0;
      var totalL = aprobL + negL;
      var pctL = totalL > 0 ? Math.round((aprobL / totalL) * 100) : 0;
      dataLotes.push([
        _mesCompleto(historico[i].etiqueta),
        aprobL,
        negL,
        pctL
      ]);
    }

    var chartDataLotes = google.visualization.arrayToDataTable(dataLotes);
    var optionsLotes = {
      legend: { position: 'top', alignment: 'center', textStyle: { fontSize: 11, color: '#555' } },
      colors: ['#0fbdb7', '#bd0f14', '#253150'],
      chartArea: { left: 50, right: 50, top: 40, bottom: 50, width: '85%', height: '65%' },
      bar: { groupWidth: '55%' },
      backgroundColor: 'transparent',
      vAxes: {
        0: { minValue: 0, textStyle: { fontSize: 10, color: '#888' }, gridlines: { color: '#f0f0f0', count: 5 }, title: '' },
        1: { minValue: 0, maxValue: 100, textStyle: { fontSize: 10, color: '#253150' }, gridlines: { color: 'transparent' }, format: '#\'%\'' }
      },
      hAxis: {
        textStyle: { fontSize: 11, color: '#555', bold: true },
        slantedText: false
      },
      seriesType: 'bars',
      series: {
        2: { type: 'line', targetAxisIndex: 1, lineWidth: 3, pointSize: 7, pointShape: 'circle', color: '#253150', lineDashStyle: null }
      },
      tooltip: { textStyle: { fontSize: 12 }, showColorCode: true },
      animation: { startup: true, duration: 600, easing: 'out' },
      focusTarget: 'category'
    };

    var chartLotes = new google.visualization.ComboChart(contLotes);
    chartLotes.draw(chartDataLotes, optionsLotes);

    // ── Tendencia de Solicitudes — ComboChart (barras + línea de % aprobación) ──
    var dataSol = [['Mes', 'Aprobadas', 'Negadas', '% Aprobación']];
    for (var j = 0; j < historico.length; j++) {
      var aprobS = historico[j].solicitudesAprobadas || 0;
      var negS = historico[j].solicitudesNegadas || 0;
      var totalS = aprobS + negS;
      var pctS = totalS > 0 ? Math.round((aprobS / totalS) * 100) : 0;
      dataSol.push([
        _mesCompleto(historico[j].etiqueta),
        aprobS,
        negS,
        pctS
      ]);
    }

    var chartDataSol = google.visualization.arrayToDataTable(dataSol);
    var optionsSol = {
      legend: { position: 'top', alignment: 'center', textStyle: { fontSize: 11, color: '#555' } },
      colors: ['#0fbdb7', '#bd0f14', '#253150'],
      chartArea: { left: 50, right: 50, top: 40, bottom: 50, width: '85%', height: '65%' },
      bar: { groupWidth: '55%' },
      backgroundColor: 'transparent',
      vAxes: {
        0: { minValue: 0, textStyle: { fontSize: 10, color: '#888' }, gridlines: { color: '#f0f0f0', count: 5 }, title: '' },
        1: { minValue: 0, maxValue: 100, textStyle: { fontSize: 10, color: '#253150' }, gridlines: { color: 'transparent' }, format: '#\'%\'' }
      },
      hAxis: {
        textStyle: { fontSize: 11, color: '#555', bold: true },
        slantedText: false
      },
      seriesType: 'bars',
      series: {
        2: { type: 'line', targetAxisIndex: 1, lineWidth: 3, pointSize: 7, pointShape: 'circle', color: '#253150', lineDashStyle: null }
      },
      tooltip: { textStyle: { fontSize: 12 }, showColorCode: true },
      animation: { startup: true, duration: 600, easing: 'out' },
      focusTarget: 'category'
    };

    var chartSol = new google.visualization.ComboChart(contSolicitudes);
    chartSol.draw(chartDataSol, optionsSol);
  }

  /**
   * Carga el pipeline de distribución En Proceso.
   * Envía el rango de fechas al backend que filtra Control_General
   * por Fecha Lote (col C) y excluye TERMINADO.
   */
  function _cargarDesgloseEnProceso() {
    if (!_datosActuales || !_datosActuales.detallePorLote) return;

    // Si ya tenemos el desglose pre-cargado (del call unificado), usarlo directamente
    if (_desglosePrecargado) {
      _renderizarDesglose(_desglosePrecargado);
      _desglosePrecargado = null; // Consumido — siguiente vez hará el call normal
      return;
    }

    var inputDesde = document.getElementById('metricasLotesFechaDesde');
    var inputHasta = document.getElementById('metricasLotesFechaHasta');
    var fechaDesde = inputDesde ? inputDesde.value : '';
    var fechaHasta = inputHasta ? inputHasta.value : '';

    if (!fechaDesde || !fechaHasta) return;

    var contenedorDesglose = document.getElementById('metricasLotesDesglose');

    if (contenedorDesglose) {
      contenedorDesglose.innerHTML = '<div class="metricas-lotes__desglose"><div class="metricas-lotes__desglose-loading">Cargando distribución...</div></div>';
    }

    callServer('api_obtenerDetalleEnProceso', fechaDesde, fechaHasta)
      .then(function(datos) {
        _renderizarDesglose(datos);
      })
      .catch(function(err) {
        console.error('Error cargando pipeline:', err);
        if (contenedorDesglose) contenedorDesglose.innerHTML = '';
      });
  }

  /**
   * Renderiza el desglose de sub-estados de solicitudes en proceso.
   * @param {Object|null} datos - Respuesta de api_obtenerDetalleEnProceso
   */
  function _renderizarDesglose(datos) {
    var contenedorDesglose = document.getElementById('metricasLotesDesglose');
    if (!contenedorDesglose) return;

    if (!datos || !datos.desglose) {
      contenedorDesglose.innerHTML = '<div class="metricas-lotes__desglose">'
        + '<div class="metricas-lotes__desglose-title">Desglose En Proceso</div>'
        + '<p style="font-size:var(--text-sm);color:var(--color-mono-400);margin:0;">No se encontraron solicitudes en proceso para desglosar.</p>'
        + '</div>';
      return;
    }

    var d = datos.desglose;
    var items = [
      { label: 'Pendiente Radicar', value: d.pendienteRadicar || 0 },
      { label: 'Radicado', value: d.radicado || 0 },
      { label: 'Pendiente Asignar', value: d.pendienteAsignar || 0 },
      { label: 'En Análisis', value: d.enAnalisis || 0 },
      { label: 'Error en Terceros', value: d.errorTerceros || 0 },
      { label: 'Envío Formato LMI', value: d.envioFormatoLMI || 0 },
      { label: 'Envío Carta LMI', value: d.envioCartaLMI || 0 },
      { label: 'Pendiente Paz y Salvo', value: d.pendientePS || 0 },
      { label: 'Otros', value: d.otros || 0 }
    ];

    // Solo mostrar items con valor > 0, ordenados de mayor a menor
    var itemsConValor = items.filter(function(item) { return item.value > 0; });
    itemsConValor.sort(function(a, b) { return b.value - a.value; });
    var totalItems = datos.desglose.total || itemsConValor.reduce(function(s, it) { return s + it.value; }, 0);

    if (itemsConValor.length === 0) {
      contenedorDesglose.innerHTML = '<div class="metricas-lotes__desglose">'
        + '<div class="metricas-lotes__desglose-title">Desglose En Proceso</div>'
        + '<p style="font-size:var(--text-sm);color:var(--color-mono-400);margin:0;">No se encontraron coincidencias en Control General.</p>'
        + '</div>';
      return;
    }

    var html = '<div class="metricas-lotes__desglose">'
      + '<div class="metricas-lotes__desglose-title">Distribución En Proceso — ' + totalItems + ' solicitudes de lotes ingresados en el período seleccionado</div>'
      + '<div class="metricas-lotes__desglose-grid">';

    for (var i = 0; i < itemsConValor.length; i++) {
      var pct = totalItems > 0 ? Math.round((itemsConValor[i].value / totalItems) * 100) : 0;
      // El mayor item determina el 100% de la barra
      var maxVal = itemsConValor[0].value;
      var barPct = maxVal > 0 ? Math.round((itemsConValor[i].value / maxVal) * 100) : 0;
      html += '<div class="metricas-lotes__desglose-item">'
        + '<span class="metricas-lotes__desglose-label">' + _escapeHtml(itemsConValor[i].label) + '</span>'
        + '<div class="metricas-lotes__desglose-bar"><div class="metricas-lotes__desglose-bar-fill" style="width:' + barPct + '%;"></div></div>'
        + '<span class="metricas-lotes__desglose-value">' + itemsConValor[i].value + '</span>'
        + '<span class="metricas-lotes__desglose-pct">' + pct + '%</span>'
        + '</div>';
    }

    html += '</div></div>';
    contenedorDesglose.innerHTML = html;
  }

  /**
   * Inicializa el componente con datos ya pre-cargados (sin round-trip adicional).
   * Usado cuando cargarVistaMetricasLotes ya obtuvo todo del backend unificado.
   * @param {Object} metricasLotes - Datos de api_obtenerMetricasLotes
   * @param {Array|null} historico - Datos de api_obtenerMetricasLotesHistorico
   * @param {Object|null} desglose - Datos de api_obtenerDetalleEnProceso
   */
  function initConDatos(metricasLotes, historico, desglose) {
    _inicializarFechas();
    _conectarEventos();

    // Asignar histórico antes de renderizar (para que _renderizarVista lo dibuje)
    if (historico && historico.length > 0) {
      _datosHistorico = historico;
    }

    // Asignar desglose pre-cargado antes de renderizar
    // (_renderizarVista → _cargarDesgloseEnProceso lo usará directamente)
    if (desglose) {
      _desglosePrecargado = desglose;
    }

    // Renderizar resultados directamente sin llamar al server
    _renderizarResultados(metricasLotes);
  }

  // API pública del módulo
  return {
    init: init,
    initConDatos: initConDatos,
    tieneAcceso: tieneAcceso,
    aplicarFiltroComercial: aplicarFiltroComercial
  };
})();
</script>
