<script>
/**
 * ============================================================
 * SVGRenderer — Módulo de generación de gráficos SVG inline
 * ============================================================
 *
 * Genera gráficos SVG accesibles sin dependencias externas.
 * Usa document.createElementNS con namespace SVG correcto.
 *
 * Requisitos: 9.1, 9.2, 9.3, 9.4, 10.1, 10.2
 */

var SVGRenderer = {
  /** @private Namespace SVG estándar */
  _NS: 'http://www.w3.org/2000/svg',

  /** @private Contador incremental para IDs únicos de <title> */
  _idCounter: 0,

  /**
   * Crea un elemento SVG con el namespace correcto y atributos dados.
   * @param {string} tag - Nombre del elemento SVG (svg, rect, text, etc.)
   * @param {Object} attrs - Mapa de atributos a asignar al elemento
   * @returns {SVGElement} Elemento SVG creado
   */
  _crearElemento: function(tag, attrs) {
    var el = document.createElementNS(this._NS, tag);
    if (attrs) {
      var keys = Object.keys(attrs);
      for (var i = 0; i < keys.length; i++) {
        el.setAttribute(keys[i], attrs[keys[i]]);
      }
    }
    return el;
  },

  /**
   * Calcula el string de viewBox para un SVG dado ancho y alto lógicos.
   * @param {number} ancho - Ancho lógico del SVG
   * @param {number} alto - Alto lógico del SVG
   * @returns {string} Valor del atributo viewBox ("0 0 ancho alto")
   */
  _calcularViewBox: function(ancho, alto) {
    return '0 0 ' + ancho + ' ' + alto;
  },

  /**
   * Genera un ID único para elementos <title> de SVG.
   * @returns {string} ID único con prefijo 'svg-title-'
   * @private
   */
  _generarTitleId: function() {
    this._idCounter++;
    return 'svg-title-' + this._idCounter;
  },

  /**
   * Crea el elemento SVG raíz con atributos de accesibilidad y responsividad.
   * Incluye: width="100%", viewBox calculado, role="img", aria-labelledby → <title>.
   *
   * @param {Object} config
   * @param {string} config.titulo - Texto descriptivo para el <title> de accesibilidad
   * @param {number} config.ancho - Ancho lógico del viewBox
   * @param {number} config.alto - Alto lógico del viewBox
   * @returns {{svg: SVGElement, titleId: string}} Elemento SVG raíz y el ID del title
   */
  _crearSvgRaiz: function(config) {
    var titleId = this._generarTitleId();

    var svg = this._crearElemento('svg', {
      'width': '100%',
      'viewBox': this._calcularViewBox(config.ancho, config.alto),
      'role': 'img',
      'aria-labelledby': titleId,
      'xmlns': this._NS
    });

    var title = this._crearElemento('title', { 'id': titleId });
    title.textContent = config.titulo;
    svg.appendChild(title);

    return { svg: svg, titleId: titleId };
  },

  /**
   * Genera un gráfico de barras horizontales (ranking/antigüedad).
   * @param {Object} config
   * @param {string} config.containerId - ID del div contenedor
   * @param {string} config.titulo - Título descriptivo para accesibilidad
   * @param {Array<{label: string, valor: number}>} config.datos - Datos a graficar
   * @param {Object} [config.opciones]
   * @param {string} [config.opciones.colorBarra] - Color CSS de las barras (default: #253150, azul de marca)
   * @param {number} [config.opciones.umbralAlerta] - Valor encima del cual se resalta en rojo (crítico)
   * @param {string} [config.opciones.colorAlerta] - Color para barras que superen umbralAlerta (default: #BD0F14, rojo de marca)
   * @param {number} [config.opciones.umbralAdvertencia] - Valor encima del cual se resalta en ámbar (atención, por debajo de umbralAlerta)
   * @param {string} [config.opciones.colorAdvertencia] - Color para barras que superen umbralAdvertencia (default: #d97706)
   * @param {string} [config.opciones.sufijo] - Sufijo para los valores (ej: " días")
   */
  barrasHorizontales: function(config) {
    var container = document.getElementById(config.containerId);
    if (!container) return;

    var datos = config.datos || [];
    var opciones = config.opciones || {};
    var colorBarra = opciones.colorBarra || '#253150';   // --azul de marca
    var colorAlerta = opciones.colorAlerta || '#BD0F14'; // --rojo de marca
    var colorAdvertencia = opciones.colorAdvertencia || '#d97706';
    var umbralAlerta = opciones.umbralAlerta;
    var umbralAdvertencia = opciones.umbralAdvertencia;
    var sufijo = opciones.sufijo || '';
    var anchoMinBarra = 4; // stub visible incluso cuando el valor es 0, para que todas las filas se lean igual

    // Dimensiones lógicas
    var margenIzq = 120;
    var margenDer = 60;
    var alturaBarra = 28;
    var espacioBarra = 8;
    var margenTop = 10;
    var ancho = 500;
    var alto = margenTop + datos.length * (alturaBarra + espacioBarra) + 10;

    var root = this._crearSvgRaiz({
      titulo: config.titulo,
      ancho: ancho,
      alto: alto
    });
    var svg = root.svg;

    var maxValor = 0;
    for (var i = 0; i < datos.length; i++) {
      if (datos[i].valor > maxValor) maxValor = datos[i].valor;
    }
    if (maxValor === 0) maxValor = 1;

    var anchoDisponible = ancho - margenIzq - margenDer;

    for (var j = 0; j < datos.length; j++) {
      var item = datos[j];
      var y = margenTop + j * (alturaBarra + espacioBarra);
      var anchoBarra = Math.max(anchoMinBarra, (item.valor / maxValor) * anchoDisponible);
      var color = colorBarra;
      if (umbralAlerta !== undefined && item.valor > umbralAlerta) {
        color = colorAlerta;
      } else if (umbralAdvertencia !== undefined && item.valor > umbralAdvertencia) {
        color = colorAdvertencia;
      }

      // Label
      var label = this._crearElemento('text', {
        'x': margenIzq - 8,
        'y': y + alturaBarra / 2 + 5,
        'text-anchor': 'end',
        'font-size': '12',
        'font-family': "'Manrope',sans-serif",
        'fill': '#253150'
      });
      label.textContent = item.label;
      svg.appendChild(label);

      // Barra
      var rect = this._crearElemento('rect', {
        'x': margenIzq,
        'y': y,
        'width': anchoBarra,
        'height': alturaBarra,
        'fill': color,
        'rx': '6',
        'ry': '6'
      });
      svg.appendChild(rect);

      // Valor numérico
      var valorText = this._crearElemento('text', {
        'x': margenIzq + anchoBarra + 6,
        'y': y + alturaBarra / 2 + 5,
        'text-anchor': 'start',
        'font-size': '12',
        'font-family': "'Manrope',sans-serif",
        'font-weight': '700',
        'fill': '#253150'
      });
      valorText.textContent = item.valor + sufijo;
      svg.appendChild(valorText);
    }

    container.innerHTML = '';
    container.appendChild(svg);
  },

  /**
   * Genera un gráfico de línea (tendencia semanal).
   * @param {Object} config
   * @param {string} config.containerId - ID del div contenedor
   * @param {string} config.titulo - Título descriptivo para accesibilidad
   * @param {Array<{label: string, valor: number}>} config.datos - Puntos de la línea
   */
  lineaTendencia: function(config) {
    var container = document.getElementById(config.containerId);
    if (!container) return;

    var datos = config.datos || [];
    var margenIzq = 35;
    var margenDer = 15;
    var margenTop = 18;
    var margenBottom = 20;
    var ancho = 800;
    var alto = 120;

    var root = this._crearSvgRaiz({
      titulo: config.titulo,
      ancho: ancho,
      alto: alto
    });
    var svg = root.svg;
    // Forzar que el SVG respete el contenedor
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    svg.style.display = 'block';
    svg.style.maxHeight = '100%';

    var areaAncho = ancho - margenIzq - margenDer;
    var areaAlto = alto - margenTop - margenBottom;

    var maxValor = 0;
    for (var i = 0; i < datos.length; i++) {
      if (datos[i].valor > maxValor) maxValor = datos[i].valor;
    }
    if (maxValor === 0) maxValor = 1;

    // Línea de referencia base (eje X)
    var lineaBase = this._crearElemento('line', {
      'x1': margenIzq, 'y1': margenTop + areaAlto,
      'x2': ancho - margenDer, 'y2': margenTop + areaAlto,
      'stroke': '#e0e0e0', 'stroke-width': '1'
    });
    svg.appendChild(lineaBase);

    // Calcular puntos
    var puntos = [];
    var numPuntos = datos.length;
    for (var j = 0; j < numPuntos; j++) {
      var x = margenIzq + (numPuntos > 1 ? (j / (numPuntos - 1)) * areaAncho : areaAncho / 2);
      var y = margenTop + areaAlto - (datos[j].valor / maxValor) * areaAlto;
      puntos.push({ x: x, y: y });
    }

    // Área rellena bajo la línea (gradiente sutil)
    if (puntos.length > 1) {
      var areaPath = 'M' + puntos[0].x + ',' + puntos[0].y;
      for (var a = 1; a < puntos.length; a++) {
        areaPath += ' L' + puntos[a].x + ',' + puntos[a].y;
      }
      areaPath += ' L' + puntos[puntos.length - 1].x + ',' + (margenTop + areaAlto);
      areaPath += ' L' + puntos[0].x + ',' + (margenTop + areaAlto) + ' Z';

      var areaFill = this._crearElemento('path', {
        'd': areaPath,
        'fill': 'rgba(37, 49, 80, 0.05)',
        'stroke': 'none'
      });
      svg.appendChild(areaFill);
    }

    // Línea (polyline)
    if (puntos.length > 1) {
      var puntosStr = '';
      for (var k = 0; k < puntos.length; k++) {
        puntosStr += puntos[k].x + ',' + puntos[k].y;
        if (k < puntos.length - 1) puntosStr += ' ';
      }
      var polyline = this._crearElemento('polyline', {
        'points': puntosStr,
        'fill': 'none',
        'stroke': '#253150',
        'stroke-width': '2.5',
        'stroke-linejoin': 'round',
        'stroke-linecap': 'round'
      });
      svg.appendChild(polyline);
    }

    // Marcadores circulares + valor solo en picos significativos
    for (var m = 0; m < puntos.length; m++) {
      var circle = this._crearElemento('circle', {
        'cx': puntos[m].x,
        'cy': puntos[m].y,
        'r': numPuntos > 15 ? '2.5' : '4',
        'fill': '#253150',
        'stroke': '#fff',
        'stroke-width': numPuntos > 15 ? '1.5' : '2'
      });
      svg.appendChild(circle);

      // Mostrar valor solo en picos locales o último punto (evitar ruido visual)
      var esPico = datos[m].valor > 0 && (
        m === puntos.length - 1 ||
        (m > 0 && m < puntos.length - 1 && datos[m].valor > datos[m-1].valor && datos[m].valor >= datos[m+1].valor) ||
        (m === 0 && datos[m].valor > 0 && puntos.length > 1 && datos[m].valor >= datos[1].valor)
      );
      if (esPico && datos[m].valor > 0) {
        var valorLabel = this._crearElemento('text', {
          'x': puntos[m].x,
          'y': puntos[m].y - 8,
          'text-anchor': 'middle',
          'font-size': '9',
          'font-family': "'Manrope',sans-serif",
          'font-weight': '600',
          'fill': '#253150'
        });
        valorLabel.textContent = datos[m].valor;
        svg.appendChild(valorLabel);
      }
    }

    // Etiquetas del eje X (mostrar cada N días para evitar solapamiento)
    var intervaloLabels = numPuntos > 15 ? 5 : (numPuntos > 8 ? 3 : 1);
    for (var n = 0; n < datos.length; n++) {
      if (n % intervaloLabels !== 0 && n !== datos.length - 1) continue;
      var xLabel = margenIzq + (numPuntos > 1 ? (n / (numPuntos - 1)) * areaAncho : areaAncho / 2);
      var labelText = datos[n].label || '';
      var etiqueta = this._crearElemento('text', {
        'x': xLabel,
        'y': alto - 8,
        'text-anchor': 'middle',
        'font-size': '9',
        'font-family': "'Manrope',sans-serif",
        'fill': '#706F6F'
      });
      etiqueta.textContent = labelText;
      svg.appendChild(etiqueta);
    }

    // Solo mostrar valor max en eje Y
    var yMax = this._crearElemento('text', {
      'x': margenIzq - 8,
      'y': margenTop + 4,
      'text-anchor': 'end',
      'font-size': '10',
      'font-family': "'Manrope',sans-serif",
      'fill': '#706F6F'
    });
    yMax.textContent = maxValor.toString();
    svg.appendChild(yMax);

    container.innerHTML = '';
    container.appendChild(svg);
  }
};
</script>
