  <script>
    // Mensajes progresivos que rotan mientras carga — dan contexto real
    (function() {
      var mensajes = [
        { texto: 'Preparando tu espacio de trabajo', hint: '' },
        { texto: 'Verificando permisos', hint: 'Solo un instante' },
        { texto: 'Cargando datos del dashboard', hint: 'Conectando con el servidor' },
        { texto: 'Casi listo', hint: 'Organizando métricas' }
      ];
      var idx = 0;
      var statusEl = document.getElementById('bootStatus');
      var hintEl = document.getElementById('bootHint');
      var intervalo = setInterval(function() {
        idx++;
        if (idx >= mensajes.length) { clearInterval(intervalo); return; }
        if (statusEl) {
          statusEl.style.opacity = '0';
          statusEl.style.transform = 'translateY(4px)';
          setTimeout(function() {
            statusEl.textContent = mensajes[idx].texto;
            if (hintEl) hintEl.textContent = mensajes[idx].hint;
            statusEl.style.opacity = '1';
            statusEl.style.transform = 'translateY(0)';
            if (hintEl) { hintEl.style.opacity = '1'; hintEl.style.transform = 'translateY(0)'; }
          }, 250);
        }
      }, 2800);
    })();

    // Salvaguarda independiente de scripts_app.html: si por cualquier error
    // inicializarApp() nunca llega a ejecutarse, esta pantalla completa no
    // debe quedar tapando todo para siempre.
    setTimeout(function() {
      var ov = document.getElementById('bootOverlay');
      if (ov) ov.style.display = 'none';
    }, 20000);
  </script>
