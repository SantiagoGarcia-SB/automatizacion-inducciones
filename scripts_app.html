<script>
/**
 * ============================================================
 * App.js — Inicialización y orquestación de la SPA
 * ============================================================
 */

/** Datos del usuario logueado (se llenan al iniciar) */
var APP_USUARIO = null;

/** Menús por rol */
var MENUS_POR_ROL = {
  COMERCIAL: [
    { id: 'dashboard', icon: '📊', label: 'Inicio' },
    { id: 'radicar', icon: '📤', label: 'Radicar' },
    { id: 'lotes', icon: '📋', label: 'Mis lotes' },
    { id: 'errores', icon: '⚠️', label: 'Pendientes' }
  ],
  AUXILIAR: [
    { id: 'dashboard', icon: '📊', label: 'Inicio' },
    { id: 'cola-auxiliar', icon: '📥', label: 'Cola' },
    { id: 'mis-solicitudes', icon: '📝', label: 'Mis solicitudes' }
  ],
  ANALISTA: [
    { id: 'dashboard', icon: '📊', label: 'Inicio' },
    { id: 'mis-solicitudes', icon: '📝', label: 'Mis solicitudes' }
  ],
  LIDER: [
    { id: 'dashboard', icon: '📊', label: 'Inicio' },
    { id: 'radicar', icon: '📤', label: 'Radicar' },
    { id: 'lotes', icon: '📋', label: 'Lotes' },
    { id: 'solicitudes', icon: '📄', label: 'Solicitudes' },
    { id: 'cola-auxiliar', icon: '📥', label: 'Cola radicación' },
    { id: 'mis-solicitudes', icon: '📝', label: 'Mis solicitudes' },
    { id: 'errores', icon: '⚠️', label: 'Pendientes' },
    { id: 'sep1', icon: '', label: '---' },
    { id: 'usuarios', icon: '👥', label: 'Usuarios' },
    { id: 'asignaciones', icon: '🔀', label: 'Asignaciones' },
    { id: 'reportes', icon: '📈', label: 'Reportes' },
    { id: 'config', icon: '⚙️', label: 'Configuración' }
  ],
  ADMIN: [
    { id: 'dashboard', icon: '📊', label: 'Inicio' },
    { id: 'radicar', icon: '📤', label: 'Radicar' },
    { id: 'lotes', icon: '📋', label: 'Lotes' },
    { id: 'solicitudes', icon: '📄', label: 'Solicitudes' },
    { id: 'cola-auxiliar', icon: '📥', label: 'Cola radicación' },
    { id: 'mis-solicitudes', icon: '📝', label: 'Mis solicitudes' },
    { id: 'errores', icon: '⚠️', label: 'Pendientes' },
    { id: 'sep1', icon: '', label: '---' },
    { id: 'usuarios', icon: '👥', label: 'Usuarios' },
    { id: 'asignaciones', icon: '🔀', label: 'Asignaciones' },
    { id: 'reportes', icon: '📈', label: 'Reportes' },
    { id: 'sep2', icon: '', label: '---' },
    { id: 'logs', icon: '🔧', label: 'Logs sistema' },
    { id: 'config', icon: '⚙️', label: 'Configuración' }
  ]
};

/**
 * Inicialización de la app (se ejecuta al cargar el DOM).
 * Usa datos pre-cargados en __INIT__ (inyectados server-side en doGet).
 * NO hace llamada al servidor para obtener el usuario — ya lo tiene.
 */
function inicializarApp() {
  var initData = window.__INIT__ || {};
  var usuario = initData.usuario || {};

  if (!usuario || !usuario.autorizado) {
    mostrarVista('viewNoAcceso');
    return;
  }

  APP_USUARIO = usuario;
  renderizarHeader(usuario);
  renderizarMenu(usuario.rol);

  // Cache local de datos pre-cargados
  _cacheLocal.resumen = initData.resumen || null;
  _cacheLocal.lotes = initData.lotes || null;

  // Renderizar dashboard inmediatamente con datos pre-cargados (0 latencia)
  if (_cacheLocal.resumen) {
    _renderizarDashboardConDatos(_cacheLocal.resumen);
    // Activar Línea de Vida con los datos del resumen
    if (typeof actualizarLineasDeVida === 'function') {
      actualizarLineasDeVida(usuario.rol, _cacheLocal.resumen);
    }
  } else {
    _mostrarSkeletonDashboard();
    cargarDashboard();
  }
}

/** Cache en memoria del frontend para evitar re-llamadas innecesarias */
var _cacheLocal = { resumen: null, lotes: null, ttl: 0 };
var CACHE_TTL_MS = 30000; // 30 segundos

/** Control de navegación — evita que respuestas tardías sobreescriban la vista actual */
var _navId = 0;
var _seccionActiva = 'dashboard';

function _sigueVigente(navIdCapturado) {
  return navIdCapturado === _navId;
}

function _cacheValido() {
  return _cacheLocal.ttl > Date.now();
}

function _invalidarCache() {
  _cacheLocal.resumen = null;
  _cacheLocal.lotes = null;
  _cacheLocal.ttl = 0;
}

function renderizarHeader(usuario) {
  var elUser = document.getElementById('headerUser');
  var elRol = document.getElementById('headerRol');
  if (elUser) elUser.textContent = usuario.nombre || usuario.email;
  if (elRol) elRol.textContent = usuario.rol;
}

function _mostrarSkeletonDashboard() {
  var container = document.getElementById('viewDashboard');
  var nombre = APP_USUARIO ? APP_USUARIO.nombre : '';
  var hora = new Date().getHours();
  var saludo = hora < 12 ? 'Buenos días' : hora < 18 ? 'Buenas tardes' : 'Buenas noches';

  container.innerHTML = '<div class="stack stack--loose">'
    + '<div class="card card--hero">'
    + '<h1 style="margin-bottom:var(--space-1);">' + saludo + ', ' + nombre + '</h1>'
    + '<p style="margin:0;font-size:var(--text-sm);">Cargando tu resumen...</p>'
    + '</div>'
    + '<div class="grid grid--4">'
    + '<div class="skeleton skeleton-card"></div>'
    + '<div class="skeleton skeleton-card"></div>'
    + '<div class="skeleton skeleton-card"></div>'
    + '<div class="skeleton skeleton-card"></div>'
    + '</div>'
    + '</div>';
  mostrarVista('viewDashboard');
}

function renderizarMenu(rol) {
  var menu = MENUS_POR_ROL[rol] || MENUS_POR_ROL['COMERCIAL'];
  var nav = document.getElementById('navMenu');
  if (!nav) return;

  var html = '';
  for (var i = 0; i < menu.length; i++) {
    var item = menu[i];
    if (item.label === '---') {
      html += '<li class="app-sidebar__separator"></li>';
    } else {
      html += '<li><a class="app-sidebar__link" href="#/' + item.id + '" data-view="' + item.id + '">'
        + '<span class="app-sidebar__icon">' + item.icon + '</span>'
        + '<span>' + item.label + '</span>'
        + '</a></li>';
    }
  }
  nav.innerHTML = html;

  // Event listeners para navegación
  var links = nav.querySelectorAll('.app-sidebar__link');
  for (var j = 0; j < links.length; j++) {
    links[j].addEventListener('click', function(e) {
      e.preventDefault();
      var view = this.getAttribute('data-view');
      navegarA(view);
    });
  }
}

function mostrarVista(vistaId) {
  // Ocultar todas las vistas
  var vistas = document.querySelectorAll('[id^="view"]');
  for (var i = 0; i < vistas.length; i++) {
    vistas[i].style.display = 'none';
  }
  // Mostrar la solicitada
  var vista = document.getElementById(vistaId);
  if (vista) vista.style.display = 'block';

  // Marcar item activo en sidebar
  var links = document.querySelectorAll('.app-sidebar__link');
  for (var j = 0; j < links.length; j++) {
    links[j].classList.remove('app-sidebar__link--active');
  }
}

function navegarA(seccion) {
  // Cancelar cualquier carga pendiente de la sección anterior
  _navId++;
  var miNavId = _navId;

  mostrarVista('viewLoading');

  // Marcar como activo
  var link = document.querySelector('[data-view="' + seccion + '"]');
  if (link) link.classList.add('app-sidebar__link--active');

  // Cerrar sidebar en mobile
  var sidebar = document.getElementById('sidebar');
  if (sidebar) sidebar.classList.remove('app-layout__sidebar--open');

  // Guardar sección activa
  _seccionActiva = seccion;

  switch (seccion) {
    case 'dashboard':
      cargarDashboard();
      break;
    case 'lotes':
      cargarMisLotes(1);
      break;
    case 'usuarios':
      cargarVistaUsuarios();
      break;
    case 'solicitudes':
      cargarVistaSolicitudes();
      break;
    case 'errores':
      cargarVistaErroresComercial();
      break;
    case 'asignaciones':
      cargarVistaAsignaciones();
      break;
    case 'reportes':
      cargarVistaReportes();
      break;
    case 'cola-auxiliar':
      cargarColaAuxiliar();
      break;
    case 'mis-solicitudes':
      cargarMisSolicitudesAuxiliar();
      break;
    case 'radicar':
      mostrarVistaRadicar();
      break;
    case 'config':
      cargarVistaConfiguracion();
      break;
    default:
      mostrarVistaEnConstruccion(seccion);
      break;
  }
}

function cargarDashboard() {
  var navIdLocal = _navId;

  if (_cacheLocal.resumen && _cacheValido()) {
    _renderizarDashboardConDatos(_cacheLocal.resumen);
    return;
  }
  if (_cacheLocal.resumen) {
    _cacheLocal.ttl = Date.now() + CACHE_TTL_MS;
    _renderizarDashboardConDatos(_cacheLocal.resumen);
    return;
  }

  callServer('api_obtenerResumenDashboard')
    .then(function(r) {
      if (!_sigueVigente(navIdLocal)) return;
      _cacheLocal.resumen = r;
      _cacheLocal.ttl = Date.now() + CACHE_TTL_MS;
      _renderizarDashboardConDatos(r);
      if (typeof actualizarLineasDeVida === 'function') actualizarLineasDeVida(APP_USUARIO.rol, r);
    })
    .catch(function(err) { if (!_sigueVigente(navIdLocal)) return; console.error(err); _mostrarError('No pudimos cargar el resumen.'); });
}

function _renderizarDashboardConDatos(r) {
      var hora = new Date().getHours();
      var saludo = hora < 12 ? 'Buenos días' : hora < 18 ? 'Buenas tardes' : 'Buenas noches';
      var nombre = APP_USUARIO ? APP_USUARIO.nombre : '';
      var esAdmin = APP_USUARIO && (APP_USUARIO.rol === 'LIDER' || APP_USUARIO.rol === 'ADMIN');

      var html = '<div class="stack">'
        // Hero compacto
        + '<div class="card card--hero" style="padding:var(--space-6);">'
        + '<h2 style="margin-bottom:var(--space-1);">' + saludo + ', ' + nombre + '</h2>'
        + '<p style="margin:0;font-size:var(--text-sm);">Panel de gestión de inducciones</p>'
        + '</div>';

      if (esAdmin) {
        // KPIs compactos en 2 filas de 4 (más pequeños)
        html += '<div class="grid grid--4" style="gap:var(--space-3);">'
          + _kpiCompacto('Pólizas', r.totalPolizas, 'navy', '')
          + _kpiCompacto('Pend. radicar', r.pendienteRadicar, 'navy', 'PENDIENTE RADICAR')
          + _kpiCompacto('Radicado', r.radicado, 'navy', 'RADICADO')
          + _kpiCompacto('Pend. asignar', r.pendienteAsignar, 'navy', 'PENDIENTE ASIGNAR')
          + '</div>'
          + '<div class="grid grid--4" style="gap:var(--space-3);">'
          + _kpiCompacto('En análisis', r.enAnalisis, 'navy', 'EN ANÁLISIS')
          + _kpiCompacto('Error terceros', r.errorTerceros, 'red', 'ERROR EN TERCEROS')
          + _kpiCompacto('Pendiente paz y salvo', r.pendientePS, 'orange', 'PENDIENTE PAZ Y SALVO')
          + _kpiCompacto('Terminado', r.terminados, 'green', 'TERMINADO')
          + '</div>';

        // Gráfico de distribución (barra horizontal proporcional)
        var total = r.inducciones || 1;
        html += '<div class="card" style="padding:var(--space-5);">'
          + '<div class="flex flex--between" style="margin-bottom:var(--space-3);"><h4 style="margin:0;">Distribución del pipeline</h4>'
          + '<span style="font-size:var(--text-sm);color:var(--color-mono-500);">' + _fmtNum(r.inducciones) + ' inducciones · ' + _fmtNum(r.totalLotes) + ' lotes</span></div>'
          + _barraDistribucion(r, total)
          + '</div>';

      } else {
        // Comercial: KPIs compactos
        html += '<div class="grid grid--3" style="gap:var(--space-3);">'
          + _kpiCompacto('Pend. radicar', r.pendienteRadicar, 'navy', 'PENDIENTE RADICAR')
          + _kpiCompacto('En análisis', r.enAnalisis, 'navy', 'EN ANÁLISIS')
          + _kpiCompacto('Pendiente paz y salvo', r.pendientePS, 'orange', 'PENDIENTE PAZ Y SALVO')
          + '</div>'
          + '<div class="grid grid--3" style="gap:var(--space-3);">'
          + _kpiCompacto('Terminados', r.terminados, 'green', 'TERMINADO')
          + _kpiCompacto('Error terceros', r.errorTerceros, 'red', 'ERROR EN TERCEROS')
          + _kpiCompacto('Radicados', r.radicado || r.radicadosSemana || 0, 'navy', 'RADICADO')
          + '</div>';

        // Barra de progreso simple para comercial
        var totalC = (r.pendienteRadicar||0) + (r.enAnalisis||0) + (r.pendientePS||0) + (r.terminados||0) + (r.errorTerceros||0) + (r.radicado||0);
        if (totalC > 0) {
          html += '<div class="card" style="padding:var(--space-5);">'
            + '<h4 style="margin:0 0 var(--space-3);">Tu progreso general</h4>'
            + _barraDistribucion(r, totalC || 1)
            + '</div>';
        }

        // Alerta de errores pendientes (clickeable → lleva a Pendientes)
        if (r.errorTerceros > 0) {
          html += '<div class="alert alert--error" onclick="navegarA(\'errores\')" style="cursor:pointer;">'
            + '<span style="font-size:1.1rem;">⚠️</span>'
            + '<div><strong style="color:var(--color-primary-red);">' + r.errorTerceros + ' solicitud(es) requieren tu atención</strong>'
            + '<p style="margin:var(--space-1) 0 0;font-size:var(--text-sm);color:var(--color-mono-500);">Haz clic aquí para ver qué información necesitamos.</p></div>'
            + '</div>';
        }

        // Accesos rápidos como cards compactas
        html += '<div class="grid grid--2" style="gap:var(--space-3);">'
          + '<div class="card" onclick="navegarA(\'radicar\')" style="cursor:pointer;padding:var(--space-5);display:flex;align-items:center;gap:var(--space-3);">'
          + '<div style="font-size:1.5rem;">📤</div>'
          + '<div><strong style="font-size:var(--text-sm);color:var(--color-primary-navy);">Radicar nuevo lote</strong>'
          + '<p style="margin:0;font-size:var(--text-xs);color:var(--color-mono-500);">Carga tu planilla y envía a radicación</p></div></div>'
          + '<div class="card" onclick="navegarA(\'lotes\')" style="cursor:pointer;padding:var(--space-5);display:flex;align-items:center;gap:var(--space-3);">'
          + '<div style="font-size:1.5rem;">📋</div>'
          + '<div><strong style="font-size:var(--text-sm);color:var(--color-primary-navy);">Consultar mis lotes</strong>'
          + '<p style="margin:0;font-size:var(--text-xs);color:var(--color-mono-500);">Busca y filtra por estado</p></div></div>'
          + '</div>';
      }

      html += '</div>';
      document.getElementById('viewDashboard').innerHTML = html;
      mostrarVista('viewDashboard');
}

function _kpiCompacto(titulo, valor, tema, filtroEstado) {
  var bgMap = { navy: 'var(--color-primary-navy)', red: 'var(--color-primary-red)', orange: 'var(--color-accent-orange)', green: 'var(--color-success)', teal: 'var(--color-accent-teal)' };
  var bg = bgMap[tema] || bgMap.navy;
  var esClickable = filtroEstado && filtroEstado.length > 0;
  var onclick = esClickable ? ' onclick="_filtrarLotesPorEstado(\'' + filtroEstado + '\')"' : '';
  var cursor = esClickable ? 'cursor:pointer;' : '';

  return '<div class="kpi-card"' + onclick + ' style="background:' + bg + ';color:var(--color-mono-0);' + cursor + 'padding:var(--space-4) var(--space-3);">'
    + '<div style="font-size:var(--text-xs);font-weight:var(--font-semibold);text-transform:uppercase;letter-spacing:var(--tracking-caps);opacity:0.8;margin-bottom:var(--space-1);">' + titulo + '</div>'
    + '<div style="font-size:var(--text-h1);font-weight:var(--font-extrabold);line-height:1;letter-spacing:var(--tracking-tight);">' + _fmtNum(valor) + '</div>'
    + '</div>';
}

function _barraDistribucion(r, total) {
  var segmentos = [
    { label: 'Terminado', valor: r.terminados || 0, color: 'var(--color-success)' },
    { label: 'En análisis', valor: r.enAnalisis || 0, color: 'var(--color-primary-navy)' },
    { label: 'Pend. asignar', valor: r.pendienteAsignar || 0, color: '#5a6d8f' },
    { label: 'Pend. radicar', valor: r.pendienteRadicar || 0, color: '#8b9dc3' },
    { label: 'Error terceros', valor: r.errorTerceros || 0, color: 'var(--color-primary-red)' },
    { label: 'Pendiente paz y salvo', valor: r.pendientePS || 0, color: 'var(--color-accent-orange)' }
  ];

  var html = '<div style="display:flex;height:12px;border-radius:var(--radius-full);overflow:hidden;background:var(--color-mono-100);margin-bottom:var(--space-3);">';
  for (var s = 0; s < segmentos.length; s++) {
    var pct = Math.round((segmentos[s].valor / total) * 100);
    if (pct < 1 && segmentos[s].valor > 0) pct = 1;
    if (pct > 0) {
      html += '<div style="width:' + pct + '%;background:' + segmentos[s].color + ';transition:width var(--duration-slow);" title="' + segmentos[s].label + ': ' + segmentos[s].valor + '"></div>';
    }
  }
  html += '</div>';

  // Leyenda
  html += '<div style="display:flex;flex-wrap:wrap;gap:var(--space-3) var(--space-5);font-size:var(--text-xs);color:var(--color-mono-500);">';
  for (var l = 0; l < segmentos.length; l++) {
    if (segmentos[l].valor > 0) {
      html += '<div style="display:flex;align-items:center;gap:var(--space-1);">'
        + '<div style="width:8px;height:8px;border-radius:50%;background:' + segmentos[l].color + ';"></div>'
        + segmentos[l].label + ' (' + _fmtNum(segmentos[l].valor) + ')</div>';
    }
  }
  html += '</div>';

  return html;
}

function _kpiAdmin(titulo, valor, tema, filtroEstado) {
  var bgMap = { navy: 'var(--color-primary-navy)', red: 'var(--color-primary-red)', orange: 'var(--color-accent-orange)', green: 'var(--color-success)', teal: 'var(--color-accent-teal)' };
  var bg = bgMap[tema] || bgMap.navy;
  var esClickable = filtroEstado && filtroEstado.length > 0;
  var onclick = esClickable ? ' onclick="_filtrarLotesPorEstado(\'' + filtroEstado + '\')"' : '';
  var cursor = esClickable ? 'cursor:pointer;' : '';

  return '<div class="kpi-card"' + onclick + ' style="background:' + bg + ';color:var(--color-mono-0);' + cursor + '">'
    + '<div class="kpi-card__label">' + titulo + '</div>'
    + '<div class="kpi-card__value">' + _fmtNum(valor) + '</div>'
    + '</div>';
}

function _fmtNum(n) { return (n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }

function _filtrarLotesPorEstado(estado) {
  _filtroEstadoActivo = estado;
  navegarA('lotes');
}

var _filtroEstadoActivo = '';

// Hamburger menu toggle (mobile)
document.addEventListener('DOMContentLoaded', function() {
  var toggle = document.getElementById('menuToggle');
  var sidebar = document.getElementById('sidebar');
  if (toggle && sidebar) {
    toggle.addEventListener('click', function() {
      sidebar.classList.toggle('app-layout__sidebar--open');
    });
  }
});

// ============================================================
//  VISTA: MIS LOTES (con filtro local — sin re-llamar al servidor)
// ============================================================

var _lotesPageActual = 1;
var _todosLosLotes = null; // Cache de todos los lotes (se pide 1 vez)

function cargarMisLotes(pagina) {
  _lotesPageActual = pagina || 1;

  // Si ya tenemos todos los lotes en memoria, filtrar localmente
  if (_todosLosLotes) {
    _renderizarLotesFiltrados();
    return;
  }

  // Si tenemos pre-carga de doGet (primera vez), usarla
  if (_cacheLocal.lotes && !_filtroEstadoActivo && !_busquedaLoteActiva) {
    _todosLosLotes = _cacheLocal.lotes.datos;
    _cacheLocal.lotes = null;
    _renderizarLotesFiltrados();
    return;
  }

  // Primera carga: pedir TODOS los lotes al servidor (sin filtro, sin paginación servidor)
  callServer('api_obtenerTodosLosLotes')
    .then(function(datos) {
      if (_seccionActiva !== 'lotes') return;
      _todosLosLotes = datos || [];
      _renderizarLotesFiltrados();
    })
    .catch(function(err) { if (_seccionActiva !== 'lotes') return; console.error('Error lotes:', err); _mostrarError('No pudimos cargar los lotes.'); });
}

function _renderizarLotesFiltrados() {
  var filtrados = _todosLosLotes || [];

  // Filtrar por estado
  if (_filtroEstadoActivo) {
    filtrados = filtrados.filter(function(l) { return l.estados && l.estados[_filtroEstadoActivo]; });
  }

  // Filtrar por búsqueda de ID
  if (_busquedaLoteActiva) {
    var busq = _busquedaLoteActiva.toUpperCase();
    filtrados = filtrados.filter(function(l) { return l.idLote.toUpperCase().indexOf(busq) !== -1; });
  }

  // Sort solo si el usuario lo activó (default: orden del servidor = más recientes primero)
  if (_lotesSort.campo) {
    filtrados = filtrados.slice(); // copia para no mutar el original
    _sortArray(filtrados, _lotesSort.campo, _lotesSort.dir);
  }

  // Paginación local
  var porPagina = 10;
  var total = filtrados.length;
  var totalPaginas = Math.ceil(total / porPagina);
  if (_lotesPageActual > totalPaginas) _lotesPageActual = 1;
  var inicio = (_lotesPageActual - 1) * porPagina;
  var paginados = filtrados.slice(inicio, inicio + porPagina);

  _renderizarLotesConDatos({ datos: paginados, total: total, pagina: _lotesPageActual, totalPaginas: totalPaginas });
}

var _lotesSort = { campo: '', dir: '' }; // campo y dirección de ordenamiento

function _renderizarLotesConDatos(resultado) {
      var container = document.getElementById('viewDashboard');
      if (!resultado || resultado.datos.length === 0) {
        var msgVacio = _busquedaLoteActiva ? 'No se encontró el lote "' + _busquedaLoteActiva + '".'
          : _filtroEstadoActivo ? 'No hay lotes con estado "' + _filtroEstadoActivo + '".'
          : 'No hay lotes para mostrar.';
        container.innerHTML = '<div class="stack">' + _filtroHeader()
          + '<div class="card card--flat" style="text-align:center; padding:var(--spacing-2xl);">'
          + '<div style="font-size:2.5rem; margin-bottom:var(--spacing-md);">📋</div>'
          + '<h3>' + msgVacio + '</h3></div></div>';
        mostrarVista('viewDashboard');
        return;
      }

      var html = '<div class="stack">' + _filtroHeader()
        + '<div class="flex flex--between"><h2>Lotes</h2>'
        + '<small>' + resultado.total + ' lote(s)</small></div>'
        + '<div class="card card--flat" style="padding:0; overflow:hidden;"><table class="table">'
        + '<thead><tr>' + _thSort('idLote','ID Lote','lotes') + _thSort('fecha','Fecha','lotes') + _thSort('comercial','Comercial','lotes') + _thSort('contratos','Contratos','lotes') + _thSort('estadoPrincipal','Estado','lotes') + '</tr></thead><tbody>';

      for (var i = 0; i < resultado.datos.length; i++) {
        var lote = resultado.datos[i];
        html += '<tr style="cursor:pointer;" onclick="_verDetalleLote(\'' + lote.idLote + '\')">'
          + '<td style="font-family:var(--font-mono); font-size:var(--text-sm);">' + lote.idLote + '</td>'
          + '<td>' + lote.fecha + '</td>'
          + '<td>' + (lote.comercial || '-') + '</td>'
          + '<td style="text-align:center;">' + lote.contratos + '</td>'
          + '<td>' + _badgeEstado(lote.estadoPrincipal) + '</td></tr>';
      }

      html += '</tbody></table></div>';
      if (resultado.totalPaginas > 1) {
        html += '<div class="flex flex--center flex--gap-md">'
          + '<button class="btn btn--ghost" ' + (_lotesPageActual <= 1 ? 'disabled' : '') + ' onclick="cargarMisLotes(' + (_lotesPageActual - 1) + ')">← Anterior</button>'
          + '<span style="font-size:var(--text-sm); color:var(--color-mono-500);">Página ' + _lotesPageActual + ' de ' + resultado.totalPaginas + '</span>'
          + '<button class="btn btn--ghost" ' + (_lotesPageActual >= resultado.totalPaginas ? 'disabled' : '') + ' onclick="cargarMisLotes(' + (_lotesPageActual + 1) + ')">Siguiente →</button></div>';
      }
      html += '</div>';
      container.innerHTML = html;
      mostrarVista('viewDashboard');
}

function _filtroHeader() {
  var html = '<div class="flex flex--gap-md" style="align-items:center; flex-wrap:wrap;">';

  // Barra de búsqueda
  html += '<div class="flex flex--gap-sm" style="flex:1; min-width:200px;">'
    + '<input class="input" id="inputBuscarLote" type="text" placeholder="Buscar por ID de lote..." value="' + (_busquedaLoteActiva || '') + '" style="flex:1; padding:10px 14px; font-size:var(--text-sm);" onkeydown="if(event.key===\'Enter\')_buscarLote()">'
    + '<button class="btn btn--primary" style="padding:10px 16px;" onclick="_buscarLote()">Buscar</button>'
    + '</div>';

  // Select de estado
  html += '<select class="input" style="width:auto; min-width:180px; padding:10px 14px; font-size:var(--text-sm);" onchange="_filtrarPorSelect(this.value)">'
    + '<option value="">Todos los estados</option>'
    + '<option value="PENDIENTE RADICAR"' + (_filtroEstadoActivo === 'PENDIENTE RADICAR' ? ' selected' : '') + '>Pendiente radicar</option>'
    + '<option value="RADICADO"' + (_filtroEstadoActivo === 'RADICADO' ? ' selected' : '') + '>Radicado</option>'
    + '<option value="PENDIENTE ASIGNAR"' + (_filtroEstadoActivo === 'PENDIENTE ASIGNAR' ? ' selected' : '') + '>Pendiente asignar</option>'
    + '<option value="EN ANÁLISIS"' + (_filtroEstadoActivo === 'EN ANÁLISIS' ? ' selected' : '') + '>En análisis</option>'
    + '<option value="ERROR EN TERCEROS"' + (_filtroEstadoActivo === 'ERROR EN TERCEROS' ? ' selected' : '') + '>Error en terceros</option>'
    + '<option value="PENDIENTE PAZ Y SALVO"' + (_filtroEstadoActivo === 'PENDIENTE PAZ Y SALVO' ? ' selected' : '') + '>Pendiente paz y salvo</option>'
    + '<option value="TERMINADO"' + (_filtroEstadoActivo === 'TERMINADO' ? ' selected' : '') + '>Terminado</option>'
    + '</select>';

  // Botón limpiar (si hay algún filtro activo)
  if (_filtroEstadoActivo || _busquedaLoteActiva) {
    html += '<button class="btn btn--ghost" style="font-size:var(--text-sm); padding:8px 12px;" onclick="_limpiarFiltro()">✕ Limpiar</button>';
  }

  html += '</div>';
  return html;
}

function _filtrarPorSelect(valor) {
  _filtroEstadoActivo = valor;
  _lotesPageActual = 1;
  _renderizarLotesFiltrados();
}

function _buscarLote() {
  var input = document.getElementById('inputBuscarLote');
  var valor = (input ? input.value : '').trim();
  _filtroEstadoActivo = '';
  _busquedaLoteActiva = valor;
  _lotesPageActual = 1;
  _renderizarLotesFiltrados();
}

var _busquedaLoteActiva = '';

function _limpiarFiltro() {
  _filtroEstadoActivo = '';
  _busquedaLoteActiva = '';
  _lotesPageActual = 1;
  _renderizarLotesFiltrados();
}

function _badgeEstado(estado) {
  var cls = 'badge--gray';
  if (estado === 'TERMINADO') cls = 'badge--success';
  else if (estado === 'EN ANÁLISIS') cls = 'badge--navy';
  else if (estado === 'ERROR EN TERCEROS') cls = 'badge--red';
  else if (estado === 'PENDIENTE PAZ Y SALVO') cls = 'badge--orange';
  else if (estado === 'RADICADO') cls = 'badge--teal';
  return '<span class="badge ' + cls + '">' + estado + '</span>';
}

function _abrirSolicitudAuxiliar(idx) {
  var s = _colaAuxiliarCache[idx];

  // Mostrar modal con spinner mientras carga datos completos
  var modal = document.createElement('div');
  modal.id = 'modalAuxiliar';
  modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;';
  modal.addEventListener('click', function(e) { if (e.target === modal) _cerrarModalAuxiliar(); });
  modal.innerHTML = '<div style="background:white;border-radius:var(--radius-lg);padding:40px;text-align:center;"><div class="spinner" style="margin:0 auto;"></div><p style="margin-top:12px;color:var(--color-mono-500);">Cargando solicitud...</p></div>';
  document.body.appendChild(modal);

  // Cargar datos completos de la solicitud
  callServer('api_obtenerSolicitudAuxiliar', s.fila)
    .then(function(datos) {
      if (!datos) { _cerrarModalAuxiliar(); _toast('No se pudo cargar la solicitud.', 'error'); return; }
      _renderizarModalAuxiliar(datos);
    })
    .catch(function(err) { _cerrarModalAuxiliar(); _toast('Error: ' + (err.message || err), 'error'); });
}

function _marcarRadicadoAuxiliar(uuid) {
  // Recoger números de solicitud SAI
  var solicitudInq = document.getElementById('aux_solicitudInq');
  var numeros = {
    solicitudInquilino: solicitudInq ? solicitudInq.value.trim() : ''
  };

  // Recoger NRO de cada codeudor
  for (var n = 1; n <= 5; n++) {
    var input = document.getElementById('aux_nro_COA' + n);
    if (input) numeros['nroCoa' + n] = input.value.trim();
  }

  // Recoger siniestros
  var siniestros = '';
  var partes = [];
  // Inquilino
  var chkInq = document.getElementById('aux_siniestro_INQ');
  if (chkInq && chkInq.checked) {
    var numsInq = document.getElementById('aux_siniestro_nums_INQ');
    if (numsInq && numsInq.value.trim()) {
      partes.push('INQ:' + numsInq.value.trim());
    }
  }
  // Codeudores
  for (var s = 1; s <= 5; s++) {
    var chkCoa = document.getElementById('aux_siniestro_COA' + s);
    if (chkCoa && chkCoa.checked) {
      var numsCoa = document.getElementById('aux_siniestro_nums_COA' + s);
      if (numsCoa && numsCoa.value.trim()) {
        partes.push('COA' + s + ':' + numsCoa.value.trim());
      }
    }
  }
  if (partes.length > 0) siniestros = partes.join('|');
  numeros.siniestros = siniestros;

  // Validar que al menos el inquilino tenga número
  if (!numeros.solicitudInquilino) {
    _toast('Ingresa el número de solicitud SAI del inquilino.', 'warning');
    return;
  }

  callServer('api_marcarRadicado', uuid, numeros)
    .then(function(res) {
      _cerrarModalAuxiliar();
      if (res && res.ok) {
        _colaAuxiliarCache = null;
        cargarColaAuxiliar();
      } else {
        _toast(res ? res.mensaje : 'Error al marcar.', 'error');
      }
    })
    .catch(function(err) { _toast('Error: ' + err.message, 'error'); });
}

function _toggleSiniestro(id) {
  var chk = document.getElementById('aux_siniestro_' + id);
  var field = document.getElementById('aux_siniestro_field_' + id);
  if (chk && field) {
    field.style.display = chk.checked ? 'block' : 'none';
  }
}

function _marcarErrorTerceros(idx) {
  var s = idx >= 0 ? _colaAuxiliarCache[idx] : window._solicitudAuxiliarActual;

    + '<p style="font-size:var(--text-sm);color:var(--color-mono-500);margin-bottom:16px;">Selecciona quién tiene error y qué necesitas que envíe el comercial:</p>';

  // Inquilino
  html += _bloqueParticipanteError('INQ', s.arrendatario + ' (Inquilino)');

  // Codeudores
  if (s.codeudores) {
    for (var c = 0; c < s.codeudores.length; c++) {
      var coa = s.codeudores[c];
      html += _bloqueParticipanteError(coa.label, coa.nombre + ' (' + coa.label + ')');
    }
  }

  // Nota interna
  html += '<div style="margin-top:16px;">'
    + '<label style="font-size:11px;text-transform:uppercase;color:var(--color-mono-500);letter-spacing:0.3px;">Nota interna (solo visible para el equipo)</label>'
    + '<textarea class="input" id="et_nota" rows="3" placeholder="Ej: SAI reporta que el celular es inválido..." style="margin-top:4px;resize:vertical;"></textarea>'
    + '</div>';

  // Acciones
  html += '</div>'
    + '<div style="padding:16px 24px;border-top:1px solid rgba(0,0,0,0.06);display:flex;gap:12px;justify-content:flex-end;">'

  modal.innerHTML = html;
  document.body.appendChild(modal);

function _enviarErrorTerceros(uuid) {
  // Recoger datos del formulario
  var participantes = [];
  var checks = document.querySelectorAll('[id^="et_check_"]');
  for (var i = 0; i < checks.length; i++) {
    if (!checks[i].checked) continue;
    var id = checks[i].id.replace('et_check_', '');
    var reqs = [];
    var reqChecks = document.querySelectorAll('.et_req_' + id + ':checked');
    for (var r = 0; r < reqChecks.length; r++) {
      reqs.push(reqChecks[r].value);
    }
    if (reqs.length === 0) {
      _toast('Selecciona al menos un requerimiento para ' + id, 'warning');
      return;
    }
    participantes.push({ participante: id, requerimientos: reqs.join('|') });
  }

  if (participantes.length === 0) {
    _toast('Selecciona al menos un participante con error.', 'warning');
    return;
  }

  var nota = document.getElementById('et_nota').value.trim();

  // Feedback inmediato — deshabilitar botón
  var btnErr = document.querySelector('#modalErrorTerceros .btn--danger');
  if (btnErr) { btnErr.disabled = true; btnErr.textContent = '⏳ Guardando...'; }

  callServer('api_marcarErrorTerceros', uuid, participantes, nota)
    .then(function(res) {
      _cerrarModalError();
      if (res && res.ok) {
        _toast('Error registrado. Se notificó al comercial.', 'success');
        _colaAuxiliarCache = null;
        cargarColaAuxiliar();
      } else {
        _toast(res ? res.mensaje : 'Error al guardar.', 'error');
      }
    })
    .catch(function(err) {
      if (btnErr) { btnErr.disabled = false; btnErr.textContent = 'Guardar error y notificar'; }
      _toast('Error: ' + (err.message || err), 'error');
    });
}

function _cerrarModalError() {
  var modal = document.getElementById('modalErrorTerceros');
  if (modal) modal.remove();
}

function _cerrarModalAuxiliar() {

// ============================================================

function _thSort(campo, label, tabla) {
  var sortVar = tabla === 'lotes' ? _lotesSort : _solicitudesSort;
  var arrow = '';
  if (sortVar.campo === campo) {
    arrow = sortVar.dir === 'asc' ? ' ▲' : ' ▼';
  }
  return '<th style="cursor:pointer;user-select:none;" onclick="_ordenar(\'' + campo + '\',\'' + tabla + '\')">' + label + '<span style="opacity:0.5;font-size:10px;margin-left:4px;">' + arrow + '</span></th>';
}

var _solicitudesSort = { campo: '', dir: '' };

function _ordenar(campo, tabla) {
  var sortVar = tabla === 'lotes' ? _lotesSort : _solicitudesSort;

  if (sortVar.campo === campo) {
    sortVar.dir = sortVar.dir === 'asc' ? 'desc' : 'asc';
  } else {
    sortVar.campo = campo;
    sortVar.dir = 'asc';
  }

  if (tabla === 'lotes') {
    _lotesSort = sortVar;
    _renderizarLotesFiltrados();
  } else {
    _solicitudesSort = sortVar;
    _renderizarSolicitudesFiltradas();
  }
}

function _sortArray(arr, campo, dir) {
  if (!arr) return;
  arr.sort(function(a, b) {
    var va = a[campo] || '';
    var vb = b[campo] || '';
    // Intentar comparar como números
    var na = parseFloat(String(va).replace(/[^0-9.-]/g, ''));
    var nb = parseFloat(String(vb).replace(/[^0-9.-]/g, ''));
    if (!isNaN(na) && !isNaN(nb)) {
      return dir === 'asc' ? na - nb : nb - na;
    }
    // Comparar como strings
    va = String(va).toUpperCase();
    vb = String(vb).toUpperCase();
    if (va < vb) return dir === 'asc' ? -1 : 1;
    if (va > vb) return dir === 'asc' ? 1 : -1;
    return 0;
  });
}

function _pedirSolicitudAnalista() {
  // Feedback inmediato — deshabilitar botón y mostrar estado
  var btns = document.querySelectorAll('button');
  for (var b = 0; b < btns.length; b++) {
    if (btns[b].textContent.indexOf('Pedir') !== -1) {
      btns[b].disabled = true;
      btns[b].textContent = '⏳ Asignando...';
      break;
    }
  }

  callServer('api_pedirSolicitudAnalista')
    .then(function(res) {
      if (res && res.ok) {
        _cargarVistaAnalista();
      } else {
        _toast(res ? res.mensaje : 'No se pudo asignar.', 'error');
        _cargarVistaAnalista(); // Recargar para restaurar botón

    })
    .catch(function(err) {

function _renderizarAsignaciones(datos) {

  var html = '<div class="stack">'
    + '<div class="flex flex--between"><h2>Asignaciones</h2><small>' + datos.length + ' solicitud(es) en evaluación</small></div>';

    html += '<div class="card card--flat" style="text-align:center;padding:var(--spacing-2xl);">'
      + '<h3>No hay solicitudes asignadas</h3></div>';

function _renderizarErroresComercial(errores) {
  var container = document.getElementById('viewDashboard');

  if (errores.length === 0) {
    container.innerHTML = '<div class="stack">'
      + '<h2>Pendientes de corrección</h2>'
      + '<div class="card" style="text-align:center;padding:var(--space-12);">'
      + '<div class="empty-state__icon">✅</div>'
      + '<div class="empty-state__title">Todo en orden</div>'
      + '<div class="empty-state__text">No tienes correcciones pendientes en este momento.</div>'
      + '</div></div>';
    mostrarVista('viewDashboard');
    return;
  }

  // Separar por estado
  var pendientes = errores.filter(function(e) { return e.participantes.some(function(p) { return p.estadoError === 'PENDIENTE'; }); });
  var enEspera = errores.filter(function(e) { return e.participantes.every(function(p) { return p.estadoError === 'CORRECCION_RECIBIDA'; }); });

  var esAdmin = APP_USUARIO && (APP_USUARIO.rol === 'LIDER' || APP_USUARIO.rol === 'ADMIN');

  var html = '<div class="stack stack--loose">'
    + '<div><h2>Pendientes de corrección</h2>'
    + '<p style="font-size:var(--text-sm);color:var(--color-mono-500);margin:var(--space-1) 0 0;">' + errores.length + ' caso(s) activos</p></div>';

  // Sección 1: Pendientes de respuesta
  if (pendientes.length > 0) {
    html += '<div><h3 style="font-size:var(--text-body);color:var(--color-primary-red);margin-bottom:var(--space-3);">⚠️ Requieren tu respuesta (' + pendientes.length + ')</h3>';
    for (var i = 0; i < pendientes.length; i++) {
      html += _renderCardError(pendientes[i], true, esAdmin);
    }
    html += '</div>';
  }

  // Sección 2: En espera de revisión
  if (enEspera.length > 0) {
    html += '<div><h3 style="font-size:var(--text-body);color:var(--color-accent-teal);margin-bottom:var(--space-3);">⏳ En espera de revisión (' + enEspera.length + ')</h3>';
    for (var j = 0; j < enEspera.length; j++) {
      html += _renderCardError(enEspera[j], false, esAdmin);
    }
    html += '</div>';
  }

  html += '</div>';
  container.innerHTML = html;
  mostrarVista('viewDashboard');
}

function _renderCardError(e, puedeResponder, esAdmin) {
  var tieneCorreccion = e.participantes.some(function(p) { return p.estadoError === 'CORRECCION_RECIBIDA'; });
  var borderColor = puedeResponder ? 'var(--color-primary-red)' : 'var(--color-accent-teal)';

  var html = '<div class="card" style="border-left:4px solid ' + borderColor + ';margin-bottom:var(--space-3);">'
    + '<div class="flex flex--between" style="margin-bottom:var(--space-4);flex-wrap:wrap;gap:var(--space-2);">'
    + '<div>'
    + '<h3 style="margin-bottom:var(--space-1);">' + e.arrendatario + '</h3>'
    + '<div style="font-size:var(--text-sm);color:var(--color-mono-500);">Lote: <strong>' + e.idLote + '</strong> · Radicado: ' + (e.fechaRadicacion || e.fechaError) + '</div>';

  if (tieneCorreccion && !puedeResponder) {
    html += '<span class="badge badge--teal" style="margin-top:var(--space-2);">✓ Corrección enviada — en espera de revisión</span>';
  }

  html += '</div>';

  if (puedeResponder) {
    html += '<button class="btn btn--primary" style="flex-shrink:0;" onclick=\'_abrirCorreccion(' + JSON.stringify(e).replace(/'/g, "\\'") + ')\'>Responder →</button>';
  }

  html += '</div>';

  // Detalle por participante
  for (var p = 0; p < e.participantes.length; p++) {
    var part = e.participantes[p];
    var tipoLabel = part.participante === 'INQ' ? 'Inquilino' : part.participante.replace('COA', 'Codeudor ');

    html += '<div style="padding:var(--space-3);background:' + (puedeResponder ? 'var(--color-error-bg)' : 'rgba(15,189,183,0.04)') + ';border-radius:var(--radius-sm);margin-bottom:var(--space-2);">'
      + '<div style="font-size:var(--text-sm);font-weight:var(--font-bold);color:var(--color-primary-navy);margin-bottom:var(--space-2);">'
      + '👤 ' + tipoLabel + ': ' + (part.nombreReal || part.participante) + '</div>';

    // Lo que se pidió
    if (part.requerimientosDetalle && part.requerimientosDetalle.length > 0) {
      html += '<ul style="margin:0 0 var(--space-2);padding-left:var(--space-5);font-size:var(--text-sm);">';
      for (var rd = 0; rd < part.requerimientosDetalle.length; rd++) {
        var req = part.requerimientosDetalle[rd];
        html += '<li style="margin-bottom:var(--space-1);">' + (req.instruccion || req.label) + '</li>';
      }
      html += '</ul>';
    }

    // Respuesta del comercial (si ya respondió) — visible para todos
    if (part.respuestaComercial) {
      html += '<div style="padding:var(--space-2) var(--space-3);background:var(--color-mono-0);border:1px solid var(--color-mono-100);border-radius:var(--radius-xs);font-size:var(--text-sm);margin-top:var(--space-2);">'
        + '<strong style="color:var(--color-mono-500);font-size:var(--text-xs);text-transform:uppercase;">Respuesta del comercial:</strong><br>'
        + part.respuestaComercial;
      if (part.archivosPath) {
        html += '<br><a href="' + part.archivosPath + '" target="_blank" style="color:var(--color-accent-teal);font-size:var(--text-sm);text-decoration:underline;">📎 Ver archivo adjunto →</a>';
      }
      html += '</div>';
    }

    html += '</div>';
  }

  html += '</div>';
  return html;
}

function _traducirRequerimientos(participantes) {
  var traducciones = {
    'celular_correo': 'Confirmar celular o correo',
    'doc_identidad': 'Adjuntar documento de identidad',
    'cert_existencia': 'Adjuntar cert. existencia y representación legal',
    'confirmar_destino': 'Confirmar destino del inmueble',
    'confirmar_direccion': 'Confirmar dirección'
  };
  var html = '';
  for (var p = 0; p < participantes.length; p++) {
    var part = participantes[p];
    var label = part.participante === 'INQ' ? 'Inquilino' : part.participante;
    var reqs = (part.requerimientos || '').split('|').map(function(r) {
      return traducciones[r] || r;
    }).join(', ');
    html += '<div>• <strong>' + label + '</strong>: ' + reqs + '</div>';
  }
  return html;
}

function _abrirCorreccion(error) {
  var modal = document.createElement('div');
  modal.id = 'modalCorreccion';
  modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;';
  modal.addEventListener('click', function(e) { if (e.target === modal) _cerrarModalCorreccion(); });

  var html = '<div style="background:white;border-radius:var(--radius-lg);width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);">'
    + '<div style="padding:20px 24px;background:var(--color-primary-red);border-radius:var(--radius-lg) var(--radius-lg) 0 0;color:white;">'
    + '<div class="flex flex--between"><h3 style="margin:0;color:white;">Corrección requerida</h3>'
    + '<button onclick="_cerrarModalCorreccion()" style="background:rgba(255,255,255,0.2);border:none;width:28px;height:28px;border-radius:50%;color:white;cursor:pointer;">✕</button></div>'
    + '<div style="opacity:0.85;font-size:var(--text-sm);margin-top:4px;">' + error.arrendatario + ' · Lote: ' + error.idLote + '</div>'
    + '</div><div style="padding:24px;">';

  // Por cada participante con error
  for (var p = 0; p < error.participantes.length; p++) {
    var part = error.participantes[p];
    var tipoLabel = part.participante === 'INQ' ? 'Inquilino' : part.participante.replace('COA', 'Codeudor ');

    html += '<div style="margin-bottom:var(--space-5);padding:var(--space-4);border:1px solid var(--color-mono-100);border-radius:var(--radius-sm);">'
      + '<strong style="font-size:var(--text-sm);color:var(--color-primary-navy);">' + tipoLabel + ': ' + (part.nombreReal || part.participante) + '</strong>';

    // Instrucciones claras
    if (part.requerimientosDetalle && part.requerimientosDetalle.length > 0) {
      html += '<div style="margin:var(--space-3) 0;font-size:var(--text-sm);color:var(--color-mono-800);">';
      for (var rd = 0; rd < part.requerimientosDetalle.length; rd++) {
        var req = part.requerimientosDetalle[rd];
        html += '<div style="margin-bottom:var(--space-2);padding:var(--space-2) var(--space-3);background:var(--color-warning-bg);border-radius:var(--radius-xs);">'
          + (req.instruccion || req.label)
          + '</div>';
      }
      html += '</div>';
    }

    html += '<label style="font-size:var(--text-xs);margin-top:var(--space-3);">Tu respuesta:</label>'
      + '<textarea class="input correccion-resp" data-participante="' + part.participante + '" rows="2" placeholder="Escribe aquí la información solicitada..." style="resize:vertical;"></textarea>'
      + '<label style="font-size:var(--text-xs);margin-top:var(--space-3);">Adjuntar archivo (PDF o imagen, opcional):</label>'
      + '<div class="correccion-dropzone" data-participante="' + part.participante + '" onclick="this.querySelector(\'input\').click()" style="cursor:pointer;border:2px dashed var(--color-mono-300);border-radius:var(--radius-sm);padding:var(--space-3) var(--space-4);display:flex;align-items:center;gap:var(--space-3);transition:border-color var(--duration-fast),background var(--duration-fast);">'
      + '<span style="font-size:1.2rem;">📎</span>'
      + '<span class="correccion-dropzone-label" style="font-size:var(--text-sm);color:var(--color-mono-500);">Haz clic para seleccionar archivo</span>'
      + '<input type="file" class="correccion-file" data-participante="' + part.participante + '" accept=".pdf,.jpg,.jpeg,.png" style="display:none;" onchange="_archivoCorreccionCargado(this)">'
      + '</div>'
      + '</div>';
  }

  html += '</div>'
    + '<div style="padding:16px 24px;border-top:1px solid rgba(0,0,0,0.06);display:flex;gap:12px;justify-content:flex-end;">'
    + '<button class="btn btn--ghost" onclick="_cerrarModalCorreccion()">Cancelar</button>'
    + '<button class="btn btn--primary" onclick="_enviarCorreccion(\'' + error.uuid + '\')">Enviar corrección</button>'
    + '</div></div>';

  modal.innerHTML = html;
  document.body.appendChild(modal);
}

function _enviarCorreccion(uuid) {
  var textareas = document.querySelectorAll('.correccion-resp');
  var files = document.querySelectorAll('.correccion-file');
  var respuestas = [];
  var archivosPromises = [];

  for (var i = 0; i < textareas.length; i++) {
    var resp = textareas[i].value.trim();
    var file = files[i] ? files[i].files[0] : null;
    if (!resp && !file) { _toast('Completa la respuesta o adjunta un archivo para cada participante.', 'warning'); return; }
    respuestas.push({
      participante: textareas[i].getAttribute('data-participante'),
      respuesta: resp || '(Adjuntó archivo)'
    });
    archivosPromises.push(file ? _archivoABase64(file) : Promise.resolve(null));
  }

  // Feedback
  var btnEnv = document.querySelector('#modalCorreccion .btn--primary');
  if (btnEnv) { btnEnv.disabled = true; btnEnv.textContent = '⏳ Enviando...'; }

  // Convertir archivos a base64 y enviar todo junto
  Promise.all(archivosPromises).then(function(archivos) {
    // Adjuntar info de archivos a respuestas
    for (var a = 0; a < archivos.length; a++) {
      respuestas[a].archivo = archivos[a]; // null o {bytes, nombre, tipo}
    }
    return callServer('api_enviarCorreccion', uuid, respuestas);
  }).then(function(res) {
    _cerrarModalCorreccion();
    if (res && res.ok) {
      _toast('Corrección enviada. El equipo la revisará.', 'success');
      cargarVistaErroresComercial();
    } else {
      _toast(res ? res.mensaje : 'Error al enviar.', 'error');
    }
  }).catch(function(err) {
    if (btnEnv) { btnEnv.disabled = false; btnEnv.textContent = 'Enviar corrección'; }
    _toast('Error: ' + (err.message || err), 'error');
  });
}

function _cerrarModalCorreccion() {
  var modal = document.getElementById('modalCorreccion');
  if (modal) modal.remove();
}

function _archivoCorreccionCargado(input) {
  var dropzone = input.closest('.correccion-dropzone');
  var label = dropzone.querySelector('.correccion-dropzone-label');
  if (input.files[0] && dropzone && label) {
    dropzone.style.borderColor = 'var(--color-success)';
    dropzone.style.borderStyle = 'solid';
    dropzone.style.background = 'var(--color-success-bg)';
    label.textContent = input.files[0].name + ' ✓';
    label.style.color = 'var(--color-success)';
  }
}

// ============================================================
//  VISTA: SOLICITUDES (registro analisis)
// ============================================================

var _solicitudesCache = null;
var _solicitudesFiltroEstado = '';
var _solicitudesBusqueda = '';
var _solicitudesPage = 1;
var _solicitudesTotal = 0;

function cargarVistaSolicitudes() {
  if (_solicitudesCache) {
    _renderizarSolicitudesFiltradas();
    return;
  }

  // Reset sort al cargar por primera vez
  _solicitudesSort = { campo: '', dir: '' };

  // Mostrar skeleton mientras carga
  var container = document.getElementById('viewDashboard');
  container.innerHTML = '<div class="stack">'
    + '<div class="flex flex--between"><h2>Solicitudes</h2><small style="color:var(--color-mono-500);">Cargando las más recientes...</small></div>'
    + '<div class="card card--flat" style="padding:0; overflow:hidden;">'
    + '<table class="table"><thead><tr><th>Arrendatario</th><th>Solicitud</th><th>Lote</th><th>Canon</th><th>Asignada a</th><th>Resultado análisis</th><th>Estado</th></tr></thead>'
    + '<tbody>'
    + _skeletonFilas(8)
    + '</tbody></table></div></div>';
  mostrarVista('viewDashboard');

  callServer('api_obtenerSolicitudes', 0, 500)
    .then(function(res) {
      if (_seccionActiva !== 'solicitudes') return;
      _solicitudesCache = res.datos || [];
      _solicitudesTotal = res.total || 0;
      _renderizarSolicitudesFiltradas();
    })
    .catch(function(err) { if (_seccionActiva !== 'solicitudes') return; console.error(err); _mostrarError('No pudimos cargar las solicitudes.'); });
}

function _skeletonFilas(n) {
  var html = '';
  for (var i = 0; i < n; i++) {
    html += '<tr><td colspan="7" style="padding:0;"><div class="skeleton-row"></div></td></tr>';
  }
  return html;
}

function _cargarMasSolicitudes() {
  var cargadas = _solicitudesCache ? _solicitudesCache.length : 0;
  callServer('api_obtenerSolicitudes', cargadas, 300)
    .then(function(res) {
      if (res.datos && res.datos.length > 0) {
        _solicitudesCache = _solicitudesCache.concat(res.datos);
      }
      _renderizarSolicitudesFiltradas();
    })
    .catch(function(err) { console.error(err); });
}

function _renderizarSolicitudesFiltradas() {
  var filtradas = _solicitudesCache || [];

  if (_solicitudesFiltroEstado) {
    filtradas = filtradas.filter(function(s) { return s.estado === _solicitudesFiltroEstado; });
  }
  if (_solicitudesBusqueda) {
    var busq = _solicitudesBusqueda.toUpperCase();
    filtradas = filtradas.filter(function(s) {
      return s.arrendatario.toUpperCase().indexOf(busq) !== -1
        || s.codigoLote.toUpperCase().indexOf(busq) !== -1
        || s.identificacion.indexOf(busq) !== -1
        || (s.solicitudInquilino && s.solicitudInquilino.toUpperCase().indexOf(busq) !== -1);
    });
  }

  // Sort solo si el usuario lo activó
  if (_solicitudesSort.campo) {
    filtradas = filtradas.slice();
    _sortArray(filtradas, _solicitudesSort.campo, _solicitudesSort.dir);
  }

  var porPagina = 15;
  var total = filtradas.length;
  var totalPaginas = Math.ceil(total / porPagina);
  if (_solicitudesPage > totalPaginas) _solicitudesPage = 1;
  var inicio = (_solicitudesPage - 1) * porPagina;
  var paginadas = filtradas.slice(inicio, inicio + porPagina);

  var container = document.getElementById('viewDashboard');

  // Header con filtros
  var cargadasInfo = _solicitudesCache ? _solicitudesCache.length : 0;
  var html = '<div class="stack">'
    + '<div class="flex flex--between"><h2>Solicitudes</h2><small>' + cargadasInfo + ' de ' + _solicitudesTotal + ' solicitud(es)</small></div>'
    + '<div class="flex flex--gap-md" style="align-items:center; flex-wrap:wrap;">'
    + '<input class="input" style="flex:1; min-width:200px; padding:10px 14px; font-size:var(--text-sm);" placeholder="Buscar por arrendatario, lote, ID o solicitud..." value="' + (_solicitudesBusqueda || '') + '" onkeydown="if(event.key===\'Enter\'){_solicitudesBusqueda=this.value;_solicitudesPage=1;_renderizarSolicitudesFiltradas();}">'
    + '<select class="input" style="width:auto; min-width:160px; padding:10px 14px; font-size:var(--text-sm);" onchange="_solicitudesFiltroEstado=this.value;_solicitudesPage=1;_renderizarSolicitudesFiltradas();">'
    + '<option value="">Todos los estados</option>'
    + '<option value="PENDIENTE"' + (_solicitudesFiltroEstado === 'PENDIENTE' ? ' selected' : '') + '>Pendiente</option>'
    + '<option value="EN EVALUACIÓN"' + (_solicitudesFiltroEstado === 'EN EVALUACIÓN' ? ' selected' : '') + '>En evaluación</option>'
    + '<option value="EVALUADA"' + (_solicitudesFiltroEstado === 'EVALUADA' ? ' selected' : '') + '>Evaluada</option>'
    + '</select>';

  if (_solicitudesFiltroEstado || _solicitudesBusqueda) {
    html += '<button class="btn btn--ghost" style="font-size:var(--text-sm);" onclick="_solicitudesFiltroEstado=\'\';_solicitudesBusqueda=\'\';_solicitudesPage=1;_renderizarSolicitudesFiltradas();">✕ Limpiar</button>';
  }
  html += '</div>';

  if (paginadas.length === 0) {
    html += '<div class="card card--flat" style="text-align:center; padding:var(--spacing-2xl);"><h3>No hay solicitudes para mostrar</h3></div>';
  } else {
    html += '<div class="card card--flat" style="padding:0; overflow:hidden;"><table class="table">'
      + '<thead><tr>' + _thSort('arrendatario','Arrendatario','solicitudes') + _thSort('solicitudInquilino','Solicitud','solicitudes') + _thSort('codigoLote','Lote','solicitudes') + _thSort('canon','Canon','solicitudes') + _thSort('asignadaA','Asignada a','solicitudes') + _thSort('resultadoSolicitud','Resultado análisis','solicitudes') + _thSort('estado','Estado','solicitudes') + '</tr></thead><tbody>';

    for (var i = 0; i < paginadas.length; i++) {
      var s = paginadas[i];
      var estadoBadge = s.estado === 'EVALUADA' ? 'badge--success' : s.estado === 'EN EVALUACIÓN' ? 'badge--navy' : 'badge--gray';
      html += '<tr style="cursor:pointer;" onclick="_verDetalleSolicitud(' + s.fila + ')">'
        + '<td><strong>' + s.arrendatario + '</strong><br><small style="color:var(--color-mono-500);">' + s.identificacion + '</small></td>'
        + '<td style="font-size:var(--text-sm); font-family:var(--font-mono);">' + (s.solicitudInquilino || '-') + '</td>'
        + '<td style="font-size:var(--text-sm); font-family:var(--font-mono);">' + s.codigoLote + '</td>'
        + '<td style="font-size:var(--text-sm);">$' + _fmtNum(s.canon) + '</td>'
        + '<td style="font-size:var(--text-sm); color:var(--color-mono-500);">' + (s.asignadaA ? s.asignadaA.split('@')[0] : '-') + '</td>'
        + '<td style="font-size:var(--text-sm);">' + (s.resultadoSolicitud || '-') + '</td>'
        + '<td><span class="badge ' + estadoBadge + '">' + s.estado + '</span></td>'
        + '</tr>';
    }
    html += '</tbody></table></div>';
  }

  // Paginación
  if (totalPaginas > 1) {
    html += '<div class="flex flex--center flex--gap-md">'
      + '<button class="btn btn--ghost" ' + (_solicitudesPage <= 1 ? 'disabled' : '') + ' onclick="_solicitudesPage--;_renderizarSolicitudesFiltradas();">← Anterior</button>'
      + '<span style="font-size:var(--text-sm); color:var(--color-mono-500);">Página ' + _solicitudesPage + ' de ' + totalPaginas + '</span>'
      + '<button class="btn btn--ghost" ' + (_solicitudesPage >= totalPaginas ? 'disabled' : '') + ' onclick="_solicitudesPage++;_renderizarSolicitudesFiltradas();">Siguiente →</button></div>';
  }

  // Botón cargar más si no se han cargado todas
  if (_solicitudesCache && _solicitudesCache.length < _solicitudesTotal) {
    html += '<div style="text-align:center;"><button class="btn btn--secondary" onclick="_cargarMasSolicitudes()">Cargar 300 más (' + (_solicitudesTotal - _solicitudesCache.length) + ' restantes)</button></div>';
  }

  html += '</div>';
  container.innerHTML = html;
  mostrarVista('viewDashboard');
}

function _verDetalleSolicitud(filaNum) {
  // Mostrar modal con spinner mientras carga
  var modal = document.createElement('div');
  modal.id = 'modalSolicitud';
  modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;';
  modal.innerHTML = '<div style="background:white;border-radius:var(--radius-lg);padding:40px;text-align:center;"><div class="spinner" style="margin:0 auto;"></div><p style="margin-top:12px;color:var(--color-mono-500);">Cargando detalle...</p></div>';
  modal.addEventListener('click', function(e) { if (e.target === modal) _cerrarModalSolicitud(); });
  document.body.appendChild(modal);

  callServer('api_obtenerDetalleSolicitud', filaNum)

      if (!data) { _cerrarModalSolicitud(); _toast('No se pudo cargar el detalle.', 'error'); return; }
      _renderizarModalSolicitud(data);
    })
    .catch(function(err) { _cerrarModalSolicitud(); console.error(err); });
}

  else if (res === 'NEGADO') resultBadge = '<span class="badge badge--red" style="font-size:13px; padding:6px 14px;">NEGADO</span>';
  else if (res) resultBadge = '<span class="badge badge--gray" style="font-size:13px; padding:6px 14px;">' + res + '</span>';

  var html = '<div style="background:white;border-radius:var(--radius-lg);width:100%;max-width:720px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);">'
    // Header con gradiente
    + '<div style="padding:24px;background:var(--color-primary-navy);border-radius:var(--radius-lg) var(--radius-lg) 0 0;color:white;position:sticky;top:0;z-index:1;">'
    + '<div class="flex flex--between" style="margin-bottom:8px;"><h3 style="margin:0;color:white;font-size:var(--text-lg);">' + d.inquilino.nombre + '</h3>'

    + '<div style="opacity:0.75;font-size:var(--text-sm);">' + d.inquilino.tipoDoc + ' ' + d.inquilino.identificacion + ' · Solicitud: ' + d.inquilino.solicitud + '</div>'
    + (resultBadge ? '<div style="margin-top:12px;">' + resultBadge + '</div>' : '')
    + '</div>'
    + '<div style="padding:24px;">';

  // Sección: Inmueble (colapsada por defecto, más compacta)
  html += '<details style="margin-bottom:20px;">'
    + '<summary style="cursor:pointer;font-weight:600;color:var(--color-primary-navy);font-size:var(--text-sm);padding:8px 0;">📍 Datos del inmueble</summary>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px 0;">'
    + _chipModal('Ciudad', d.inmueble.ciudad) + _chipModal('Dirección', d.inmueble.direccion) + _chipModal('Destino', d.inmueble.destino)
    + _chipModal('Canon', '$' + _fmtNum(d.inmueble.canon)) + _chipModal('Póliza', d.inmueble.poliza) + _chipModal('Inmobiliaria', d.inmueble.inmobiliaria)
    + '</div></details>';

  // Sección: Evaluación Inquilino
  html += _seccionEvaluacion('👤 Evaluación — ' + d.inquilino.nombre, d.inquilino);

  // Sección: Codeudores
  for (var c = 0; c < d.codeudores.length; c++) {
    var coa = d.codeudores[c];
    html += _seccionEvaluacion('👥 Codeudor ' + coa.numero + ' — ' + coa.nombre, coa);
  }

  // Sección: Resultado final
  html += '<div style="margin-top:20px;padding:16px;background:rgba(37,49,80,0.03);border-radius:var(--radius-md);border:1px solid rgba(37,49,80,0.08);">'
    + '<h4 style="margin:0 0 12px;font-size:var(--text-sm);color:var(--color-primary-navy);">📊 Resultado de la solicitud</h4>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">'
    + _chipModal('Política ingresos', d.resultado.politicaIngresos)
    + _chipModal('Resultado solicitud', d.resultado.resultadoSolicitud, true)
    + _chipModal('Resultado lote', d.resultado.resultadoLote, true)
    + _chipModal('COAs aprobados', d.resultado.numCoaAprob)
    + _chipModal('COAs negados', d.resultado.numCoaNeg)
    + _chipModal('COAs evaluados', d.resultado.coaEvaluados)
    + '</div>';

  if (d.resultado.detalleResultado) {
    html += '<div style="margin-top:12px;padding:10px 12px;background:white;border-radius:var(--radius-sm);font-size:var(--text-sm);">'
      + '<strong style="color:var(--color-mono-500);font-size:11px;text-transform:uppercase;">Detalle</strong><br>'
      + d.resultado.detalleResultado + '</div>';
  }
  if (d.resultado.comentarios) {
    html += '<div style="margin-top:8px;padding:10px 12px;background:white;border-radius:var(--radius-sm);font-size:var(--text-sm);">'
      + '<strong style="color:var(--color-mono-500);font-size:11px;text-transform:uppercase;">Comentarios del analista</strong><br>'
      + d.resultado.comentarios + '</div>';
  }

  // Footer con asignación y registro SAI
  html += '<div style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(0,0,0,0.06);display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:var(--text-sm);color:var(--color-mono-500);">'
    + '<div>Asignada a: <strong style="color:var(--color-mono-900);">' + (d.asignacion.asignadaA || 'Sin asignar') + '</strong></div>'
    + '<div>Registro SAI: <strong style="color:var(--color-mono-900);">' + (d.resultado.registroSAI || 'Pendiente') + '</strong></div>'
    + '<div>Fecha evaluación: <strong style="color:var(--color-mono-900);">' + (d.resultado.fechaEvaluacion || 'Pendiente') + '</strong></div>'
    + '</div></div>';

  html += '</div></div>';
  modal.innerHTML = html;
}

function _seccionEvaluacion(titulo, persona) {
  var resFinal = (persona.resultadoFinal || '').toUpperCase();
  var resBadge = resFinal === 'APROBADO' ? '<span class="badge badge--success" style="margin-left:8px;">' + resFinal + '</span>'
    : resFinal === 'NEGADO' ? '<span class="badge badge--red" style="margin-left:8px;">' + resFinal + '</span>'
    : resFinal ? '<span class="badge badge--gray" style="margin-left:8px;">' + resFinal + '</span>' : '';

  return '<div style="margin-bottom:16px;padding:16px;border:1px solid rgba(0,0,0,0.06);border-radius:var(--radius-md);">'
    + '<div class="flex" style="align-items:center;margin-bottom:10px;"><h4 style="margin:0;font-size:var(--text-sm);color:var(--color-primary-navy);">' + titulo + '</h4>' + resBadge + '</div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">'
    + _chipModal('Ingresos', persona.ingresos ? '$' + _fmtNum(persona.ingresos) : '-')
    + _chipModal('Acierta', persona.acierta)
    + _chipModal('Ocupación', persona.ocupacion)
    + _chipModal('Resp. modelo', persona.respuestaModelo)
    + _chipModal('Regla Dura', persona.reglaDura)
    + '</div></div>';
}

function _chipModal(label, valor, destacar) {
  var valStyle = destacar && valor ? 'font-weight:700;color:var(--color-primary-navy);' : 'color:var(--color-mono-800);';
  return '<div style="font-size:var(--text-sm);">'
    + '<div style="font-size:10px;text-transform:uppercase;letter-spacing:0.3px;color:var(--color-mono-500);margin-bottom:2px;">' + label + '</div>'
    + '<div style="' + valStyle + '">' + (valor || '-') + '</div></div>';
}

function _cerrarModalSolicitud() {
  var modal = document.getElementById('modalSolicitud');
  if (modal) modal.remove();
}

//  VISTA: USUARIOS (CRUD)

var _usuariosCache = null;

function cargarVistaUsuarios() {
  if (_usuariosCache) {
    _renderizarUsuarios(_usuariosCache);
    return;
  }
  callServer('api_obtenerUsuarios')
    .then(function(datos) {
      _usuariosCache = datos || [];
      _renderizarUsuarios(_usuariosCache);
    })
    .catch(function(err) { console.error(err); _mostrarError('No pudimos cargar los usuarios.'); });
}

function _renderizarUsuarios(usuarios) {
  var container = document.getElementById('viewDashboard');

  // Agrupar por rol
  var grupos = { LIDER: [], ADMIN: [], AUXILIAR: [], ANALISTA: [], COMERCIAL: [] };
  for (var i = 0; i < usuarios.length; i++) {
    var rol = usuarios[i].rol || 'COMERCIAL';
    if (!grupos[rol]) grupos[rol] = [];
    grupos[rol].push(usuarios[i]);
  }

  var ordenRoles = [
    { key: 'ADMIN', label: 'Administradores', badge: 'badge--red' },
    { key: 'LIDER', label: 'Líderes', badge: 'badge--navy' },
    { key: 'AUXILIAR', label: 'Auxiliares de Análisis', badge: 'badge--orange' },
    { key: 'ANALISTA', label: 'Analistas', badge: 'badge--teal' },
    { key: 'COMERCIAL', label: 'Comerciales', badge: 'badge--gray' }
  ];

  var html = '<div class="stack">'
    + '<div class="flex flex--between"><h2>Usuarios</h2>'
    + '<button class="btn btn--primary" onclick="_mostrarFormUsuario(null)">+ Nuevo usuario</button></div>';

  for (var r = 0; r < ordenRoles.length; r++) {
    var grupo = ordenRoles[r];
    var lista = grupos[grupo.key] || [];
    if (lista.length === 0) continue;

    html += '<div class="card card--flat" style="padding:0; overflow:hidden;">'
      + '<div style="padding:12px 16px; background:rgba(37,49,80,0.03); border-bottom:1px solid rgba(0,0,0,0.06);">'
      + '<div class="flex flex--between" style="align-items:center;">'
      + '<div class="flex flex--gap-sm" style="align-items:center;">'
      + '<span class="badge ' + grupo.badge + '">' + grupo.key + '</span>'
      + '<strong style="font-size:var(--text-sm);">' + grupo.label + '</strong>'
      + '</div>'
      + '<small style="color:var(--color-mono-500);">' + lista.length + ' usuario(s)</small>'
      + '</div></div>'
      + '<table class="table"><tbody>';

    for (var j = 0; j < lista.length; j++) {
      var u = lista[j];
      var extraInfo = '';
      if (u.rol === 'ANALISTA') extraInfo = 'Cupo: ' + u.cupo;
      else if (u.rol === 'COMERCIAL' && u.director) extraInfo = 'Dir: ' + u.director.split('@')[0];

      html += '<tr>'
        + '<td style="width:200px;"><strong>' + u.nombre + '</strong></td>'
        + '<td style="font-size:var(--text-sm); color:var(--color-mono-500);">' + u.email + '</td>'
        + '<td style="font-size:var(--text-sm); color:var(--color-mono-500);">' + extraInfo + '</td>'
        + '<td style="width:50px; text-align:center;">' + (u.activo ? '<span style="color:#0d7a54;">✓</span>' : '<span style="color:#bd0f14;">✗</span>') + '</td>'
        + '<td style="width:60px;"><button class="btn btn--ghost" style="padding:4px 8px; font-size:var(--text-sm);" onclick=\'_mostrarFormUsuario(' + JSON.stringify(u).replace(/'/g, "\\'") + ')\'>Editar</button></td>'
        + '</tr>';
    }

    html += '</tbody></table></div>';
  }

  html += '</div>';
  container.innerHTML = html;
  mostrarVista('viewDashboard');
}

function _mostrarFormUsuario(usuario) {
  var esNuevo = !usuario;
  var u = usuario || { email: '', nombre: '', rol: 'COMERCIAL', cupo: 0, director: '', backup: '', backupActivo: false, activo: true };

  // Crear modal overlay
  var modal = document.createElement('div');
  modal.id = 'modalUsuario';
  modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;';

  modal.innerHTML = '<div style="background:white;border-radius:var(--radius-lg);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);">'
    + '<div style="padding:20px 24px;border-bottom:1px solid rgba(0,0,0,0.06);">'
    + '<div class="flex flex--between"><h3 style="margin:0;">' + (esNuevo ? 'Nuevo usuario' : 'Editar: ' + u.nombre) + '</h3>'
    + '<button onclick="_cerrarModal()" style="background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--color-mono-500);">✕</button></div></div>'
    + '<div style="padding:24px;">'
    + '<div class="stack" style="gap:16px;">'
    + '<div><label>Email *</label><input class="input" id="uf_email" value="' + u.email + '" ' + (esNuevo ? '' : 'readonly style="opacity:0.6;"') + '></div>'
    + '<div><label>Nombre *</label><input class="input" id="uf_nombre" value="' + u.nombre + '"></div>'
    + '<div><label>Rol *</label><select class="input" id="uf_rol" onchange="_toggleCamposRol()">'
    + '<option value="COMERCIAL"' + (u.rol === 'COMERCIAL' ? ' selected' : '') + '>Comercial</option>'
    + '<option value="AUXILIAR"' + (u.rol === 'AUXILIAR' ? ' selected' : '') + '>Auxiliar</option>'
    + '<option value="ANALISTA"' + (u.rol === 'ANALISTA' ? ' selected' : '') + '>Analista</option>'
    + '<option value="LIDER"' + (u.rol === 'LIDER' ? ' selected' : '') + '>Líder</option>'
    + '<option value="ADMIN"' + (u.rol === 'ADMIN' ? ' selected' : '') + '>Admin</option>'
    + '</select></div>'
    + '<div id="uf_cupoWrap" style="' + (u.rol === 'ANALISTA' ? '' : 'display:none;') + '"><label>Cupo de solicitudes</label><input class="input" id="uf_cupo" type="number" value="' + u.cupo + '"></div>'
    + '<div id="uf_dirWrap" style="' + (u.rol === 'COMERCIAL' ? '' : 'display:none;') + '"><label>Director</label><input class="input" id="uf_director" value="' + u.director + '"></div>'
    + '<div id="uf_backWrap" style="' + (u.rol === 'COMERCIAL' ? '' : 'display:none;') + '"><label>Backup</label><input class="input" id="uf_backup" value="' + u.backup + '"><label style="margin-top:8px;text-transform:none;font-size:var(--text-sm);"><input type="checkbox" id="uf_backupActivo" ' + (u.backupActivo ? 'checked' : '') + '> Backup activo</label></div>'
    + '<div><label style="text-transform:none;font-size:var(--text-sm);"><input type="checkbox" id="uf_activo" ' + (u.activo ? 'checked' : '') + '> Usuario activo</label></div>'
    + '</div></div>'
    + '<div style="padding:16px 24px;border-top:1px solid rgba(0,0,0,0.06);display:flex;gap:12px;justify-content:flex-end;">'
    + '<button class="btn btn--ghost" onclick="_cerrarModal()">Cancelar</button>'
    + '<button class="btn btn--primary" onclick="_guardarUsuario(' + esNuevo + ')">Guardar</button>'
    + '</div></div>';

  document.body.appendChild(modal);

  // Cerrar con Escape
  modal.addEventListener('keydown', function(e) { if (e.key === 'Escape') _cerrarModal(); });
  // Cerrar al hacer clic fuera
  modal.addEventListener('click', function(e) { if (e.target === modal) _cerrarModal(); });
}

function _cerrarModal() {
  var modal = document.getElementById('modalUsuario');
  if (modal) modal.remove();
}

function _toggleCamposRol() {
  var rol = document.getElementById('uf_rol').value;
  document.getElementById('uf_cupoWrap').style.display = rol === 'ANALISTA' ? '' : 'none';
  document.getElementById('uf_dirWrap').style.display = rol === 'COMERCIAL' ? '' : 'none';
  document.getElementById('uf_backWrap').style.display = rol === 'COMERCIAL' ? '' : 'none';
}

function _guardarUsuario(esNuevo) {
  var datos = {
    email: document.getElementById('uf_email').value,
    nombre: document.getElementById('uf_nombre').value,
    rol: document.getElementById('uf_rol').value,
    cupo: document.getElementById('uf_cupo').value,
    director: document.getElementById('uf_director').value,
    backup: document.getElementById('uf_backup').value,
    backupActivo: document.getElementById('uf_backupActivo').checked,
    activo: document.getElementById('uf_activo').checked
  };

  if (!datos.email || !datos.nombre) {
    _toast('Email y nombre son obligatorios.', 'warning');
    return;
  }

  callServer('api_guardarUsuario', datos, esNuevo)
    .then(function(res) {
      if (res && res.ok) {
        _cerrarModal();
        _usuariosCache = null;
        cargarVistaUsuarios();
      } else {
        _toast(res ? res.mensaje : 'Error desconocido.', 'error');
      }
    })
    .catch(function(err) { _toast('Error: ' + err.message, 'error'); });
}

function _verDetalleLote(idLote) {
  mostrarVista('viewLoading');
  callServer('api_obtenerDetalleLote', idLote)
    .then(function(data) {
      if (!data || !data.lote) {
        _mostrarError('No se encontró el lote "' + idLote + '".');
        return;
      }
      _renderizarDetalleLote(data);
    })
    .catch(function(err) { console.error(err); _mostrarError('Error al cargar detalle del lote.'); });
}

function _renderizarDetalleLote(data) {
  var l = data.lote;
  var container = document.getElementById('viewDashboard');

  var html = '<div class="stack">'
    + '<div><button class="btn btn--ghost" onclick="cargarMisLotes(_lotesPageActual)">← Volver a lotes</button></div>'

    + '<div class="card card--flat" style="border-left:4px solid var(--color-primary-navy);">'
    + '<div class="flex flex--between" style="flex-wrap:wrap; gap:var(--spacing-sm);">'
    + '<div>'
    + '<h2 style="margin-bottom:4px; font-size:var(--text-lg);">' + l.idLote + '</h2>'
    + '<p style="margin:0; font-size:var(--text-sm); color:var(--color-mono-500);">Comercial: <strong>' + l.comercial + '</strong> · Póliza: <strong>' + l.poliza + '</strong> · Fecha: ' + l.fecha + '</p>'
    + '</div>'
    + '<div class="flex flex--gap-sm">'
    + '<span class="badge badge--navy">' + data.solicitudes.length + ' solicitud(es)</span>'
    + '</div></div></div>'
    // Tabla de solicitudes
    + '<div class="card card--flat" style="padding:0; overflow:hidden;">'
    + '<table class="table">'
    + '<thead><tr><th>#</th><th>Arrendatario</th><th>Identificación</th><th>Dirección</th><th>Canon</th><th>Estado</th></tr></thead>'
    + '<tbody>';

  for (var i = 0; i < data.solicitudes.length; i++) {
    var s = data.solicitudes[i];
    html += '<tr>'
      + '<td style="text-align:center; color:var(--color-mono-500);">' + (i + 1) + '</td>'
      + '<td><strong>' + s.arrendatario + '</strong><br><small style="color:var(--color-mono-500);">' + s.destino + '</small></td>'
      + '<td style="font-size:var(--text-sm);">' + s.tipoDoc + ' ' + s.identificacion + '</td>'
      + '<td style="font-size:var(--text-sm);">' + s.ciudad + '<br><small>' + s.direccion + '</small></td>'
      + '<td style="font-size:var(--text-sm);">$' + _fmtNum(s.canon) + '</td>'
      + '<td>' + _badgeEstado(s.estado) + '</td>'
      + '</tr>';
  }

  html += '</tbody></table></div></div>';
  container.innerHTML = html;
  mostrarVista('viewDashboard');
}

function cargarVistaConfiguracion() {
  var container = document.getElementById('viewDashboard');
  container.innerHTML = '<div class="stack"><h2>Configuración</h2><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div></div>';
  mostrarVista('viewDashboard');

  callServer('api_obtenerCatalogoMotivos')
    .then(function(motivos) { _renderizarConfigMotivos(motivos || []); })
    .catch(function(err) { _toast('Error al cargar configuración.', 'error'); });
}

function _renderizarConfigMotivos(motivos) {
  var container = document.getElementById('viewDashboard');
  var html = '<div class="stack stack--loose">'
    + '<div class="section-header"><h2>Configuración</h2></div>'
    + '<div class="card">'
    + '<div class="flex flex--between" style="margin-bottom:var(--space-5);">'
    + '<div><h3 style="margin-bottom:var(--space-1);">Catálogo de motivos — Error en terceros</h3>'
    + '<p style="font-size:var(--text-sm);color:var(--color-mono-500);margin:0;">Define las instrucciones de solución para cada motivo. Se muestran al comercial cuando debe corregir un caso.</p></div>'
    + '<button class="btn btn--primary" onclick="_modalMotivo(null)">+ Nuevo motivo</button>'
    + '</div>'
    + '<div class="stack stack--tight">';

  for (var i = 0; i < motivos.length; i++) {
    var m = motivos[i];
    html += '<div style="padding:var(--space-4);border:1px solid var(--color-mono-100);border-radius:var(--radius-sm);transition:background var(--duration-fast);" onmouseover="this.style.background=\'rgba(37,49,80,0.02)\'" onmouseout="this.style.background=\'\'">'
      + '<div class="flex flex--between" style="margin-bottom:var(--space-2);align-items:flex-start;">'
      + '<div><strong style="font-size:var(--text-sm);color:var(--color-primary-navy);">' + m.label + '</strong>'
      + '<br><span class="badge badge--gray" style="margin-top:var(--space-1);">' + m.id + '</span></div>'
      + '<div class="flex flex--gap-sm">'
      + '<button class="btn btn--ghost" style="font-size:var(--text-xs);padding:var(--space-1) var(--space-2);" onclick=\'_modalMotivo(' + JSON.stringify(m).replace(/'/g, "\\'") + ')\'>Editar</button>'
      + '<button class="btn btn--ghost" style="font-size:var(--text-xs);padding:var(--space-1) var(--space-2);color:var(--color-primary-red);" onclick="_eliminarMotivo(\'' + m.id + '\')">Eliminar</button>'
      + '</div></div>'
      + '<p style="font-size:var(--text-sm);color:var(--color-mono-800);margin:0;line-height:var(--leading-relaxed);">' + m.instruccion + '</p>'
      + '</div>';
  }

  if (motivos.length === 0) {
    html += '<div style="text-align:center;padding:var(--space-8);color:var(--color-mono-500);">No hay motivos configurados. Agrega el primero.</div>';
  }

  html += '</div></div></div>';
  container.innerHTML = html;
  mostrarVista('viewDashboard');
}

function _modalMotivo(motivo) {
  var esNuevo = !motivo;
  var m = motivo || { id: '', label: '', instruccion: '', activo: true };

  var modal = document.createElement('div');
  modal.id = 'modalMotivo';
  modal.className = 'modal-overlay';
  modal.addEventListener('click', function(e) { if (e.target === modal) modal.remove(); });

  modal.innerHTML = '<div class="modal-content" style="max-width:520px;">'
    + '<div class="modal-header modal-header--navy"><div class="flex flex--between" style="align-items:center;">'
    + '<h3 style="margin:0;color:var(--color-mono-0);">' + (esNuevo ? 'Nuevo motivo' : 'Editar motivo') + '</h3>'
    + '<button class="modal-close" onclick="document.getElementById(\'modalMotivo\').remove()">✕</button>'
    + '</div></div>'
    + '<div class="modal-body"><div class="stack stack--tight">'
    + '<div><label>ID (clave única, sin espacios) *</label><input class="input" id="mot_id" value="' + m.id + '" ' + (esNuevo ? '' : 'readonly style="opacity:0.6;"') + ' placeholder="ej: doc_identidad"></div>'
    + '<div><label>Nombre del motivo *</label><input class="input" id="mot_label" value="' + m.label + '" placeholder="ej: Adjuntar documento de identidad"></div>'
    + '<div><label>Instrucción para el comercial *</label><textarea class="input" id="mot_instruccion" rows="4" style="resize:vertical;" placeholder="Explica qué debe hacer el comercial para resolver este motivo...">' + m.instruccion + '</textarea></div>'
    + '</div></div>'
    + '<div class="modal-footer">'
    + '<button class="btn btn--ghost" onclick="document.getElementById(\'modalMotivo\').remove()">Cancelar</button>'
    + '<button class="btn btn--primary" onclick="_guardarMotivo(' + esNuevo + ')">Guardar</button>'
    + '</div></div>';

  document.body.appendChild(modal);
}

function _guardarMotivo(esNuevo) {
  var motivo = {
    id: document.getElementById('mot_id').value.trim(),
    label: document.getElementById('mot_label').value.trim(),
    instruccion: document.getElementById('mot_instruccion').value.trim(),
    activo: true
  };

  if (!motivo.id || !motivo.label || !motivo.instruccion) {
    _toast('Todos los campos son obligatorios.', 'warning');
    return;
  }

  callServer('api_guardarMotivo', motivo, esNuevo)
    .then(function(res) {
      if (res && res.ok) {
        var modal = document.getElementById('modalMotivo');
        if (modal) modal.remove();
        _toast(res.mensaje, 'success');
        cargarVistaConfiguracion();
      } else {
        _toast(res ? res.mensaje : 'Error al guardar.', 'error');
      }
    })
    .catch(function(err) { _toast('Error: ' + (err.message || err), 'error'); });
}

function _eliminarMotivo(id) {
  if (!confirm('¿Eliminar este motivo? No se podrá deshacer.')) return;
  callServer('api_eliminarMotivo', id)
    .then(function(res) {
      if (res && res.ok) {
        _toast('Motivo eliminado.', 'success');
        cargarVistaConfiguracion();
      } else {
        _toast(res ? res.mensaje : 'Error al eliminar.', 'error');
      }

function _archivoABase64(file) {
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = function() { resolve({ bytes: reader.result, nombre: file.name, tipo: file.type }); };
    reader.onerror = function(e) { reject(e); };
  });
}
