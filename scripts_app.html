function _verDetalleSolicitud(filaNum) {
  // Mostrar modal con spinner mientras carga
  var modal = document.createElement('div');
  modal.id = 'modalSolicitud';
  modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;';
  modal.innerHTML = '<div style="background:white;border-radius:var(--radius-lg);padding:40px;text-align:center;"><div class="spinner" style="margin:0 auto;"></div><p style="margin-top:12px;color:var(--color-mono-500);">Cargando detalle...</p></div>';
  modal.addEventListener('click', function(e) { if (e.target === modal) _cerrarModalSolicitud(); });
  document.body.appendChild(modal);

  callServer('api_obtenerDetalleSolicitud', filaNum)
    .then(function(data) {
      if (!data) { _cerrarModalSolicitud(); _toast('No se pudo cargar el detalle.', 'error'); return; }
      _renderizarModalSolicitud(data);
    })
    .catch(function(err) { _cerrarModalSolicitud(); console.error(err); });
}

function _renderizarModalSolicitud(d) {
  var modal = document.getElementById('modalSolicitud');
  if (!modal) return;

  // Badge de resultado
  var resultBadge = '';
  var res = (d.resultado.resultadoSolicitud || '').toUpperCase();
  if (res === 'APROBADO') resultBadge = '<span class="badge badge--success" style="font-size:13px; padding:6px 14px;">APROBADO</span>';
  else if (res === 'NEGADO') resultBadge = '<span class="badge badge--red" style="font-size:13px; padding:6px 14px;">NEGADO</span>';
  else if (res) resultBadge = '<span class="badge badge--gray" style="font-size:13px; padding:6px 14px;">' + res + '</span>';

  var html = '<div style="background:white;border-radius:var(--radius-lg);width:100%;max-width:720px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);">'
    // Header con gradiente
    + '<div style="padding:24px;background:var(--color-primary-navy);border-radius:var(--radius-lg) var(--radius-lg) 0 0;color:white;position:sticky;top:0;z-index:1;">'
    + '<div class="flex flex--between" style="margin-bottom:8px;"><h3 style="margin:0;color:white;font-size:var(--text-lg);">' + d.inquilino.nombre + '</h3>'
    + '<button onclick="_cerrarModalSolicitud()" style="background:rgba(255,255,255,0.2);border:none;width:28px;height:28px;border-radius:50%;color:white;font-size:14px;cursor:pointer;">✕</button></div>'
    + '<div style="opacity:0.75;font-size:var(--text-sm);">' + d.inquilino.tipoDoc + ' ' + d.inquilino.identificacion + ' · Solicitud: ' + d.inquilino.solicitud + '</div>'
    + (resultBadge ? '<div style="margin-top:12px;">' + resultBadge + '</div>' : '')
    + '</div>'
    + '<div style="padding:24px;">';

  // Sección: Inmueble (colapsada por defecto, más compacta)
  html += '<details style="margin-bottom:20px;">'
    + '<summary style="cursor:pointer;font-weight:600;color:var(--color-primary-navy);font-size:var(--text-sm);padding:8px 0;">📍 Datos del inmueble</summary>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px 0;">'
    + _chipModal('Ciudad', d.inmueble.ciudad) + _chipModal('Dirección', d.inmueble.direccion) + _chipModal('Destino', d.inmueble.destino)
    + _chipModal('Canon', '$' + _fmtNum(d.inmueble.canon)) + _chipModal('Póliza', d.inmueble.poliza) + _chipModal('Inmobiliaria', d.inmueble.inmobiliaria)
    + '</div></details>';

  // Sección: Evaluación Inquilino
  html += _seccionEvaluacion('👤 Evaluación — ' + d.inquilino.nombre, d.inquilino);

  // Sección: Codeudores
  for (var c = 0; c < d.codeudores.length; c++) {
    var coa = d.codeudores[c];
    html += _seccionEvaluacion('👥 Codeudor ' + coa.numero + ' — ' + coa.nombre, coa);
  }

  // Sección: Resultado final
  html += '<div style="margin-top:20px;padding:16px;background:rgba(37,49,80,0.03);border-radius:var(--radius-md);border:1px solid rgba(37,49,80,0.08);">'
    + '<h4 style="margin:0 0 12px;font-size:var(--text-sm);color:var(--color-primary-navy);">📊 Resultado de la solicitud</h4>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">'
    + _chipModal('Política ingresos', d.resultado.politicaIngresos)
    + _chipModal('Resultado solicitud', d.resultado.resultadoSolicitud, true)
    + _chipModal('Resultado lote', d.resultado.resultadoLote, true)
    + _chipModal('COAs aprobados', d.resultado.numCoaAprob)
    + _chipModal('COAs negados', d.resultado.numCoaNeg)
    + _chipModal('COAs evaluados', d.resultado.coaEvaluados)
    + '</div>';

  if (d.resultado.detalleResultado) {
    html += '<div style="margin-top:12px;padding:10px 12px;background:white;border-radius:var(--radius-sm);font-size:var(--text-sm);">'
      + '<strong style="color:var(--color-mono-500);font-size:11px;text-transform:uppercase;">Detalle</strong><br>'
      + d.resultado.detalleResultado + '</div>';
  }
  if (d.resultado.comentarios) {
    html += '<div style="margin-top:8px;padding:10px 12px;background:white;border-radius:var(--radius-sm);font-size:var(--text-sm);">'
      + '<strong style="color:var(--color-mono-500);font-size:11px;text-transform:uppercase;">Comentarios del analista</strong><br>'
      + d.resultado.comentarios + '</div>';
  }

  // Footer con asignación y registro SAI
  html += '<div style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(0,0,0,0.06);display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:var(--text-sm);color:var(--color-mono-500);">'
    + '<div>Asignada a: <strong style="color:var(--color-mono-900);">' + (d.asignacion.asignadaA || 'Sin asignar') + '</strong></div>'
    + '<div>Registro SAI: <strong style="color:var(--color-mono-900);">' + (d.resultado.registroSAI || 'Pendiente') + '</strong></div>'
    + '<div>Fecha evaluación: <strong style="color:var(--color-mono-900);">' + (d.resultado.fechaEvaluacion || 'Pendiente') + '</strong></div>'
    + '</div></div>';

  html += '</div></div>';
  modal.innerHTML = html;
}

function _seccionEvaluacion(titulo, persona) {
  var resFinal = (persona.resultadoFinal || '').toUpperCase();
  var resBadge = resFinal === 'APROBADO' ? '<span class="badge badge--success" style="margin-left:8px;">' + resFinal + '</span>'
    : resFinal === 'NEGADO' ? '<span class="badge badge--red" style="margin-left:8px;">' + resFinal + '</span>'
    : resFinal ? '<span class="badge badge--gray" style="margin-left:8px;">' + resFinal + '</span>' : '';

  return '<div style="margin-bottom:16px;padding:16px;border:1px solid rgba(0,0,0,0.06);border-radius:var(--radius-md);">'
    + '<div class="flex" style="align-items:center;margin-bottom:10px;"><h4 style="margin:0;font-size:var(--text-sm);color:var(--color-primary-navy);">' + titulo + '</h4>' + resBadge + '</div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">'
    + _chipModal('Ingresos', persona.ingresos ? '$' + _fmtNum(persona.ingresos) : '-')
    + _chipModal('Acierta', persona.acierta)
    + _chipModal('Ocupación', persona.ocupacion)
    + _chipModal('Resp. modelo', persona.respuestaModelo)
    + _chipModal('Regla Dura', persona.reglaDura)
    + '</div></div>';
}

function _chipModal(label, valor, destacar) {
  var valStyle = destacar && valor ? 'font-weight:700;color:var(--color-primary-navy);' : 'color:var(--color-mono-800);';
  return '<div style="font-size:var(--text-sm);">'
    + '<div style="font-size:10px;text-transform:uppercase;letter-spacing:0.3px;color:var(--color-mono-500);margin-bottom:2px;">' + label + '</div>'
    + '<div style="' + valStyle + '">' + (valor || '-') + '</div></div>';
}

function _cerrarModalSolicitud() {
  var modal = document.getElementById('modalSolicitud');
  if (modal) modal.remove();
}

//  VISTA: USUARIOS (CRUD)
// ============================================================

function cargarVistaUsuarios() {
  // 1. Check cache first
  var cached = CacheManager.get('usuarios');
  if (cached) {
    _renderizarUsuarios(cached);
    return;
  }

  // 2. Cache miss → show skeleton
  SkeletonSystem.mostrar('viewDashboard', 'tabla', {
    columnas: ['Nombre', 'Email', 'Rol', 'Estado', ''],
    filas: 6,
    titulo: 'Usuarios'
  });
  mostrarVista('viewDashboard');

  // 3. Fetch from server with 15s timeout
  var navIdLocal = _navId;
  var timeoutId = setTimeout(function() {
    if (!_sigueVigente(navIdLocal)) return;
    SkeletonSystem.reemplazar('viewDashboard',
      '<div class="card" style="text-align:center;padding:var(--space-8);">'
      + '<p style="color:var(--color-mono-500);">No pudimos conectar con el servidor.</p>'
      + '<button class="btn btn--primary" onclick="cargarVistaUsuarios()">Reintentar</button></div>');
  }, 15000);

  callServer('api_obtenerUsuarios')
    .then(function(datos) {
      clearTimeout(timeoutId);
      if (!_sigueVigente(navIdLocal)) return;
      CacheManager.set('usuarios', datos || []);
      _renderizarUsuarios(datos || []);
    })
    .catch(function(err) {
      clearTimeout(timeoutId);
      if (!_sigueVigente(navIdLocal)) return;
      console.error(err);
      SkeletonSystem.reemplazar('viewDashboard',
        '<div class="card" style="text-align:center;padding:var(--space-8);">'
        + '<p style="color:var(--color-mono-500);">No pudimos cargar los usuarios.</p>'
        + '<button class="btn btn--primary" onclick="cargarVistaUsuarios()">Reintentar</button></div>');
    });
}

function _renderizarUsuarios(usuarios) {
  var container = document.getElementById('viewDashboard');

  // Agrupar por rol
  var grupos = { LIDER: [], ADMIN: [], AUXILIAR: [], ANALISTA: [], COMERCIAL: [] };
  for (var i = 0; i < usuarios.length; i++) {
    var rol = usuarios[i].rol || 'COMERCIAL';
    if (!grupos[rol]) grupos[rol] = [];
    grupos[rol].push(usuarios[i]);
  }

  var ordenRoles = [
    { key: 'ADMIN', label: 'Administradores', badge: 'badge--red' },
    { key: 'LIDER', label: 'Líderes', badge: 'badge--navy' },
    { key: 'AUXILIAR', label: 'Auxiliares de Análisis', badge: 'badge--orange' },
    { key: 'ANALISTA', label: 'Analistas', badge: 'badge--teal' },
    { key: 'COMERCIAL', label: 'Comerciales', badge: 'badge--gray' }
  ];

  var html = '<div class="stack">'
    + '<div class="flex flex--between"><h2>Usuarios</h2>'
    + '<button class="btn btn--primary" onclick="_mostrarFormUsuario(null)">+ Nuevo usuario</button></div>';

  for (var r = 0; r < ordenRoles.length; r++) {
    var grupo = ordenRoles[r];
    var lista = grupos[grupo.key] || [];
    if (lista.length === 0) continue;

    html += '<div class="card card--flat" style="padding:0; overflow:hidden;">'
      + '<div style="padding:12px 16px; background:rgba(37,49,80,0.03); border-bottom:1px solid rgba(0,0,0,0.06);">'
      + '<div class="flex flex--between" style="align-items:center;">'
      + '<div class="flex flex--gap-sm" style="align-items:center;">'
      + '<span class="badge ' + grupo.badge + '">' + grupo.key + '</span>'
      + '<strong style="font-size:var(--text-sm);">' + grupo.label + '</strong>'
      + '</div>'
      + '<small style="color:var(--color-mono-500);">' + lista.length + ' usuario(s)</small>'
      + '</div></div>'
      + '<table class="table"><tbody>';

    for (var j = 0; j < lista.length; j++) {
      var u = lista[j];
      var extraInfo = '';
      if (u.rol === 'ANALISTA') extraInfo = 'Cupo: ' + u.cupo;
      else if (u.rol === 'COMERCIAL' && u.director) extraInfo = 'Dir: ' + u.director.split('@')[0];

      html += '<tr>'
        + '<td style="width:200px;"><strong>' + u.nombre + '</strong></td>'
        + '<td style="font-size:var(--text-sm); color:var(--color-mono-500);">' + u.email + '</td>'
        + '<td style="font-size:var(--text-sm); color:var(--color-mono-500);">' + extraInfo + '</td>'
        + '<td style="width:50px; text-align:center;">' + (u.activo ? '<span style="color:#0d7a54;">✓</span>' : '<span style="color:#bd0f14;">✗</span>') + '</td>'
        + '<td style="width:60px;"><button class="btn btn--ghost" style="padding:4px 8px; font-size:var(--text-sm);" onclick=\'_mostrarFormUsuario(' + JSON.stringify(u).replace(/'/g, "\\'") + ')\'>Editar</button></td>'
        + '</tr>';
    }

    html += '</tbody></table></div>';
  }

  html += '</div>';
  container.innerHTML = html;
  mostrarVista('viewDashboard');
}

function _mostrarFormUsuario(usuario) {
  var esNuevo = !usuario;
  var u = usuario || { email: '', nombre: '', rol: 'COMERCIAL', cupo: 0, director: '', backup: '', backupActivo: false, activo: true };

  // Crear modal overlay
  var modal = document.createElement('div');
  modal.id = 'modalUsuario';
  modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;';

  modal.innerHTML = '<div style="background:white;border-radius:var(--radius-lg);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);">'
    + '<div style="padding:20px 24px;border-bottom:1px solid rgba(0,0,0,0.06);">'

    + '<div class="stack" style="gap:16px;">'

    + '<div><label>Nombre *</label><input class="input" id="uf_nombre" value="' + u.nombre + '"></div>'
    + '<div><label>Rol *</label><select class="input" id="uf_rol" onchange="_toggleCamposRol()">'

    + '</select></div>'
    + '<div id="uf_cupoWrap" style="' + (u.rol === 'ANALISTA' ? '' : 'display:none;') + '"><label>Cupo de solicitudes</label><input class="input" id="uf_cupo" type="number" value="' + u.cupo + '"></div>'
    + '<div id="uf_dirWrap" style="' + (u.rol === 'COMERCIAL' ? '' : 'display:none;') + '"><label>Director</label><input class="input" id="uf_director" value="' + u.director + '"></div>'
    + '<div id="uf_backWrap" style="' + (u.rol === 'COMERCIAL' ? '' : 'display:none;') + '"><label>Backup</label><input class="input" id="uf_backup" value="' + u.backup + '"><label style="margin-top:8px;text-transform:none;font-size:var(--text-sm);"><input type="checkbox" id="uf_backupActivo" ' + (u.backupActivo ? 'checked' : '') + '> Backup activo</label></div>'

  document.body.appendChild(modal);

  // Cerrar con Escape
  modal.addEventListener('keydown', function(e) { if (e.key === 'Escape') _cerrarModal(); });

  modal.addEventListener('click', function(e) { if (e.target === modal) _cerrarModal(); });
}

function _cerrarModal() {
  var modal = document.getElementById('modalUsuario');
  if (modal) modal.remove();
}

function _toggleCamposRol() {
  var rol = document.getElementById('uf_rol').value;
  document.getElementById('uf_cupoWrap').style.display = rol === 'ANALISTA' ? '' : 'none';
  document.getElementById('uf_dirWrap').style.display = rol === 'COMERCIAL' ? '' : 'none';
  document.getElementById('uf_backWrap').style.display = rol === 'COMERCIAL' ? '' : 'none';
}

function _guardarUsuario(esNuevo) {
  var datos = {
    email: document.getElementById('uf_email').value,
    nombre: document.getElementById('uf_nombre').value,
    rol: document.getElementById('uf_rol').value,
    cupo: document.getElementById('uf_cupo').value,
    director: document.getElementById('uf_director').value,
    backup: document.getElementById('uf_backup').value,
    backupActivo: document.getElementById('uf_backupActivo').checked,
    activo: document.getElementById('uf_activo').checked
  };

  if (!datos.email || !datos.nombre) {
    _toast('Email y nombre son obligatorios.', 'warning');
    return;
  }

  _cerrarModal();

  OptimisticUpdater.ejecutar({
    cacheKey: 'usuarios',
    mutacion: function(lista) {
      lista = (lista || []).slice();
      var idx = -1;
      for (var i = 0; i < lista.length; i++) {
        if (lista[i].email === datos.email) { idx = i; break; }
      }
      if (idx >= 0) { lista[idx] = datos; } else { lista.push(datos); }
      return lista;
    },
    render: function() { _renderizarUsuarios(CacheManager.get('usuarios') || []); },
    serverFn: 'api_guardarUsuario',
    serverArgs: [datos, esNuevo],
    invalidarKeys: []
  });
}

function _verDetalleLote(idLote) {
  SkeletonSystem.mostrar('viewDashboard', 'detalle', { campos: 8 });
  mostrarVista('viewDashboard');

  var navIdLocal = _navId;
  var timeoutId = setTimeout(function() {
    if (!_sigueVigente(navIdLocal)) return;
    SkeletonSystem.reemplazar('viewDashboard',
      '<div class="card" style="text-align:center;padding:var(--space-8);">'
      + '<p style="color:var(--color-mono-500);">No pudimos conectar con el servidor.</p>'
      + '<button class="btn btn--primary" onclick="_verDetalleLote(\'' + idLote + '\')">Reintentar</button></div>');
  }, 15000);

  callServer('api_obtenerDetalleLote', idLote)
    .then(function(data) {
      clearTimeout(timeoutId);
      if (!_sigueVigente(navIdLocal)) return;
      if (!data || !data.lote) {
        SkeletonSystem.reemplazar('viewDashboard',
          '<div class="card" style="text-align:center;padding:var(--space-8);">'
          + '<p style="color:var(--color-mono-500);">No se encontró el lote "' + idLote + '".</p>'
          + '<button class="btn btn--ghost" onclick="cargarMisLotes(_lotesPageActual)">← Volver a lotes</button></div>');
        return;
      }
      _renderizarDetalleLote(data);
    })
    .catch(function(err) {
      clearTimeout(timeoutId);
      if (!_sigueVigente(navIdLocal)) return;
      console.error(err);
      SkeletonSystem.reemplazar('viewDashboard',
        '<div class="card" style="text-align:center;padding:var(--space-8);">'
        + '<p style="color:var(--color-mono-500);">Error al cargar detalle del lote.</p>'
        + '<button class="btn btn--primary" onclick="_verDetalleLote(\'' + idLote + '\')">Reintentar</button></div>');
    });
}

/**
 * Carga la vista de Métricas.
 * Usa una función unificada del backend que trae todos los datos en un solo round-trip:
 * usuarios-dash, lotes, métricas de lotes e histórico.
 * Reduce la latencia de 3-4 llamadas secuenciales a una sola.
 */
function cargarVistaMetricasLotes() {
  if (!MetricasLotesView.tieneAcceso()) {
    mostrarVistaEnConstruccion('metricas-lotes');
    return;
  }
  mostrarVista('viewMetricasLotes');

  // Reservar el espacio de los filtros Director/Comercial y del chip de
  // Sucursal ANTES de que lleguen los datos — evitan que la barra de
  // filtros cambie de tamaño (y empuje todo lo de abajo) cuando aparecen.
  _mostrarSkeletonFiltrosMetricas();

  // Mostrar loading state centralizado en el área de contenido inmediatamente
  var contenedorMetricas = document.getElementById('metricasLotesContenido');
  if (contenedorMetricas) {
    contenedorMetricas.innerHTML = '<div class="metricas-lotes__loading-fullstate">'
      + '<div class="metricas-lotes__loading-dots-bg" aria-hidden="true"></div>'
      + '<div class="metricas-lotes__loading-center">'
      + '<div class="metricas-lotes__spinner-ring" aria-hidden="true"></div>'
      + '<p class="metricas-lotes__loading-msg">Cargando métricas operativas...</p>'
      + '<p class="metricas-lotes__loading-sub">Preparando datos del periodo actual</p>'
      + '</div></div>';
  }

  // Ocultar filtros durante la carga para evitar interacción prematura
  var filtrosCard = document.getElementById('metricasLotesFiltrosCard');
  if (filtrosCard) filtrosCard.style.display = 'none';

  // Pre-llenar inputs de fecha para que no se vean vacíos durante la carga
  var hoyDate = new Date();
  var primerDiaDate = new Date(hoyDate.getFullYear(), hoyDate.getMonth(), 1);
  var inputDesdeEl = document.getElementById('metricasLotesFechaDesde');
  var inputHastaEl = document.getElementById('metricasLotesFechaHasta');
  if (inputDesdeEl && !inputDesdeEl.value) inputDesdeEl.value = _formatearFechaISOUtil(primerDiaDate);
  if (inputHastaEl && !inputHastaEl.value) inputHastaEl.value = _formatearFechaISOUtil(hoyDate);

  var navIdLocal = _navId;

  // Calcular rango de fechas para métricas de lotes (mismo que MetricasLotesView)
  var hoy = new Date();
  var primerDia = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
  var fechaDesde = _formatearFechaISOUtil(primerDia);
  var fechaHasta = _formatearFechaISOUtil(hoy);

  // Verificar si ya tenemos TODOS los datos en cache (evitar call innecesario)
  var cachedUsuarios = CacheManager.get('usuarios-dash');
  var cachedLotes = CacheManager.get('lotes');
  var cachedMetricas = CacheManager.get('metricas-lotes');
  var cachedRango = CacheManager.get('metricas-lotes-rango');
  var metricasCoinciden = cachedMetricas && cachedRango &&
    cachedRango.fechaDesde === fechaDesde && cachedRango.fechaHasta === fechaHasta;

  if (cachedUsuarios && cachedLotes && metricasCoinciden) {
    // Todo en cache → renderizar inmediatamente sin round-trip
    _renderizarMetricasCompleta(cachedUsuarios, cachedLotes, cachedMetricas, null, null, navIdLocal);
    // Limpiar métricas pre-cargadas para que la siguiente consulta manual vaya al server
    CacheManager.invalidar(['metricas-lotes', 'metricas-lotes-rango']);
    return;
  }

  // Llamada unificada al backend (1 solo round-trip)
  callServer('api_obtenerDatosMetricas', fechaDesde, fechaHasta)
    .then(function(datos) {
      if (!_sigueVigente(navIdLocal)) return;

      // Poblar caches para uso futuro (drill-down filter changes, etc.)
      if (datos.usuarios) CacheManager.set('usuarios-dash', datos.usuarios);
      if (datos.lotes) CacheManager.set('lotes', datos.lotes);
      if (datos.metricasLotes) CacheManager.set('metricas-lotes-ref', datos.metricasLotes);

      _renderizarMetricasCompleta(
        datos.usuarios || [],
        datos.lotes || [],
        datos.metricasLotes || null,
        datos.historico || null,
        datos.desglose || null,
        navIdLocal
      );
    })
    .catch(function(err) {
      if (!_sigueVigente(navIdLocal)) return;
      console.error('Error cargando datos de métricas:', err);
      // Fallback: mostrar filtros y cargar por separado
      var filtrosCardFb = document.getElementById('metricasLotesFiltrosCard');
      if (filtrosCardFb) filtrosCardFb.style.display = '';
      _inicializarFiltrosYGraficos();
      MetricasLotesView.init();
    });
}

/**
 * Reserva el espacio de la fila de filtros (Director/Comercial + Sucursal)
 * de la vista Métricas ANTES de tener los datos, para que la barra de
 * filtros no cambie de altura cuando los dropdowns/chips reales aparecen
 * (evita el salto visual entre "mientras carga" y "ya cargó").
 * La visibilidad de Director/Comercial es puramente por rol (DrillDownFilters
 * ya expone esa lógica) — no depende de datos, así que se puede saber de una.
 */
/**
 * Muestra/oculta el grupo "Equipo" (Director/Comercial) y su divisor
 * visual junto al grupo "Período" — para roles sin acceso a esos filtros
 * (COMERCIAL, AUXILIAR, ANALISTA, CONSULTOR) no queda una caja vacía.
 */
function _actualizarVisibilidadFiltroEquipo(visible) {
  var filtersContainer = document.getElementById('drilldown-filters-container');
  var divisor = document.getElementById('metricasLotesFiltroDivisor');
  if (filtersContainer) filtersContainer.style.display = visible ? 'flex' : 'none';
  if (divisor) divisor.style.display = visible ? 'block' : 'none';
}

function _mostrarSkeletonFiltrosMetricas() {
  var filtersContainer = document.getElementById('drilldown-filters-container');
  if (filtersContainer && typeof DrillDownFilters !== 'undefined' && APP_USUARIO) {
    var visibilidad = DrillDownFilters._getVisibilidad(APP_USUARIO.rol);

    // Skeleton moderno: placeholder animado con icono pulsante y texto contextual
    var skeletonEquipo = '<div class="drilldown-filters__group">'
      + '<label class="drilldown-filters__label" style="color:var(--color-mono-400);font-size:0.7rem;">Equipo</label>'
      + '<div class="metricas-lotes__skeleton-select">'
      + '<span class="metricas-lotes__skeleton-select__icon"></span>'
      + '<span class="metricas-lotes__skeleton-select__text" style="width:70px;"></span>'
      + '</div></div>';

    var skeletonComercial = '<div class="drilldown-filters__group">'
      + '<label class="drilldown-filters__label" style="color:var(--color-mono-400);font-size:0.7rem;">Comercial</label>'
      + '<div class="metricas-lotes__skeleton-select">'
      + '<span class="metricas-lotes__skeleton-select__icon"></span>'
      + '<span class="metricas-lotes__skeleton-select__text" style="width:90px;"></span>'
      + '</div></div>';

    if (visibilidad === 'ambos') {
      filtersContainer.innerHTML = skeletonEquipo + skeletonComercial;
      _actualizarVisibilidadFiltroEquipo(true);
    } else if (visibilidad === 'solo-comercial') {
      filtersContainer.innerHTML = skeletonComercial;
      _actualizarVisibilidadFiltroEquipo(true);
    } else {
      _actualizarVisibilidadFiltroEquipo(false);
    }
  }

  // Skeleton para chips de sucursal — placeholders con forma de chip real
  var chipsSucursal = document.getElementById('metricasLotesChipsSucursal');
  if (chipsSucursal && chipsSucursal.innerHTML.indexOf('data-sucursal') === -1) {
    chipsSucursal.innerHTML = '<span class="metricas-lotes__chips-label">Sucursal:</span>'
      + '<span class="metricas-lotes__skeleton-chips">'
      + '<span class="metricas-lotes__skeleton-chip" style="width:60px;"></span>'
      + '<span class="metricas-lotes__skeleton-chip" style="width:75px;"></span>'
      + '<span class="metricas-lotes__skeleton-chip" style="width:50px;"></span>'
      + '</span>';
    chipsSucursal.style.display = 'flex';
  }
}

/**
 * Renderiza la vista Métricas completa con todos los datos ya disponibles.
 * Evita llamadas adicionales al servidor — todo se procesa localmente.
 * @param {Array} usuarios - Datos de usuarios para drill-down
 * @param {Array} lotes - Datos de lotes para gráficos
 * @param {Object|null} metricasLotes - Métricas de lotes para KPIs + tabla
 * @param {Array|null} historico - Histórico para gráficas de tendencia
 * @param {Object|null} desglose - Desglose de estados en proceso (pipeline distribución)
 * @param {number} navIdLocal - ID de navegación para descartar respuestas tardías
 */
function _renderizarMetricasCompleta(usuarios, lotes, metricasLotes, historico, desglose, navIdLocal) {
  if (!_sigueVigente(navIdLocal)) return;

  // Mostrar la card de filtros (se ocultó durante la carga inicial)
  var filtrosCardEl = document.getElementById('metricasLotesFiltrosCard');
  if (filtrosCardEl) filtrosCardEl.style.display = '';

  // ── 1. Filtros drill-down (Director/Comercial) — filtran TODA la sección ──
  var filtersContainer = document.getElementById('drilldown-filters-container');
  if (filtersContainer) {
    var rol = APP_USUARIO ? APP_USUARIO.rol : '';
    var emailUsuario = APP_USUARIO ? APP_USUARIO.email : '';
    var filtrosHtml = DrillDownFilters.render(rol, usuarios, emailUsuario);
    filtersContainer.innerHTML = filtrosHtml;
    _actualizarVisibilidadFiltroEquipo(filtrosHtml !== '');

    // Director/Comercial → filtran resumen, análisis y tabla de Métricas
    DrillDownFilters._onFiltroChange = function() {
      if (!_sigueVigente(navIdLocal)) return;
      _aplicarFiltroDirectorComercial(CacheManager.get('lotes') || lotes, usuarios);
    };
  }

  // ── 2. Aplicar filtro de equipo inicial (ninguno seleccionado = sin filtro) ──
  _aplicarFiltroDirectorComercial(lotes, usuarios);

  // ── 3. Métricas de lotes (tabla + KPIs) — delegar a MetricasLotesView ──
  if (metricasLotes && metricasLotes.detallePorLote && metricasLotes.detallePorLote.length > 0) {
    // Inyectar datos directamente sin llamar al server
    MetricasLotesView.initConDatos(metricasLotes, historico, desglose);
  } else {
    // Sin datos pre-cargados: init normal (usará sus propios defaults)
    MetricasLotesView.init();
  }
}

function cargarVistaConfiguracion() {
  var esAdmin = APP_USUARIO && APP_USUARIO.rol === 'ADMIN';
  var motivosCache = CacheManager.get('config-motivos');
  var notificacionesCache = CacheManager.get('config-notificaciones');

  if (motivosCache && (!esAdmin || notificacionesCache)) {
    _renderizarConfiguracionCompleta(motivosCache, notificacionesCache || []);
    return;
  }

  SkeletonSystem.mostrar('viewDashboard', 'lista', { items: 5, titulo: 'Configuración' });
  mostrarVista('viewDashboard');

  var navIdLocal = _navId;
  var promesaMotivos = motivosCache ? Promise.resolve(motivosCache) : callServer('api_obtenerCatalogoMotivos');
  var promesaNotificaciones = esAdmin
    ? (notificacionesCache ? Promise.resolve(notificacionesCache) : callServer('api_obtenerConfiguracionNotificaciones'))
    : Promise.resolve([]);

  Promise.all([promesaMotivos, promesaNotificaciones])
    .then(function(resultado) {
      if (!_sigueVigente(navIdLocal)) return;
      var motivos = resultado[0] || [];
      var notificaciones = resultado[1] || [];
      CacheManager.set('config-motivos', motivos);
      if (esAdmin) CacheManager.set('config-notificaciones', notificaciones);
      _renderizarConfiguracionCompleta(motivos, notificaciones);
    })
    .catch(function() {
      if (!_sigueVigente(navIdLocal)) return;
      SkeletonSystem.reemplazar('viewDashboard',
        '<div class="card" style="text-align:center;padding:var(--space-8);">'
        + '<p style="color:var(--color-mono-500);">Error al cargar configuración.</p>'
        + '<button class="btn btn--primary" onclick="cargarVistaConfiguracion()">Reintentar</button></div>');
    });
}

function _renderizarConfiguracionCompleta(motivos, notificaciones) {
  _renderizarConfigMotivos(motivos);
  if (!APP_USUARIO || APP_USUARIO.rol !== 'ADMIN') return;

  window.CONFIGURACION_NOTIFICACIONES = notificaciones || [];
  var container = document.getElementById('viewDashboard');
  if (!container) return;

  var html = '<div class="card">'
    + '<div class="flex flex--between" style="margin-bottom:var(--space-5);align-items:flex-start;gap:var(--space-4);">'
    + '<div><h3 style="margin-bottom:var(--space-1);">Notificaciones</h3>'
    + '<p style="font-size:var(--text-sm);color:var(--color-mono-500);margin:0;">Controla qué correos se envían. Las agendas usan hora de Colombia y Apps Script puede ejecutarlas con unos minutos de variación.</p></div>'
    + '<span class="badge badge--navy">Solo ADMIN</span></div>'
    + '<div class="stack stack--tight">';

  for (var i = 0; i < notificaciones.length; i++) {
    var politica = notificaciones[i];
    var estado = politica.activa ? 'Activa' : 'Inactiva';
    var color = politica.activa ? '#0d7a54' : '#bd0f14';
    html += '<div style="padding:var(--space-4);border:1px solid var(--color-mono-100);border-radius:var(--radius-sm);">'
      + '<div class="flex flex--between" style="gap:var(--space-4);align-items:flex-start;">'
      + '<div><strong style="font-size:var(--text-sm);color:var(--color-primary-navy);">' + politica.nombre + '</strong>'
      + '<p style="font-size:var(--text-sm);color:var(--color-mono-500);margin:4px 0 0;">' + politica.descripcion + '</p>'
      + '<p style="font-size:var(--text-xs);color:var(--color-mono-500);margin:6px 0 0;">' + _resumenAgendaNotificacion(politica) + '</p></div>'
      + '<div style="text-align:right;white-space:nowrap;"><span style="display:block;font-size:var(--text-xs);font-weight:700;color:' + color + ';margin-bottom:8px;">' + estado + '</span>'
      + '<button class="btn btn--ghost" style="font-size:var(--text-xs);padding:var(--space-1) var(--space-2);" onclick="_modalConfiguracionNotificacion(\'' + politica.id + '\')">Configurar</button></div>'
      + '</div></div>';
  }

  html += '</div></div>';
  container.insertAdjacentHTML('beforeend', html);
}

function _resumenAgendaNotificacion(politica) {
  if (politica.tipo === 'EVENTO' || politica.tipo === 'EVENTO_MANUAL') return 'Se envía inmediatamente cuando ocurre el evento.';
  var textos = [];
  for (var i = 0; i < politica.agendas.length; i++) {
    var agenda = politica.agendas[i];
    var hora = String(agenda.hora).padStart(2, '0') + ':' + String(agenda.minuto).padStart(2, '0');
    if (politica.tipo === 'PROGRAMADA_SEMANAL') textos.push(_etiquetaDiasNotificacion(agenda.diasSemana) + ' · ' + hora);
    else if (politica.tipo === 'PROGRAMADA_MENSUAL') textos.push('Día ' + agenda.diaMes + ' · ' + hora);
    else if (politica.tipo === 'PROGRAMADA_INTERVALO') textos.push('Cada ' + agenda.cadaDias + ' días · ' + hora);
    else textos.push('Cada ' + agenda.cadaDias + ' día(s) · ' + hora);
  }
  return textos.join(' | ') + ' · America/Bogota';
}

function _etiquetaDiasNotificacion(dias) {
  var etiquetas = { MONDAY: 'Lun', TUESDAY: 'Mar', WEDNESDAY: 'Mié', THURSDAY: 'Jue', FRIDAY: 'Vie', SATURDAY: 'Sáb', SUNDAY: 'Dom' };
  return (dias || []).map(function(dia) { return etiquetas[dia] || dia; }).join(', ');
}

function _modalConfiguracionNotificacion(id) {

  modal.innerHTML = '<div class="modal-content nc-modal">'
    + '<div class="modal-header modal-header--navy nc-modal__header">'
    + '<div class="nc-modal__title-row"><div><h3 id="nc_modal_titulo" class="nc-modal__title">' + politica.nombre + '</h3>'
    + '<span class="badge badge--gray nc-modal__type">' + _etiquetaTipoNotificacion(politica.tipo) + '</span></div>'
    + '<button class="modal-close" type="button" aria-label="Cerrar configuración" onclick="_cerrarModalConfiguracionNotificacion()">✕</button></div></div>'
    + '<div class="modal-body nc-modal__body">'
    + '<p class="nc-modal__description">' + politica.descripcion + '</p>'
    + '<section class="nc-modal__section" aria-labelledby="nc_estado_titulo">'
    + '<div class="nc-section-heading"><div><h4 id="nc_estado_titulo">Estado de la notificación</h4><p>Define si este correo puede enviarse.</p></div></div>'

function _cerrarModalConfiguracionNotificacion() {
  var modal = document.getElementById('modalConfiguracionNotificacion');

function _etiquetaTipoNotificacion(tipo) {
  var etiquetas = {
    EVENTO: 'Por evento',

    PROGRAMADA_DIARIA: 'Diaria',
    PROGRAMADA_SEMANAL: 'Semanal',
    PROGRAMADA_MENSUAL: 'Mensual',
    PROGRAMADA_INTERVALO: 'Por intervalo'
  };
  return etiquetas[tipo] || 'Configuración';
}

    var filas = '<div id="nc_agendas_semanales" class="nc-schedule-list">';

      + '<div class="nc-timezone">Zona horaria: <strong>America/Bogota</strong></div>' + filas + '</div></section>';
  }

  var agenda = politica.agendas[0] || { hora: 8, minuto: 0, cadaDias: 1, diaMes: 1 };

function _filaAgendaSemanal(agenda) {
  var dias = ['MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY', 'SUNDAY'];
  var etiquetas = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
  var checks = '';
  for (var i = 0; i < dias.length; i++) {
    var seleccionado = (agenda.diasSemana || []).indexOf(dias[i]) !== -1 ? 'checked' : '';
    checks += '<label class="nc-day-option"><input type="checkbox" value="' + dias[i] + '" ' + seleccionado + '><span>' + etiquetas[i] + '</span></label>';
  }
  return '<article class="nc-agenda-semanal nc-schedule-card">'
    + '<div class="nc-schedule-card__header"><strong class="nc-schedule-card__title">Horario</strong><button class="btn btn--ghost nc-remove-schedule" type="button" onclick="_quitarAgendaSemanal(this)">Quitar</button></div>'
    + '<div class="nc-day-grid">' + checks + '</div>'
    + '<div class="grid grid--2 nc-fields"><div class="nc-field"><label class="nc-field__label">Hora</label><input class="input nc_hora" type="number" min="0" max="23" value="' + agenda.hora + '"><span class="nc-field__hint">De 0 a 23</span></div>'
    + '<div class="nc-field"><label class="nc-field__label">Minuto</label><input class="input nc_minuto" type="number" min="0" max="59" value="' + agenda.minuto + '"><span class="nc-field__hint">De 0 a 59</span></div></div></article>';
}

function _quitarAgendaSemanal(boton) {
  var contenedor = document.getElementById('nc_agendas_semanales');
  if (!contenedor || contenedor.querySelectorAll('.nc-agenda-semanal').length <= 1) {
    _toast('Debe existir al menos un horario semanal.', 'warning');
    return;
  }
  var tarjeta = boton.closest('.nc-agenda-semanal');
  if (tarjeta) tarjeta.remove();
  _renumerarAgendasSemanales();
}

function _renumerarAgendasSemanales() {
  var tarjetas = document.querySelectorAll('#nc_agendas_semanales .nc-agenda-semanal');
  for (var i = 0; i < tarjetas.length; i++) {
    var titulo = tarjetas[i].querySelector('.nc-schedule-card__title');
    if (titulo) titulo.textContent = 'Horario ' + (i + 1);
  }
}

function _agregarAgendaSemanal() {
  var contenedor = document.getElementById('nc_agendas_semanales');
  if (!contenedor) return;
  contenedor.insertAdjacentHTML('beforeend', _filaAgendaSemanal({ diasSemana: ['MONDAY'], hora: 8, minuto: 0 }));
  _renumerarAgendasSemanales();
}

function _guardarConfiguracionNotificacion() {
  var modal = document.getElementById('modalConfiguracionNotificacion');
  var id = modal && modal.dataset.politicaId;
  var politica = (window.CONFIGURACION_NOTIFICACIONES || []).filter(function(item) { return item.id === id; })[0];
  if (!politica) return;

  var configuracion = { id: id, activa: document.getElementById('nc_activa').checked, agendas: _obtenerAgendasNotificacion(politica) };
  if (configuracion.agendas === null) return;

  callServer('api_guardarConfiguracionNotificacion', configuracion)
    .then(function(resultado) {
      if (!resultado || !resultado.ok) {
        _toast(resultado ? resultado.mensaje : 'No se pudo guardar la configuración.', 'error');
        return;
      }
      var politicas = window.CONFIGURACION_NOTIFICACIONES || [];
      for (var i = 0; i < politicas.length; i++) if (politicas[i].id === id) politicas[i] = resultado.configuracion;
      CacheManager.set('config-notificaciones', politicas);
      modal.remove();
      _renderizarConfiguracionCompleta(CacheManager.get('config-motivos') || [], politicas);
      _toast('Configuración guardada.', 'success');
    })
    .catch(function() { _toast('No se pudo guardar la configuración.', 'error'); });
}

function _obtenerAgendasNotificacion(politica) {
  if (politica.tipo === 'EVENTO' || politica.tipo === 'EVENTO_MANUAL') return [];
  if (politica.tipo === 'PROGRAMADA_SEMANAL') {
    var filas = document.querySelectorAll('.nc-agenda-semanal');
    var agendas = [];
    for (var i = 0; i < filas.length; i++) {
      var dias = [];
      var checks = filas[i].querySelectorAll('input[type="checkbox"]:checked');
      for (var j = 0; j < checks.length; j++) dias.push(checks[j].value);
      agendas.push({ diasSemana: dias, hora: Number(filas[i].querySelector('.nc_hora').value), minuto: Number(filas[i].querySelector('.nc_minuto').value) });
    }
    return agendas;
  }
  var agenda = { hora: Number(document.getElementById('nc_hora').value), minuto: Number(document.getElementById('nc_minuto').value) };
  if (politica.tipo === 'PROGRAMADA_MENSUAL') {
    agenda.diaMes = Number(document.getElementById('nc_diaMes').value);
  } else if (politica.tipo === 'PROGRAMADA_DIARIA') {
    agenda.cadaDias = 1;
  } else {
    agenda.cadaDias = Number(document.getElementById('nc_cadaDias').value);
  }
  return [agenda];
}

function _guardarMotivo(esNuevo) {
  var motivo = {
    id: document.getElementById('mot_id').value.trim(),
    label: document.getElementById('mot_label').value.trim(),
    instruccion: document.getElementById('mot_instruccion').value.trim(),
    activo: true
  };

  if (!motivo.id || !motivo.label || !motivo.instruccion) {
    _toast('Todos los campos son obligatorios.', 'warning');
    return;
  }

  var modal = document.getElementById('modalMotivo');
  if (modal) modal.remove();

  OptimisticUpdater.ejecutar({
    cacheKey: 'config-motivos',
    mutacion: function(lista) {
      lista = (lista || []).slice();
      var idx = -1;
      for (var i = 0; i < lista.length; i++) {
        if (lista[i].id === motivo.id) { idx = i; break; }
      }
      if (idx >= 0) { lista[idx] = motivo; } else { lista.push(motivo); }
      return lista;
    },
    render: function() { _renderizarConfigMotivos(CacheManager.get('config-motivos') || []); },
    serverFn: 'api_guardarMotivo',
    serverArgs: [motivo, esNuevo],
    invalidarKeys: ['errores']
  });
}

function _eliminarMotivo(id) {
  if (!confirm('¿Eliminar este motivo? No se podrá deshacer.')) return;

  OptimisticUpdater.ejecutar({
    cacheKey: 'config-motivos',
    mutacion: function(lista) {
      return (lista || []).filter(function(m) { return m.id !== id; });
    },
    render: function() { _renderizarConfigMotivos(CacheManager.get('config-motivos') || []); },
    serverFn: 'api_eliminarMotivo',
    serverArgs: [id],
    invalidarKeys: ['errores']
  });
}

/** Actualiza visualmente el stepper según campos completados */
function _actualizarStepper() {
  var steps = document.querySelectorAll('.rad-step');
  if (!steps.length) return;
  var poliza = (document.getElementById('rad_poliza') || {}).value;
  var tasa = (document.getElementById('rad_tasa') || {}).value;
  var ps = document.querySelector('input[name="rad_tipoPS"]:checked');
  var excel = document.getElementById('rad_fileExcel');
  var tieneExcel = excel && excel.files && excel.files.length > 0;

  // Step 1: info
  _marcarStep(steps[0], !!(poliza && tasa));
  // Step 2: paz y salvo
  _marcarStep(steps[1], !!ps);
  // Step 3: planilla
  _marcarStep(steps[2], tieneExcel);
  // Step 4: enviar (siempre pendiente hasta que se envíe)
  _marcarStep(steps[3], false);
}

function _marcarStep(stepEl, completo) {
  if (!stepEl) return;
  if (completo) {
    stepEl.classList.add('rad-step--done');
    stepEl.classList.remove('rad-step--active');
  } else if (!stepEl.classList.contains('rad-step--done')) {
    // El primer paso no-completo es el activo
    var prev = stepEl.previousElementSibling;
    var esActivo = !prev || prev.classList.contains('rad-step__line') || 
                   (prev.previousElementSibling && prev.previousElementSibling.classList.contains('rad-step--done'));
    if (esActivo) stepEl.classList.add('rad-step--active');
  }
}

function _archivoABase64(file) {
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = function() { resolve({ bytes: reader.result, nombre: file.name, tipo: file.type }); };
    reader.onerror = function(e) { reject(e); };
  });
}

// ── Carga diferida de la librería de lectura de Excel (sheetjs) ────────────
// Antes se cargaba con un <script> bloqueante en el <head> de IndexNuevo.html,
// en TODAS las cargas de página, para TODOS los roles — aunque solo el
// comercial la usa, y solo en este formulario. Ahora se descarga una única
// vez, en el momento en que alguien de verdad selecciona un Excel.
var _xlsxCargando = null;

function _cargarLibreriaExcel() {
  if (typeof XLSX !== 'undefined') return Promise.resolve();
  if (_xlsxCargando) return _xlsxCargando;

  _xlsxCargando = new Promise(function(resolve, reject) {
    var script = document.createElement('script');
    script.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
    script.onload = function() { resolve(); };
    script.onerror = function() {
      _xlsxCargando = null; // permite reintentar en el próximo archivo
      reject(new Error('No se pudo cargar el lector de Excel. Verifica tu conexión e intenta de nuevo.'));
    };
    document.head.appendChild(script);
  });

  return _xlsxCargando;
}

var _METADATOS_PLANILLA_OFICIAL = ['Tipo Negociacion', 'Número de Poliza', 'Nombre Inmobiliaria'];

  'Aseguradora Anterior', 'Fecha Inicio de Contrato', 'Amparo integral', 'Destino', 'Ciudad del inmueble', 'Dirección', 'Cánon', 'Administración', 'IVA', 'Nombre del Inquilino', 'Tipo de Documento (INQ)', 'Número de Identificación (INQ)', 'Celular (INQ)', 'Correo Electrónico (INQ)',

function _normalizarEtiquetaPlanillaCliente(valor) {
  return String(valor || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().replace(/\s+/g, ' ').toUpperCase();
}

function _validarEstructuraPlanillaCliente(datos) {
  if (!Array.isArray(datos) || datos.length < 5) return 'La planilla debe incluir metadatos, encabezados y al menos una fila de contrato.';

  for (var i = 0; i < _METADATOS_PLANILLA_OFICIAL.length; i++) {
    if (_normalizarEtiquetaPlanillaCliente(datos[i] && datos[i][0]) !== _normalizarEtiquetaPlanillaCliente(_METADATOS_PLANILLA_OFICIAL[i])) {
      return 'Fila ' + (i + 1) + ': se esperaba "' + _METADATOS_PLANILLA_OFICIAL[i] + '" en la columna A.';
    }
    if (!String(datos[i][1] || '').trim()) return 'Fila ' + (i + 1) + ': falta el valor de "' + _METADATOS_PLANILLA_OFICIAL[i] + '" en la columna B.';
  }

  var titulos = datos[3] || [];
  for (var j = 0; j < _ENCABEZADOS_PLANILLA_OFICIAL.length; j++) {
    if (_normalizarEtiquetaPlanillaCliente(titulos[j]) !== _normalizarEtiquetaPlanillaCliente(_ENCABEZADOS_PLANILLA_OFICIAL[j])) {
      return 'Columna ' + (j + 1) + ': se esperaba "' + _ENCABEZADOS_PLANILLA_OFICIAL[j] + '" y se encontró "' + String(titulos[j] || '').trim() + '".';
    }
  }

  return titulos.length === _ENCABEZADOS_PLANILLA_OFICIAL.length
    ? ''
    : 'La fila de encabezados debe tener exactamente ' + _ENCABEZADOS_PLANILLA_OFICIAL.length + ' columnas; se encontraron ' + titulos.length + '.';
}

function _leerExcelRad(file) {
  if (!file) return;
  var info = document.getElementById('rad_excelInfo');
  var dropZone = document.getElementById('rad_dropZone');
  var dropLabel = document.getElementById('rad_dropLabel');
  _radExcelParseado = null;

  // Indicador animado para que no parezca congelado mientras lee/descarga.
  info.style.color = 'var(--color-primary-navy)';
  var puntos = 0;
  info.textContent = '⏳ Leyendo la planilla, un momento...';
  var animLector = setInterval(function() {
    puntos = (puntos + 1) % 4;
    info.textContent = '⏳ Leyendo la planilla, un momento' + Array(puntos + 1).join('.');
  }, 400);
  function _detenerAnim() { if (animLector) { clearInterval(animLector); animLector = null; } }

  _cargarLibreriaExcel().then(function() {
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var wb = XLSX.read(e.target.result, { type: 'array' });
        var datos = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
        _detenerAnim();
        var errorEstructura = _validarEstructuraPlanillaCliente(datos);
        if (errorEstructura) {
          info.textContent = '⚠️ Plantilla incorrecta: ' + errorEstructura;
          info.style.color = '#bd0f14';
          dropZone.style.borderColor = '#bd0f14';
          return;
        }
        var count = 0;
        for (var i = 4; i < datos.length; i++) { if (datos[i] && String(datos[i][9] || '').trim()) count++; }
        if (count === 0) {
          info.textContent = '⚠️ No se detectaron contratos. Verifica que la columna Nombre del Inquilino esté diligenciada.';
          info.style.color = '#bd0f14';
          dropZone.style.borderColor = '#bd0f14';
          return;
        }
        _radExcelParseado = datos;
        info.style.color = '#0d7a54';
        info.textContent = '✅ ' + count + ' contrato(s) detectado(s)';
        dropZone.style.borderColor = '#16A34A';
        dropZone.style.background = 'rgba(22,163,74,0.02)';
        dropLabel.textContent = file.name + ' ✓';
      } catch (err) { _detenerAnim(); info.textContent = '⚠️ No se pudo leer'; info.style.color = '#bd0f14'; }
    };
    reader.onerror = function() { _detenerAnim(); info.textContent = '⚠️ No se pudo leer el archivo'; info.style.color = '#bd0f14'; };
    reader.readAsArrayBuffer(file);
  }).catch(function(err) {
    _detenerAnim();
    info.textContent = '⚠️ ' + err.message;
    info.style.color = '#bd0f14';
  });
}

function _procesarRadicacion() {
  var poliza = (document.getElementById('rad_poliza').value || '').trim();
  var tasa = (document.getElementById('rad_tasa').value || '').trim();
  var fileExcel = document.getElementById('rad_fileExcel').files[0];
  var radios = document.querySelectorAll('input[name="rad_tipoPS"]');
  var tipoPS = ''; for (var r = 0; r < radios.length; r++) { if (radios[r].checked) tipoPS = radios[r].value; }
  var filePdf = document.getElementById('rad_filePdf') ? document.getElementById('rad_filePdf').files[0] : null;

  if (!poliza || !tasa) { _toast('Completa póliza y tasa.', 'warning'); return; }
  if (!fileExcel || !_radExcelParseado) { _toast('Carga la planilla Excel.', 'warning'); return; }
  if (!tipoPS) { _toast('Selecciona una opción de paz y salvo.', 'warning'); return; }
  if (tipoPS === 'adjunto' && !filePdf) { _toast('Adjunta el PDF de paz y salvo.', 'warning'); return; }

  // Pre-validación frontend (mismas reglas que el servidor, feedback instantáneo)
  var erroresFront = _preValidarExcel(_radExcelParseado);
  if (erroresFront.length > 0) {
    _mostrarErroresRadicacion(erroresFront, null);
    return;
  }

  var btn = document.getElementById('rad_btnEnviar');
  btn.disabled = true; btn.textContent = '⏳ Procesando...';

  // Mostrar modal de progreso
  _mostrarModalProgreso();

  _archivoABase64(fileExcel).then(function(excelObj) {
    _avanzarProgreso(1);
    var pdfPromise = (tipoPS === 'adjunto' && filePdf) ? _archivoABase64(filePdf) : Promise.resolve(null);
    return pdfPromise.then(function(pdfObj) {
      _avanzarProgreso(2);
      var formData = {
        poliza: poliza, tasaNegociacion: tasa, observaciones: document.getElementById('rad_observaciones').value,
        excel: excelObj, excelParseado: _radExcelParseado,
        tipoPazYSalvo: tipoPS, pazYSalvoPdf: pdfObj
      };
      _avanzarProgreso(3);
      return callServer('motorDeAuditoria', formData);
    });
  }).then(function(res) {
    _avanzarProgreso(5);
    setTimeout(function() {
      _cerrarModalProgreso();
      btn.disabled = false; btn.textContent = '⚡ Revisar y enviar a radicación';

      if (res.status === 'OK') {
        // Limpiar borrador
        localStorage.removeItem('borradorRadNuevo');
        // Mostrar éxito
        var cont = document.getElementById('viewDashboard');
        cont.innerHTML = '<div class="stack"><div class="card card--flat" style="text-align:center;padding:var(--spacing-2xl);">'
          + '<div style="font-size:3rem;margin-bottom:var(--spacing-md);">🎉</div>'
          + '<h2>¡Lote radicado con éxito!</h2>'
          + '<p style="color:var(--color-mono-500);">Tu lote fue recibido y será procesado por el equipo de inducciones.</p>'
          + '<div style="background:rgba(13,122,84,0.05);border:2px dashed #0d7a54;border-radius:var(--radius-md);padding:20px;margin:16px auto;max-width:300px;">'
          + '<small style="color:var(--color-mono-500);text-transform:uppercase;letter-spacing:1px;">ID de Lote</small><br>'
          + '<strong style="font-family:var(--font-mono);font-size:var(--text-xl);color:#0d7a54;">' + res.idLote + '</strong></div>'
          + '<p style="font-size:var(--text-sm);color:var(--color-mono-500);">Guarda este ID para consultar el estado en cualquier momento.</p>'
          + '<button class="btn btn--primary" style="margin-top:16px;" onclick="navegarA(\'dashboard\')">Finalizar</button>'
          + '</div></div>';
      } else {
        _mostrarErroresRadicacion(res.detalles || [], res.archivoMarcado);
      }
    }, 400);
  }).catch(function(err) {
    _cerrarModalProgreso();
    btn.disabled = false; btn.textContent = '⚡ Revisar y enviar a radicación';
    _toast('Error: ' + (err.message || err), 'error');
  });

  // Guardar borrador
  _guardarBorradorRad();
}

function _guardarBorradorRad() {
  var data = {
    poliza: document.getElementById('rad_poliza').value,
    tasa: document.getElementById('rad_tasa').value,
    observaciones: document.getElementById('rad_observaciones').value,
    tipoPS: document.querySelector('input[name="rad_tipoPS"]:checked') ? document.querySelector('input[name="rad_tipoPS"]:checked').value : ''
  };
  localStorage.setItem('borradorRadNuevo', JSON.stringify(data));
}

function _restaurarBorradorRad() {
  var saved = localStorage.getItem('borradorRadNuevo');
  if (!saved) return;
  var data = JSON.parse(saved);
  var p = document.getElementById('rad_poliza');
  var t = document.getElementById('rad_tasa');
  var o = document.getElementById('rad_observaciones');
  if (p && data.poliza) p.value = data.poliza;
  if (t && data.tasa) t.value = data.tasa;
  if (o && data.observaciones) o.value = data.observaciones;
  if (data.tipoPS === 'checkbox') _selPS('A');
  if (data.tipoPS === 'adjunto') _selPS('B');
}

// Heurística local de Destino — réplica de validarDestino() del backend
// (Codigo.js). Atrapa genéricos y relleno al instante, sin llamar al servidor.
// La validación semántica con IA sigue siendo del servidor al radicar.
var _DESTINOS_INVALIDOS_LOCAL = {
  // Genéricos del negocio
  "COMERCIAL":1,"LOCAL":1,"COMERCIO":1,"ARRIENDO":1,"ALQUILAR":1,"ALQUILER":1,
  "INMUEBLE":1,"PROPIEDAD":1,"BIEN INMUEBLE":1,"USO MIXTO":1,"MIXTO":1,
  "LOCAL COMERCIAL":1,"LOCALES COMERCIALES":1,"USO COMERCIAL":1,"ESTABLECIMIENTO COMERCIAL":1,
  "ESTABLECIMIENTO":1,"NEGOCIO":1,"OFICINA":1,"OFICINAS":1,"BODEGA":1,"BODEGAS":1,
  "LOCAL O BODEGA":1,"APARTAMENTO":1,"APTO":1,"CASA":1,
  // Evasivas comunes
  "N/A":1,"NA":1,"N.A":1,"N.A.":1,"NO APLICA":1,"NO APLICA.":1,
  "SIN INFORMACION":1,"SIN INFORMACIÓN":1,"SIN INFO":1,"S/I":1,"S.I":1,
  "NINGUNO":1,"NINGUNA":1,"NULL":1,"NULO":1,"NULA":1,"ND":1,"NO DISPONIBLE":1,
  "NO TIENE":1,"DESCONOCIDO":1,"OTRO":1,"OTROS":1,"VARIOS":1,
  // Ruido
  "-":1,"--":1,"---":1,".":1,"..":1,"...":1,"_":1,"__":1,"?":1,"??":1,"0":1,"00":1
};

// Celular colombiano valido. Replica validarCelular() del backend (Codigo.js).
// El mensaje al usuario es intencionalmente generico: NO revela el patron
// esperado (largo/prefijo) para no facilitar numeros fabricados (anti-fraude).
function _validarCelularLocal(valor) {
  var raw = String(valor == null ? '' : valor).trim().replace(/[\s-]/g, '').replace(/^(\+?57)/, '');
  if (!raw) return null; // vacio lo maneja la regla de "al menos uno"
  if (!/^3\d{9}$/.test(raw)) {
    return 'El número de celular no es válido. Verifícalo e intenta de nuevo.';
  }
  return null;
}

// Correo con formato basico. Replica validarCorreo() del backend.
function _validarCorreoLocal(valor) {
  var raw = String(valor == null ? '' : valor).trim();
  if (!raw) return null;
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(raw)) {
    return 'El correo no tiene un formato válido. Verifícalo e intenta de nuevo.';
  }
  return null;
}

function _validarDestinoLocal(valor) {
  var raw = String(valor == null ? '' : valor).trim();
  var upper = raw.toUpperCase().replace(/\s+/g, ' ');

  if (!upper) return 'El campo Destino es obligatorio.';

  if (_DESTINOS_INVALIDOS_LOCAL[upper])
    return '"' + raw + '" no describe un uso real del inmueble. Especifique (ej: Peluquería, Restaurante, Vivienda familiar).';

  if (!/[a-záéíóúüñA-ZÁÉÍÓÚÜÑ]/.test(raw))
    return '"' + raw + '" no contiene texto válido.';

  var soloLetras = raw.replace(/[^a-záéíóúüñA-ZÁÉÍÓÚÜÑ]/g, '');
  if (soloLetras.length < 4)
    return '"' + raw + '" es demasiado corto para describir un destino.';

  var palabras = raw.split(/\s+/);
  var palabraMaxima = 0;
  for (var p = 0; p < palabras.length; p++) {
    var len = palabras[p].replace(/[^a-záéíóúüñA-ZÁÉÍÓÚÜÑ]/gi, '').length;
    if (len > palabraMaxima) palabraMaxima = len;
  }
  if (palabraMaxima < 3)
    return '"' + raw + '" no contiene palabras reconocibles como destino.';

  if (/^(.)\1{3,}$/.test(raw.replace(/\s/g, '')))
    return '"' + raw + '" parece un valor de relleno.';

  return null; // válido a nivel heurístico
}

// ── Pre-validación frontend ──
function _preValidarExcel(data) {
  var errores = [];
  if (!data || data.length < 5) return errores;
  var titulos = data[3] || [];
  var mapaLlaves = {};

  for (var i = 4; i < data.length; i++) {
    var fila = data[i];
    var nF = i + 1;
    var inq = String(fila[9] || '').trim();
    if (!inq) continue;

    // Campos obligatorios
    [1,2,4,5,6,9,10,11].forEach(function(idx) {
      if (!String(fila[idx] || '').trim()) {
        errores.push({ fila: nF, col: idx + 1, campo: String(titulos[idx] || 'Col '+(idx+1)), motivo: 'Dato faltante.' });
      }
    });

    // Celular o correo (se marcan ambas celdas: celular col 13, correo col 14)
    var cel = String(fila[12] || '').trim().replace(/[\s-]/g, '');
    var cor = String(fila[13] || '').trim();
    if (!cel && !cor) {
      errores.push({ fila: nF, col: 13, campo: 'Celular / Correo (INQ)', motivo: 'Debe diligenciar al menos uno.' });
      errores.push({ fila: nF, col: 14, campo: 'Celular / Correo (INQ)', motivo: 'Debe diligenciar al menos uno.' });
    } else {
      // Validar formato: el celular debe ser un movil, no un fijo.
      var motivoCel = _validarCelularLocal(cel);
      if (motivoCel) errores.push({ fila: nF, col: 13, campo: 'Celular (INQ)', motivo: motivoCel });

      var motivoCor = _validarCorreoLocal(cor);
      if (motivoCor) errores.push({ fila: nF, col: 14, campo: 'Correo Electrónico (INQ)', motivo: motivoCor });
    }

    // Destino — heurística local (los genéricos como "Local comercial" se
    // atrapan al instante; la IA hace el juicio semántico final en el servidor).
    var motivoDestino = _validarDestinoLocal(fila[3]);
    if (motivoDestino) {
      errores.push({ fila: nF, col: 4, campo: 'Destino', motivo: motivoDestino });
    }

    // Codeudores (COA 1 al 5). Mismos índices que el backend (Codigo.js).
    // Solo se valida el COA si tiene nombre diligenciado.
    var coaSlots = [
      { nombre: 14, cel: 17, correo: 18, label: 'COA 1' },
      { nombre: 19, cel: 22, correo: 23, label: 'COA 2' },
      { nombre: 24, cel: 27, correo: 28, label: 'COA 3' },
      { nombre: 29, cel: 32, correo: 33, label: 'COA 4' },
      { nombre: 34, cel: 37, correo: 38, label: 'COA 5' }
    ];
    coaSlots.forEach(function(coa) {
      var nombreCoa = String(fila[coa.nombre] || '').trim();
      if (!nombreCoa) return; // COA vacío no se valida

      var celCoa = String(fila[coa.cel] || '').trim().replace(/[\s-]/g, '');
      var corCoa = String(fila[coa.correo] || '').trim();

      if (!celCoa && !corCoa) {
        errores.push({ fila: nF, col: coa.cel + 1, campo: 'Celular / Correo (' + coa.label + ')', motivo: 'Debe diligenciar al menos el Celular o el Correo de ' + coa.label + '.' });
        errores.push({ fila: nF, col: coa.correo + 1, campo: 'Celular / Correo (' + coa.label + ')', motivo: 'Debe diligenciar al menos el Celular o el Correo de ' + coa.label + '.' });
      } else {
        var motivoCelCoa = _validarCelularLocal(celCoa);
        if (motivoCelCoa) errores.push({ fila: nF, col: coa.cel + 1, campo: 'Celular (' + coa.label + ')', motivo: motivoCelCoa });

        var motivoCorCoa = _validarCorreoLocal(corCoa);
        if (motivoCorCoa) errores.push({ fila: nF, col: coa.correo + 1, campo: 'Correo (' + coa.label + ')', motivo: motivoCorCoa });
      }
    });

    // Duplicados verticales (no apunta a una sola celda → sin col)
    var llave = (String(fila[11] || '').trim() + '|' + String(fila[5] || '').trim()).toUpperCase();
    if (mapaLlaves[llave]) {
      errores.push({ fila: nF, campo: 'DUPLICADO', motivo: 'Contrato repetido (ver fila ' + mapaLlaves[llave] + ').' });
    } else { mapaLlaves[llave] = nF; }
  }
  return errores;
}

  if (archivoMarcado && archivoMarcado.base64) {
    // CTA destacado: se invita a reutilizar la MISMA planilla marcada.
    // Las celdas a corregir vienen resaltadas en rojo, así el comercial

      + '<p style="margin:0 0 4px;font-weight:700;color:var(--color-primary-red);font-size:var(--text-sm);">Corrige más rápido sobre tu misma planilla</p>'

      + '</div>'
      + '<button type="button" onclick="_descargarMarcado()" onmouseover="this.style.background=\'#9b0c10\'" onmouseout="this.style.background=\'#bd0f14\'" style="padding:10px 18px;font-size:0.85rem;font-weight:700;white-space:nowrap;border:none;border-radius:10px;cursor:pointer;background:#bd0f14;color:#fff;box-shadow:0 2px 8px rgba(189,15,20,0.25);">📥 Descargar planilla marcada</button>'
      + '</div></div>';
  }

  // Opción recomendada: corregir sobre la misma página, sin descargar ni resubir.
  html += '<div style="background:#F0F7FF;border:1px solid #C7E0FF;border-radius:10px;padding:14px 16px;margin-bottom:16px;">'
    + '<div style="display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;">'
    + '<div style="flex:1;min-width:220px;">'
    + '<p style="margin:0 0 4px;font-weight:700;color:#0B5FA5;font-size:0.85rem;">Corrige aquí mismo, sin descargar nada</p>'
    + '<p style="margin:0;font-size:0.85rem;color:#524f4f;line-height:1.5;">Edita las celdas marcadas directamente en la página, con el nombre del inquilino a la vista, y vuelve a validar al instante.</p>'
    + '</div>'
    + '<button type="button" onclick="_abrirEditorPlanilla()" onmouseover="this.style.background=\'#1a2540\'" onmouseout="this.style.background=\'#253150\'" style="padding:10px 18px;font-size:0.85rem;font-weight:700;white-space:nowrap;border:none;border-radius:10px;cursor:pointer;background:#253150;color:#fff;box-shadow:0 2px 8px rgba(37,49,80,0.25);">✏️ Corregir en la página</button>'
    + '</div></div>';

  html += '<table class="table"><thead><tr><th>Fila</th><th>Campo</th><th>Observación</th></tr></thead><tbody>';
  for (var i = 0; i < errores.length; i++) {
    var e = errores[i];
    html += '<tr><td style="text-align:center;">' + (e.fila || '-') + '</td><td><strong>' + (e.campo || '') + '</strong></td><td>' + (e.motivo || '') + '</td></tr>';
  }
  html += '</tbody></table></div>';

  panel.innerHTML = html;
  panel.style.display = 'block';
  panel.scrollIntoView({ behavior: 'smooth' });

  // Guardar referencia al archivo marcado para descarga
  if (archivoMarcado) window._archivoMarcadoActual = archivoMarcado;

  // Guardar los errores actuales para el editor en página.
  window._erroresActuales = errores || [];
}

function _descargarMarcado() {
  var am = window._archivoMarcadoActual;
  if (!am || !am.base64) return;
  var byteChars = atob(am.base64);
  var byteNums = new Array(byteChars.length);
  for (var i = 0; i < byteChars.length; i++) byteNums[i] = byteChars.charCodeAt(i);
  var blob = new Blob([new Uint8Array(byteNums)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = am.nombre || 'Ajustes_Requeridos.xlsx';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Escapa texto para insertarlo con seguridad en HTML (atributos y contenido).
function _escHtml(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// Abre un modal con las filas que tienen errores, mostrando el inquilino e
// identificación como contexto y una celda editable por cada campo con error.
// Los cambios se escriben directamente en _radExcelParseado (datos en memoria),
// así el comercial corrige y revalida sin descargar ni volver a subir el Excel.
function _abrirEditorPlanilla() {
  var data = _radExcelParseado;
  if (!data || data.length < 5) { _toast('No hay planilla cargada para editar.', 'warning'); return; }

  var errores = (window._erroresActuales || []).filter(function(e) {
    return typeof e.fila === 'number' && typeof e.col === 'number';
  });

  // Errores que no apuntan a una celda concreta (duplicado de contrato, etc.):
  // no se pueden editar con un input, se listan aparte como aviso.
  var erroresNoEditables = (window._erroresActuales || []).filter(function(e) {
    return typeof e.fila !== 'number' || typeof e.col !== 'number';
  });

  if (errores.length === 0) {
    _toast('Estos ajustes no se pueden corregir en la tabla; usa la planilla marcada.', 'warning');
    return;
  }

  var titulos = data[3] || [];

  // Agrupar errores por fila para mostrar un contrato por bloque.
  var porFila = {};
  errores.forEach(function(e) {
    if (!porFila[e.fila]) porFila[e.fila] = [];
    porFila[e.fila].push(e);
  });

  var totalCampos = errores.length;
  var totalContratos = Object.keys(porFila).length;

  // Devuelve un ícono segun el tipo de campo, para lectura rapida.
  function _iconoCampo(campo) {
    var c = String(campo || '').toLowerCase();
    if (c.indexOf('celular') >= 0 || c.indexOf('telefono') >= 0 || c.indexOf('teléfono') >= 0) return '📱';
    if (c.indexOf('correo') >= 0 || c.indexOf('email') >= 0) return '✉️';
    if (c.indexOf('destino') >= 0) return '🏠';
    if (c.indexOf('canon') >= 0 || c.indexOf('iva') >= 0 || c.indexOf('admin') >= 0) return '💲';
    return '📝';
  }

  // Iniciales del inquilino para el avatar.
  function _iniciales(nombre) {
    var partes = String(nombre || '').trim().split(/\s+/).filter(Boolean);
    if (partes.length === 0) return '?';
    if (partes.length === 1) return partes[0].charAt(0).toUpperCase();
    return (partes[0].charAt(0) + partes[partes.length - 1].charAt(0)).toUpperCase();
  }

  var html = '<div class="modal-content" style="max-width:560px;display:flex;flex-direction:column;max-height:90vh;overflow:hidden;border-radius:18px;">'
    // ── Header con gradiente de marca ──
    + '<div style="flex-shrink:0;padding:22px 24px 20px;background:linear-gradient(120deg,#253150 0%,#3a2b52 55%,#bd0f14 160%);color:#fff;position:relative;">'
    + '<button type="button" onclick="_cerrarEditorPlanilla()" aria-label="Cerrar" style="position:absolute;top:16px;right:16px;width:30px;height:30px;border:none;border-radius:50%;background:rgba(255,255,255,0.18);color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;">✕</button>'
    + '<div style="display:flex;align-items:center;gap:12px;padding-right:36px;">'
    + '<div style="width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,0.16);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;">✏️</div>'
    + '<div style="min-width:0;">'
    + '<h3 style="margin:0;color:#fff;font-size:1.2rem;font-weight:700;line-height:1.2;">Corregir planilla</h3>'
    + '<p style="margin:3px 0 0;color:rgba(255,255,255,0.82);font-size:0.8rem;line-height:1.4;">' + totalCampos + ' campo(s) por ajustar en ' + totalContratos + ' contrato(s)</p>'
    + '</div>'
    + '</div>'
    + '</div>'
    // ── Cuerpo scrollable ──
    + '<div style="background:#f4f5f8;overflow-y:auto;flex:1;padding:18px 20px;">';

  Object.keys(porFila).forEach(function(filaStr) {
    var filaNum = parseInt(filaStr, 10);
    var idx = filaNum - 1; // índice base-0 en el array
    var fila = data[idx] || [];
    var inquilino = String(fila[9] || '').trim() || '(sin nombre)';
    var identificacion = String(fila[11] || '').trim() || 'sin ID';
    var camposFila = porFila[filaStr].length;

    html += '<div style="background:#fff;border:1px solid #e8e6e7;border-radius:14px;padding:0;margin-bottom:16px;box-shadow:0 1px 4px rgba(37,49,80,0.07);overflow:hidden;">'
      // Cabecera de la tarjeta (inquilino)

      + '<div style="width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#253150,#3a4d7a);color:#fff;display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:700;flex-shrink:0;">' + _escHtml(_iniciales(inquilino)) + '</div>'
      + '<div style="min-width:0;flex:1;">'

      + '<div style="font-size:0.72rem;color:#8a8888;margin-top:1px;">Fila ' + filaNum + ' · ID ' + _escHtml(identificacion) + '</div>'
      + '</div>'

      + '</div>'
      // Campos
      + '<div style="padding:16px;">';

    porFila[filaStr].forEach(function(e, i) {
      var colIdx = e.col - 1; // índice base-0 de la columna

      var valorActual = String(fila[colIdx] == null ? '' : fila[colIdx]);
      var inputId = 'edit_' + filaNum + '_' + e.col;

      html += '<div style="margin-bottom:' + marginBottom + ';">'

        + '<span style="font-size:0.9rem;">' + _iconoCampo(titulo) + '</span>' + _escHtml(titulo)
        + '</label>'
        + '<input id="' + inputId + '" data-fila="' + filaNum + '" data-col="' + e.col + '" value="' + _escHtml(valorActual) + '" autocomplete="off" '

        + '<div style="display:flex;align-items:flex-start;gap:6px;margin-top:7px;background:rgba(189,15,20,0.05);border-radius:8px;padding:7px 10px;">'
        + '<span style="font-size:0.78rem;flex-shrink:0;line-height:1.3;">⚠️</span>'
        + '<span style="color:#a1161b;font-size:0.75rem;line-height:1.4;">' + _escHtml(e.motivo || '') + '</span>'
        + '</div>'
        + '</div>';
    });

    html += '</div></div>';
  });

  if (erroresNoEditables.length > 0) {
    html += '<div style="background:#FFF8E1;border:1px solid #FFE082;border-radius:12px;padding:13px 15px;margin-bottom:4px;">'
      + '<p style="margin:0 0 6px;font-weight:700;font-size:0.8rem;color:#8A6D00;display:flex;align-items:center;gap:6px;"><span>ℹ️</span>Resuelve estos ajustes en la planilla original:</p>';
    erroresNoEditables.forEach(function(e) {
      html += '<p style="margin:0 0 2px;font-size:0.78rem;color:#6b5d1f;line-height:1.4;">• Fila ' + _escHtml(e.fila) + ' — ' + _escHtml(e.motivo || '') + '</p>';
    });
    html += '</div>';
  }

  html += '</div>'
    // ── Footer ──
    + '<div style="flex-shrink:0;display:flex;gap:10px;justify-content:flex-end;align-items:center;padding:14px 20px;background:#fff;border-top:1px solid #eef0f3;">'
    + '<button type="button" onclick="_cerrarEditorPlanilla()" onmouseover="this.style.background=\'#f4f5f8\'" onmouseout="this.style.background=\'#fff\'" style="padding:10px 18px;font-size:0.85rem;font-weight:600;border:1.5px solid #d5d3d4;border-radius:10px;cursor:pointer;background:#fff;color:#403f3f;transition:background .15s;">Cancelar</button>'
    + '<button type="button" onclick="_aplicarCorreccionesYValidar()" onmouseover="this.style.background=\'#1a2540\'" onmouseout="this.style.background=\'#253150\'" style="padding:10px 20px;font-size:0.85rem;font-weight:700;border:none;border-radius:10px;cursor:pointer;background:#253150;color:#fff;box-shadow:0 2px 10px rgba(37,49,80,0.28);transition:background .15s;">✓ Aplicar y validar</button>'
    + '</div></div>';

  var modal = document.createElement('div');
  modal.id = 'modalEditorPlanilla';
  modal.className = 'modal-overlay';
  modal.innerHTML = html;
  modal.addEventListener('click', function(ev) { if (ev.target === modal) _cerrarEditorPlanilla(); });
  document.body.appendChild(modal);
}

function _cerrarEditorPlanilla() {
  var m = document.getElementById('modalEditorPlanilla');
  if (m) m.remove();
}

// Vuelca los valores editados a _radExcelParseado y revalida.
function _aplicarCorreccionesYValidar() {
  var data = _radExcelParseado;
  if (!data) { _cerrarEditorPlanilla(); return; }

  var inputs = document.querySelectorAll('#modalEditorPlanilla input[data-fila]');
  for (var i = 0; i < inputs.length; i++) {
    var inp = inputs[i];
    var filaNum = parseInt(inp.getAttribute('data-fila'), 10);
    var colNum = parseInt(inp.getAttribute('data-col'), 10);
    var idxFila = filaNum - 1;
    var idxCol = colNum - 1;
    if (!data[idxFila]) continue;
    data[idxFila][idxCol] = inp.value.trim();
  }

  _cerrarEditorPlanilla();

  // Revalidar en el frontend con las mismas reglas rápidas.
  var erroresRestantes = _preValidarExcel(data);
  if (erroresRestantes.length > 0) {
    _mostrarErroresRadicacion(erroresRestantes, null);
    _toast('Quedan ' + erroresRestantes.length + ' ajuste(s) por corregir.', 'warning');
    return;
  }

  // Sin errores rápidos: se limpia el panel. La validación completa (incluida
  // la de destino) se hace en el servidor al enviar a radicación.
  var panel = document.getElementById('rad_errores');
  if (panel) { panel.style.display = 'none'; panel.innerHTML = ''; }
  _toast('Correcciones aplicadas. Ya puedes enviar a radicación.', 'success');
}

function mostrarVistaEnConstruccion(seccion) {
  var container = document.getElementById('viewDashboard');
  container.innerHTML = '<div class="stack">'
    + '<div class="card" style="text-align:center; padding:var(--spacing-2xl);">'
    + '<div style="font-size:2.5rem; margin-bottom:var(--spacing-md);">🚧</div>'
    + '<h3>' + seccion + '</h3>'
    + '<p>Esta sección está en construcción.</p>'
    + '</div></div>';
  mostrarVista('viewDashboard');
}

function _urlLegacy() {
  // URL sin ?v=2 → va al frontend actual
  return window.location.href.split('?')[0];
}

function _mostrarError(mensaje) {
  var container = document.getElementById('viewDashboard');
  container.innerHTML = '<div class="card" style="border-left:4px solid var(--color-primary-red); padding:var(--spacing-lg);">'
    + '<p style="margin:0;">' + mensaje + '</p>'
    + '</div>';
  mostrarVista('viewDashboard');
}

// Iniciar la app
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', inicializarApp);
} else {
  inicializarApp();
}
</script>
