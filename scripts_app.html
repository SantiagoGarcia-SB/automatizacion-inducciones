function _leerExcelRad(file) {
  if (!file) return;
  var info = document.getElementById('rad_excelInfo');
  var dropZone = document.getElementById('rad_dropZone');
  var dropLabel = document.getElementById('rad_dropLabel');
  _radExcelParseado = null;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var wb = XLSX.read(e.target.result, { type: 'array' });
      var datos = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
      if (datos.length >= 4 && String(datos[3][2] || '').trim().toUpperCase() !== 'AMPARO INTEGRAL') {
        info.textContent = '⚠️ Plantilla incorrecta'; info.style.color = '#bd0f14';
        dropZone.style.borderColor = '#bd0f14'; return;
      }
      _radExcelParseado = datos;
      var count = 0;
      for (var i = 4; i < datos.length; i++) { if (datos[i] && String(datos[i][9] || '').trim()) count++; }
      info.style.color = '#0d7a54';
      info.textContent = '✅ ' + count + ' contrato(s) detectado(s)';
      dropZone.style.borderColor = '#16A34A';
      dropZone.style.background = 'rgba(22,163,74,0.02)';
      dropLabel.textContent = file.name + ' ✓';
    } catch (err) { info.textContent = '⚠️ No se pudo leer'; info.style.color = '#bd0f14'; }
  };
  reader.readAsArrayBuffer(file);
}

function _procesarRadicacion() {
  var poliza = (document.getElementById('rad_poliza').value || '').trim();
  var tasa = (document.getElementById('rad_tasa').value || '').trim();
  var fileExcel = document.getElementById('rad_fileExcel').files[0];
  var radios = document.querySelectorAll('input[name="rad_tipoPS"]');
  var tipoPS = ''; for (var r = 0; r < radios.length; r++) { if (radios[r].checked) tipoPS = radios[r].value; }
  var filePdf = document.getElementById('rad_filePdf') ? document.getElementById('rad_filePdf').files[0] : null;

  if (!poliza || !tasa) { _toast('Completa póliza y tasa.', 'warning'); return; }
  if (!fileExcel || !_radExcelParseado) { _toast('Carga la planilla Excel.', 'warning'); return; }
  if (!tipoPS) { _toast('Selecciona una opción de paz y salvo.', 'warning'); return; }
  if (tipoPS === 'adjunto' && !filePdf) { _toast('Adjunta el PDF de paz y salvo.', 'warning'); return; }

  // Pre-validación frontend (mismas reglas que el servidor, feedback instantáneo)
  var erroresFront = _preValidarExcel(_radExcelParseado);
  if (erroresFront.length > 0) {
    _mostrarErroresRadicacion(erroresFront, null);
    return;
  }

  var btn = document.getElementById('rad_btnEnviar');
  btn.disabled = true; btn.textContent = '⏳ Procesando...';

  // Mostrar modal de progreso
  _mostrarModalProgreso();

  _archivoABase64(fileExcel).then(function(excelObj) {
    _avanzarProgreso(1);
    var pdfPromise = (tipoPS === 'adjunto' && filePdf) ? _archivoABase64(filePdf) : Promise.resolve(null);
    return pdfPromise.then(function(pdfObj) {
      _avanzarProgreso(2);
      var formData = {
        poliza: poliza, tasaNegociacion: tasa, observaciones: document.getElementById('rad_observaciones').value,
        excel: excelObj, excelParseado: _radExcelParseado,
        tipoPazYSalvo: tipoPS, pazYSalvoPdf: pdfObj
      };
      _avanzarProgreso(3);
      return callServer('motorDeAuditoria', formData);
    });
  }).then(function(res) {
    _avanzarProgreso(5);
    setTimeout(function() {
      _cerrarModalProgreso();
      btn.disabled = false; btn.textContent = '⚡ Revisar y enviar a radicación';

      if (res.status === 'OK') {
        // Limpiar borrador
        localStorage.removeItem('borradorRadNuevo');
        // Mostrar éxito
        var cont = document.getElementById('viewDashboard');
        cont.innerHTML = '<div class="stack"><div class="card card--flat" style="text-align:center;padding:var(--spacing-2xl);">'
          + '<div style="font-size:3rem;margin-bottom:var(--spacing-md);">🎉</div>'
          + '<h2>¡Lote radicado con éxito!</h2>'
          + '<p style="color:var(--color-mono-500);">Tu lote fue recibido y será procesado por el equipo de inducciones.</p>'
          + '<div style="background:rgba(13,122,84,0.05);border:2px dashed #0d7a54;border-radius:var(--radius-md);padding:20px;margin:16px auto;max-width:300px;">'
          + '<small style="color:var(--color-mono-500);text-transform:uppercase;letter-spacing:1px;">ID de Lote</small><br>'
          + '<strong style="font-family:var(--font-mono);font-size:var(--text-xl);color:#0d7a54;">' + res.idLote + '</strong></div>'
          + '<p style="font-size:var(--text-sm);color:var(--color-mono-500);">Guarda este ID para consultar el estado en cualquier momento.</p>'
          + '<button class="btn btn--primary" style="margin-top:16px;" onclick="navegarA(\'dashboard\')">Finalizar</button>'
          + '</div></div>';
      } else {
        _mostrarErroresRadicacion(res.detalles || [], res.archivoMarcado);
      }
    }, 400);

// ── Pre-validación frontend ──
function _preValidarExcel(data) {
  var errores = [];
  if (!data || data.length < 5) return errores;
  var titulos = data[3] || [];
  var mapaLlaves = {};

  for (var i = 4; i < data.length; i++) {
    var fila = data[i];
    var nF = i + 1;
    var inq = String(fila[9] || '').trim();
    if (!inq) continue;

    // Campos obligatorios
    [1,2,4,5,6,9,10,11].forEach(function(idx) {
      if (!String(fila[idx] || '').trim()) {
        errores.push({ fila: nF, campo: String(titulos[idx] || 'Col '+(idx+1)), motivo: 'Dato faltante.' });
      }
    });

    // Celular o correo
    var cel = String(fila[12] || '').trim().replace(/[\s-]/g, '');
    var cor = String(fila[13] || '').trim();
    if (!cel && !cor) {
      errores.push({ fila: nF, campo: 'Celular / Correo (INQ)', motivo: 'Debe diligenciar al menos uno.' });
    }

    // Duplicados verticales
    var llave = (String(fila[11] || '').trim() + '|' + String(fila[5] || '').trim()).toUpperCase();
    if (mapaLlaves[llave]) {
      errores.push({ fila: nF, campo: 'DUPLICADO', motivo: 'Contrato repetido (ver fila ' + mapaLlaves[llave] + ').' });
    } else { mapaLlaves[llave] = nF; }
  }
  return errores;
}

// ── Mostrar errores con descarga de archivo marcado ──
function _mostrarErroresRadicacion(errores, archivoMarcado) {
  var panel = document.getElementById('rad_errores');
  if (!panel) return;

  var html = '<div class="card card--flat" style="border-left:4px solid var(--color-primary-red);margin-top:16px;">'
    + '<div class="flex flex--between" style="align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px;">'
    + '<h4 style="color:var(--color-primary-red);margin:0;">⚠️ Ajustes necesarios (' + errores.length + ')</h4>';

  if (archivoMarcado && archivoMarcado.base64) {
    html += '<button class="btn btn--danger" style="padding:8px 14px;font-size:var(--text-sm);" onclick="_descargarMarcado()">📥 Descargar planilla con observaciones</button>';
  }

  html += '</div><table class="table"><thead><tr><th>Fila</th><th>Campo</th><th>Observación</th></tr></thead><tbody>';
  for (var i = 0; i < errores.length; i++) {
    var e = errores[i];
    html += '<tr><td style="text-align:center;">' + (e.fila || '-') + '</td><td><strong>' + (e.campo || '') + '</strong></td><td>' + (e.motivo || '') + '</td></tr>';
  }
  html += '</tbody></table></div>';

  panel.innerHTML = html;
  panel.style.display = 'block';
  panel.scrollIntoView({ behavior: 'smooth' });

  // Guardar referencia al archivo marcado para descarga
  if (archivoMarcado) window._archivoMarcadoActual = archivoMarcado;
}

function _descargarMarcado() {
  var am = window._archivoMarcadoActual;
  if (!am || !am.base64) return;
  var byteChars = atob(am.base64);
  var byteNums = new Array(byteChars.length);
  for (var i = 0; i < byteChars.length; i++) byteNums[i] = byteChars.charCodeAt(i);
  var blob = new Blob([new Uint8Array(byteNums)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = am.nombre || 'Ajustes_Requeridos.xlsx';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function mostrarVistaEnConstruccion(seccion) {
  var container = document.getElementById('viewDashboard');
  container.innerHTML = '<div class="stack">'
    + '<div class="card" style="text-align:center; padding:var(--spacing-2xl);">'
    + '<div style="font-size:2.5rem; margin-bottom:var(--spacing-md);">🚧</div>'
    + '<h3>' + seccion + '</h3>'
    + '<p>Esta sección está en construcción.</p>'
    + '</div></div>';
  mostrarVista('viewDashboard');
}

function _urlLegacy() {
  // URL sin ?v=2 → va al frontend actual
  return window.location.href.split('?')[0];
}

function _mostrarError(mensaje) {
  var container = document.getElementById('viewDashboard');
  container.innerHTML = '<div class="card" style="border-left:4px solid var(--color-primary-red); padding:var(--spacing-lg);">'
    + '<p style="margin:0;">' + mensaje + '</p>'
    + '</div>';
  mostrarVista('viewDashboard');
}

// Iniciar la app
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', inicializarApp);
} else {
  inicializarApp();
}
</script>
