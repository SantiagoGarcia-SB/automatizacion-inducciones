/** Datos del usuario logueado (se llenan al iniciar) */

/**
 * CacheManager — Almacén en memoria de sesión con invalidación selectiva.
 * Persiste SOLO durante la sesión del navegador (no usa localStorage).
 */
var CacheManager = {
  _store: {},
  _ttls: {
    'dashboard': 30000,
    'cola-auxiliar': 0,
    'mis-solicitudes': 0,
    'asignaciones': 0,
    'errores': 0,
    'lotes': 0,
    'solicitudes': 0,
    'usuarios': 0,
    'usuarios-dash': 0,
    'config-motivos': 0
  },

  get: function(key) {
    if (!this._store[key]) return null;
    var entry = this._store[key];
    var ttl = this._ttls[key] || 0;
    if (ttl > 0 && (Date.now() - entry.timestamp > ttl)) {
      delete this._store[key];
      return null;
    }
    return entry.data;
  },

  set: function(key, data) {
    this._store[key] = { data: data, timestamp: Date.now() };
  },

  invalidar: function(keys) {
    if (typeof keys === 'string') keys = [keys];
    for (var i = 0; i < keys.length; i++) {
      delete this._store[keys[i]];
    }
  },

  invalidarTodo: function() {
    this._store = {};
  },

  esValido: function(key) {
    return this.get(key) !== null;
  },

  /** Momento (Date.now()) en que se guardó el dato, o null si no hay entrada. */
  getTimestamp: function(key) {
    var entry = this._store[key];
    return entry ? entry.timestamp : null;
  }
};

/**
 * SkeletonSystem — Genera skeletons apropiados por tipo de contenido.
 *
 * Tipos:
 *   'tabla'      → thead real + N filas animadas
 *   'dashboard'  → 4 KPI placeholders + barra de distribución
 *   'detalle'    → formulario con campos placeholder
 *   'lista'      → N cards placeholder
 */
var SkeletonSystem = {
  /**
   * Genera y renderiza un skeleton en el contenedor dado.
   * @param {string} containerId — ID del div contenedor
   * @param {string} tipo — 'tabla' | 'dashboard' | 'lista' | 'detalle'
   * @param {Object} [opciones] — { columnas: string[], filas: number, campos: number, items: number, titulo: string }
   */
  mostrar: function(containerId, tipo, opciones) {
    var container = document.getElementById(containerId);
    if (!container) return;
    opciones = opciones || {};
    var html = '';

    switch (tipo) {
      case 'tabla':
        html = this._generarSkeletonTabla(opciones.columnas || [], opciones.filas || 5);
        break;
      case 'dashboard':
        html = this._generarSkeletonDashboard();
        break;
      case 'detalle':
        html = this._generarSkeletonDetalle(opciones.campos || 6);
        break;
      case 'lista':
        html = this._generarSkeletonLista(opciones.items || 4);
        break;
    }

    if (opciones.titulo) {
      html = '<div class="stack"><h2>' + opciones.titulo + '</h2>' + html + '</div>';
    }

    container.innerHTML = html;
  },

  /**
   * Transiciona suavemente del skeleton al contenido real.
   * @param {string} containerId
   * @param {string} htmlContenido
   */
  reemplazar: function(containerId, htmlContenido) {
    var container = document.getElementById(containerId);
    if (!container) return;
    container.style.opacity = '0';
    container.innerHTML = htmlContenido;
    requestAnimationFrame(function() {
      container.style.transition = 'opacity var(--duration-base, 200ms) var(--ease-in-out, ease-in)';
      container.style.opacity = '1';
    });
  },

  /**
   * Genera tabla con thead real (columnas con nombre) y filas animadas.
   */
  _generarSkeletonTabla: function(columnas, filas) {
    var html = '<div class="card card--flat" style="padding:0;overflow:hidden;"><table class="table"><thead><tr>';
    for (var c = 0; c < columnas.length; c++) {
      html += '<th>' + columnas[c] + '</th>';
    }
    // Si no hay columnas definidas, generar columnas placeholder
    if (columnas.length === 0) {
      for (var p = 0; p < 5; p++) {
        html += '<th><div class="skeleton-line" style="height:12px;width:60%;"></div></th>';
      }
    }
    html += '</tr></thead><tbody>';
    for (var i = 0; i < filas; i++) {
      var cols = columnas.length || 5;
      html += '<tr>';
      for (var j = 0; j < cols; j++) {
        var width = (j === 0) ? '70%' : ((j === cols - 1) ? '40%' : '55%');
        html += '<td><div class="skeleton-line" style="height:14px;width:' + width + ';"></div></td>';
      }
      html += '</tr>';
    }
    html += '</tbody></table></div>';
    return html;
  },

  /**
   * Genera 4 KPI cards placeholder + barra de distribución.
   */
  _generarSkeletonDashboard: function() {
    var html = '<div class="stack">';
    // Hero card placeholder
    html += '<div class="metric-hero-card metric-hero-azul" style="cursor:default;">'
      + '<div style="width:100%;">'
      + '<div class="skeleton-line" style="height:24px;width:50%;background:rgba(255,255,255,0.15);margin-bottom:var(--space-2);"></div>'
      + '<div class="skeleton-line" style="height:14px;width:35%;background:rgba(255,255,255,0.1);"></div>'
      + '</div></div>';
    // 4 KPI placeholders
    html += '<div class="grid grid--4" style="gap:var(--space-3);">';
    for (var i = 0; i < 4; i++) {
      html += '<div class="skeleton skeleton-card" style="height:88px;"></div>';
    }
    html += '</div>';
    // Distribution bar placeholder
    html += '<div class="card" style="padding:var(--space-5);">'
      + '<div class="skeleton-line" style="height:14px;width:40%;margin-bottom:var(--space-4);"></div>'
      + '<div class="skeleton-line" style="height:12px;width:100%;border-radius:var(--radius-full);"></div>'
      + '<div style="display:flex;gap:var(--space-4);margin-top:var(--space-3);">'
      + '<div class="skeleton-line" style="height:10px;width:60px;"></div>'
      + '<div class="skeleton-line" style="height:10px;width:80px;"></div>'
      + '<div class="skeleton-line" style="height:10px;width:50px;"></div>'
      + '</div></div>';
    html += '</div>';
    return html;
  },

  /**
   * Genera campos de formulario placeholder.
   */
  _generarSkeletonDetalle: function(campos) {
    var html = '<div class="card"><div class="stack stack--tight">';
    for (var i = 0; i < campos; i++) {
      // Alternar entre campos anchos y cortos para simular un form real
      var labelWidth = (i % 3 === 0) ? '25%' : ((i % 3 === 1) ? '35%' : '20%');
      var fieldWidth = (i % 2 === 0) ? '100%' : '70%';
      html += '<div style="margin-bottom:var(--space-4);">'
        + '<div class="skeleton-line" style="height:10px;width:' + labelWidth + ';margin-bottom:var(--space-2);"></div>'
        + '<div class="skeleton-line" style="height:36px;width:' + fieldWidth + ';"></div>'
        + '</div>';
    }
    html += '</div></div>';
    return html;
  },

  /**
   * Genera cards placeholder para vistas de lista.
   */
  _generarSkeletonLista: function(items) {
    var html = '<div class="stack stack--tight">';
    for (var i = 0; i < items; i++) {
      html += '<div class="card" style="padding:var(--space-4) var(--space-5);">'
        + '<div style="display:flex;align-items:center;gap:var(--space-4);">'
        + '<div class="skeleton-line" style="height:40px;width:40px;border-radius:var(--radius-sm);flex-shrink:0;"></div>'
        + '<div style="flex:1;">'
        + '<div class="skeleton-line" style="height:14px;width:' + (55 + (i % 3) * 10) + '%;margin-bottom:var(--space-2);"></div>'
        + '<div class="skeleton-line" style="height:11px;width:' + (35 + (i % 2) * 15) + '%;"></div>'
        + '</div>'
        + '<div class="skeleton-line" style="height:24px;width:60px;border-radius:var(--radius-full);"></div>'
        + '</div></div>';
    }
    html += '</div>';
    return html;
  }
};

/**
 * OptimisticUpdater — Ejecuta acciones con UI instantánea y rollback en fallo.
 *
 * Patrón:
 *   1. Guardar snapshot del estado en CacheManager
 *   2. Aplicar mutación local (optimista)
 *   3. Re-renderizar UI (instantáneo)
 *   4. Ejecutar callServer en background
 *   5a. Si OK → descartar snapshot, invalidar vistas relacionadas
 *   5b. Si FAIL/Timeout → restaurar snapshot, re-renderizar, toast error
 */
var OptimisticUpdater = {
  /**
   * Ejecuta una acción optimista con rollback automático.
   * @param {Object} config
   * @param {string} config.cacheKey — Clave del CacheManager a mutar
   * @param {function} config.mutacion — fn(datosActuales) → datosModificados
   * @param {function} config.render — fn() para re-renderizar la vista
   * @param {string} config.serverFn — Nombre de la función servidor
   * @param {Array} [config.serverArgs] — Argumentos para callServer
   * @param {string[]} [config.invalidarKeys] — Claves a invalidar post-éxito
   * @param {number} [config.timeout=10000] — Timeout en ms
   */
  ejecutar: function(config) {
    var cacheKey = config.cacheKey;
    var mutacion = config.mutacion;
    var render = config.render;
    var serverFn = config.serverFn;
    var serverArgs = config.serverArgs || [];
    var invalidarKeys = config.invalidarKeys || [];
    var timeout = config.timeout || 10000;

    // 1. Snapshot del estado actual
    var datosActuales = CacheManager.get(cacheKey);
    var snapshot = JSON.parse(JSON.stringify(datosActuales || []));

    // 2. Mutación local optimista
    var datosMutados = mutacion(datosActuales);
    CacheManager.set(cacheKey, datosMutados);

    // 3. Render instantáneo
    render();

    // 4. Capturar sección activa al momento de la acción
    var seccionAlMomento = _seccionActiva;

    // 5. Timer de timeout
    var timedOut = false;
    var timeoutId = setTimeout(function() {
      timedOut = true;
      // Rollback por timeout
      CacheManager.set(cacheKey, snapshot);
      if (_seccionActiva === seccionAlMomento) {
        render();
      }
      _toast('La conexión está lenta. Verifica tu internet.', 'warning');
    }, timeout);

    // 6. Llamar al servidor (spread args para compatibilidad con callServer)
    var callArgs = [serverFn].concat(serverArgs);
    callServer.apply(null, callArgs)
      .then(function(res) {
        clearTimeout(timeoutId);
        if (timedOut) return; // Ya se hizo rollback por timeout

        if (res && res.ok) {
          // Éxito: invalidar claves relacionadas
          if (invalidarKeys.length > 0) {
            CacheManager.invalidar(invalidarKeys);
          }
        } else {
          // Fallo del servidor: rollback
          CacheManager.set(cacheKey, snapshot);
          if (_seccionActiva === seccionAlMomento) {
            render();
          }
          _toast(res && res.mensaje ? res.mensaje : 'La acción no se pudo completar.', 'error');
        }
      })
      .catch(function(err) {
        clearTimeout(timeoutId);
        if (timedOut) return;

        // Error de red o excepción: rollback
        CacheManager.set(cacheKey, snapshot);
        if (_seccionActiva === seccionAlMomento) {
          render();
        } else {
          // Usuario ya navegó a otra vista: rollback silencioso + toast
          _toast('La acción anterior no se completó.', 'warning');
        }
      });
  }
};

/**
 * Inicialización de la app (se ejecuta al cargar el DOM).
 * Usa datos pre-cargados en __INIT__ (inyectados server-side en doGet).
 * NO hace llamada al servidor para obtener el usuario — ya lo tiene.
 */
/**
 * Oculta la pantalla de carga inicial a pantalla completa (#bootOverlay).
 * Usa una transición de opacidad y luego la saca del flujo (display:none)
 * para que no interfiera con clics ni con lectores de pantalla.
 */
function _ocultarBootOverlay() {
  var overlay = document.getElementById('bootOverlay');
  if (!overlay) return;
  // Mensaje final antes de desaparecer — feedback de completitud
  var statusEl = document.getElementById('bootStatus');
  if (statusEl) statusEl.textContent = '¡Listo!';
  var hintEl = document.getElementById('bootHint');
  if (hintEl) hintEl.textContent = '';
  overlay.classList.add('boot-overlay--oculto');
  setTimeout(function() { overlay.style.display = 'none'; }, 500);
}

function inicializarApp() {
  var initData = window.__INIT__ || {};
  var usuario = initData.usuario || {};

  if (!usuario || !usuario.autorizado) {
    _ocultarBootOverlay();
    mostrarVista('viewNoAcceso');
    return;
  }

  APP_USUARIO = usuario;

  // Preparar header y menú en DOM (boot overlay sigue tapando todo)
  renderizarHeader(usuario);
  renderizarMenu(usuario.rol);

  // Cache local de datos pre-cargados desde doGet
  if (initData.resumen) CacheManager.set('dashboard', initData.resumen);
  if (initData.lotes) CacheManager.set('lotes', initData.lotes.datos || initData.lotes);

  // ── 1. Dashboard: splash espera solo por esto ──
  var promesaResumen;
  if (CacheManager.get('dashboard')) {
    promesaResumen = Promise.resolve(CacheManager.get('dashboard'));
  } else {
    promesaResumen = callServer('api_obtenerResumenDashboard').then(function(r) {
      CacheManager.set('dashboard', r);
      return r;
    });
  }

  // Recordar la última sección visitada (sessionStorage) para que un
  // refresh de página no bote siempre a "Inicio" — ver navegarA().
  var seccionRecordada = null;
  try { seccionRecordada = sessionStorage.getItem('ultimaSeccion'); } catch (e) { /* Storage bloqueado (ej. modo incógnito estricto) */ }
  var menuUsuario = MENUS_POR_ROL[usuario.rol] || [];
  var seccionRecordadaValida = seccionRecordada && menuUsuario.some(function(m) { return m.id === seccionRecordada; });

  promesaResumen
    .then(function(resumen) {
      if (resumen && typeof actualizarLineasDeVida === 'function') {
        actualizarLineasDeVida(usuario.rol, resumen);
      }
      if (seccionRecordadaValida && seccionRecordada !== 'dashboard') {
        _ocultarBootOverlay();
        navegarA(seccionRecordada);
      } else {
        if (resumen) _renderizarDashboardConDatos(resumen);
        _ocultarBootOverlay();
      }
    })
    .catch(function(err) {
      console.error('Error cargando dashboard inicial:', err);
      _ocultarBootOverlay();
      if (seccionRecordadaValida && seccionRecordada !== 'dashboard') {
        navegarA(seccionRecordada);
      } else {
        cargarDashboard();
      }
    });

  // ── 2. Métricas: background pre-fetch unificado (no bloquea splash) ──
  var ROLES_METRICAS = ['DIRECTOR', 'GERENTE', 'ADMIN', 'LIDER', 'ASESOR'];
  if (usuario.rol && ROLES_METRICAS.indexOf(usuario.rol.toUpperCase()) !== -1) {
    var hoy = new Date();
    var primerDia = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
    var fechaDesde = _formatearFechaISOUtil(primerDia);
    var fechaHasta = _formatearFechaISOUtil(hoy);

    callServer('api_obtenerDatosMetricas', fechaDesde, fechaHasta)
      .then(function(datos) {
        if (datos.usuarios) CacheManager.set('usuarios-dash', datos.usuarios);
        if (datos.lotes) CacheManager.set('lotes', datos.lotes);
        if (datos.metricasLotes) {
          CacheManager.set('metricas-lotes', datos.metricasLotes);
          CacheManager.set('metricas-lotes-rango', { fechaDesde: fechaDesde, fechaHasta: fechaHasta });
        }
      })
      .catch(function() { /* silencioso — se cargará al navegar */ });
  }

  // ── 3. Lotes: background (no bloquea splash, solo si no vino del pre-fetch) ──
  if (!initData.lotes) {
    // Si el rol no tiene métricas (no usó api_obtenerDatosMetricas), hacer prefetch aparte
    if (!usuario.rol || ROLES_METRICAS.indexOf(usuario.rol.toUpperCase()) === -1) {
      _prefetchLotesEnBackground();
    }
  }
}

/** Utilidad: formatea Date a YYYY-MM-DD */
function _formatearFechaISOUtil(fecha) {
  var y = fecha.getFullYear();
  var m = String(fecha.getMonth() + 1).padStart(2, '0');
  var d = String(fecha.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + d;
}

/**
 * Pre-carga los lotes en background cuando doGet no los entregó (cache-miss).
 * No afecta la UI actual — solo llena CacheManager para que al navegar
 * a "lotes" el usuario vea los datos sin espera adicional.
 * Si la carga falla, se ignora silenciosamente (cargarMisLotes lo reintentará).
 */
var _prefetchLotesPromise = null;

function _prefetchLotesEnBackground() {
  _prefetchLotesPromise = callServer('api_obtenerTodosLosLotes')
    .then(function(datos) {
      _prefetchLotesPromise = null;
      if (datos && !CacheManager.get('lotes')) {
        CacheManager.set('lotes', datos);
      }
      return datos;
    })
    .catch(function(err) {
      _prefetchLotesPromise = null;
      // Silencioso: cargarMisLotes hará su propio intento cuando el usuario navegue
      return null;
    });
}

/** Control de navegación — evita que respuestas tardías sobreescriban la vista actual */
var _navId = 0;
var _seccionActiva = 'dashboard';

function _sigueVigente(navIdCapturado) {
  return navIdCapturado === _navId;
}

function renderizarHeader(usuario) {
  var elUser = document.getElementById('headerUser');
  var elRol = document.getElementById('headerRol');
  if (elUser) elUser.textContent = usuario.nombre || usuario.email;
  if (elRol) elRol.textContent = usuario.rol;
}

function _mostrarSkeletonDashboard() {
  SkeletonSystem.mostrar('viewDashboard', 'dashboard');
  mostrarVista('viewDashboard');
}

function renderizarMenu(rol) {
  var menu = MENUS_POR_ROL[rol] || MENUS_POR_ROL['COMERCIAL'];
  var nav = document.getElementById('navMenu');
  if (!nav) return;

  var html = '';
  for (var i = 0; i < menu.length; i++) {
    var item = menu[i];
    if (item.label === '---') {
      html += '<li class="sidebar-separator"></li>';
    } else {
      html += '<li><a class="nav-link-admin" href="#/' + item.id + '" data-view="' + item.id + '">'
        + '<i>' + item.icon + '</i>'
        + '<span class="nav-text">' + item.label + '</span>'
        + '</a></li>';
    }
  }
  nav.innerHTML = html;

  // Event listeners para navegación
  var links = nav.querySelectorAll('.nav-link-admin');
  for (var j = 0; j < links.length; j++) {
    links[j].addEventListener('click', function(e) {
      e.preventDefault();
      var view = this.getAttribute('data-view');
      navegarA(view);
    });
    // El sidebar ya se expande con hover — aprovechar ese mismo gesto para
    // precargar en segundo plano los datos de la sección (ver _prefetchSeccion).
    links[j].addEventListener('mouseenter', function() {
      _prefetchSeccion(this.getAttribute('data-view'));
    });
  }
}

/**
 * Precarga en CacheManager los datos de una sección al pasar el mouse
 * por su link del sidebar, para que si el usuario hace clic momentos
 * después, la vista aparezca sin loading. No toca el DOM — solo llena
 * caché. Si la sección ya está en caché o ya hay una carga en curso,
 * no hace nada (evita pedidos duplicados).
 */
var _prefetchEnCurso = {};

var _HOVER_PREFETCH = {
  'lotes': function() {
    if (!CacheManager.get('lotes')) _prefetchLotesEnBackground();
  },
  'errores': function() {
    if (CacheManager.get('errores')) return;
    return callServer('api_obtenerMisErroresPendientes').then(function(d) {
      CacheManager.set('errores', d || []);
    }).catch(function() { /* silencioso — se reintenta al navegar */ });
  },
  'cola-auxiliar': function() {
    if (CacheManager.get('cola-auxiliar')) return;
    return callServer('api_obtenerColaAuxiliar').then(function(d) {
      CacheManager.set('cola-auxiliar', d || []);
    }).catch(function() { /* silencioso — se reintenta al navegar */ });
  }
};

function _prefetchSeccion(seccion) {
  var loader = _HOVER_PREFETCH[seccion];
  if (!loader || _prefetchEnCurso[seccion]) return;
  _prefetchEnCurso[seccion] = true;
  Promise.resolve(loader()).then(function() {
    _prefetchEnCurso[seccion] = false;
  });
}

function mostrarVista(vistaId) {
  // Ocultar todas las vistas
  var vistas = document.querySelectorAll('[id^="view"]');
  for (var i = 0; i < vistas.length; i++) {
    vistas[i].style.display = 'none';
  }
  // Mostrar la solicitada
  var vista = document.getElementById(vistaId);
  if (vista) { vista.style.display = 'block'; vista.classList.add('tab-panel'); }

  // Marcar item activo en sidebar
  var links = document.querySelectorAll('.nav-link-admin');
  for (var j = 0; j < links.length; j++) {
    links[j].classList.remove('active');
  }
}

function navegarA(seccion) {
  // Cancelar cualquier carga pendiente de la sección anterior
  _navId++;
  var miNavId = _navId;

  // Métricas Lotes tiene su propio container HTML pre-renderizado — no necesita viewLoading
  if (seccion !== 'metricas-lotes') {
    mostrarVista('viewLoading');
  }

  // Marcar como activo
  var link = document.querySelector('[data-view="' + seccion + '"]');
  if (link) link.classList.add('active');

  // Cerrar sidebar en mobile
  var sidebar = document.getElementById('sidebar');
  var backdrop = document.getElementById('sidebarBackdrop');
  if (sidebar) sidebar.classList.remove('sidebar-open');
  if (backdrop) backdrop.classList.remove('show');

  // Guardar sección activa (memoria + sessionStorage para sobrevivir un refresh)
  _seccionActiva = seccion;
  try { sessionStorage.setItem('ultimaSeccion', seccion); } catch (e) { /* Storage bloqueado */ }

  switch (seccion) {
    case 'dashboard':
      cargarDashboard();
      break;
    case 'lotes':
      cargarMisLotes(1);
      break;
    case 'usuarios':
      cargarVistaUsuarios();
      break;
    case 'solicitudes':
      cargarVistaSolicitudes();
      break;
    case 'errores':
      cargarVistaErroresComercial();
      break;
    case 'asignaciones':
      cargarVistaAsignaciones();
      break;
    case 'reportes':
      cargarVistaReportes();
      break;
    case 'cola-auxiliar':
      cargarColaAuxiliar();
      break;
    case 'mis-solicitudes':
      cargarMisSolicitudesAuxiliar();
      break;
    case 'radicar':
      mostrarVistaRadicar();
      break;
    case 'config':
      cargarVistaConfiguracion();
      break;
    case 'metricas-lotes':
      cargarVistaMetricasLotes();
      break;
    default:
      mostrarVistaEnConstruccion(seccion);
      break;
  }
}

/**
 * Obtiene los usuarios para filtros del dashboard.
 * Si están en cache, invoca el callback inmediatamente.
 * Si no, los solicita al servidor y los cachea antes de invocar el callback.
 * Usa _navId para descartar respuestas tardías si el usuario cambió de sección.
 * @param {function} callback - fn(usuarios) invocado con el array de UsuarioDash
 */
function _cargarUsuariosDash(callback) {
  var cached = CacheManager.get('usuarios-dash');
  if (cached) {
    callback(cached);
    return;
  }

  var navIdLocal = _navId;
  callServer('api_obtenerUsuariosDashboard')
    .then(function(datos) {
      if (!_sigueVigente(navIdLocal)) return;
      CacheManager.set('usuarios-dash', datos || []);
      callback(datos || []);
    })
    .catch(function(err) {
      if (!_sigueVigente(navIdLocal)) return;
      console.error('Error cargando usuarios-dash:', err);
      callback([]);
    });
}

function cargarDashboard() {
  var navIdLocal = _navId;

  var cachedResumen = CacheManager.get('dashboard');
  if (cachedResumen) {
    _renderizarDashboardConDatos(cachedResumen);
    return;
  }

  _mostrarSkeletonDashboard();

  var timeoutId = setTimeout(function() {
    if (!_sigueVigente(navIdLocal)) return;
    SkeletonSystem.reemplazar('viewDashboard',
      '<div class="card" style="text-align:center;padding:var(--space-8);">'
      + '<p style="color:var(--color-mono-500);">No pudimos conectar con el servidor.</p>'
      + '<button class="btn btn--primary" onclick="cargarDashboard()">Reintentar</button></div>');
  }, 15000);

  callServer('api_obtenerResumenDashboard')
    .then(function(r) {
      clearTimeout(timeoutId);
      if (!_sigueVigente(navIdLocal)) return;
      CacheManager.set('dashboard', r);
      _renderizarDashboardConDatos(r);
      if (typeof actualizarLineasDeVida === 'function') actualizarLineasDeVida(APP_USUARIO.rol, r);
    })
    .catch(function(err) {
      clearTimeout(timeoutId);
      if (!_sigueVigente(navIdLocal)) return;
      console.error(err);
      SkeletonSystem.reemplazar('viewDashboard',
        '<div class="card" style="text-align:center;padding:var(--space-8);">'
        + '<p style="color:var(--color-mono-500);">No pudimos cargar el resumen.</p>'
        + '<button class="btn btn--primary" onclick="cargarDashboard()">Reintentar</button></div>');
    });
}

/**
 * Texto relativo tipo "hace unos segundos" / "hace 4 min" / "hace 2 h"
 * a partir de un timestamp (Date.now()).
 */
function _tiempoRelativo(timestampMs) {
  if (!timestampMs) return '';
  var segundos = Math.round((Date.now() - timestampMs) / 1000);
  if (segundos < 10) return 'justo ahora';
  if (segundos < 60) return 'hace ' + segundos + ' s';
  var minutos = Math.round(segundos / 60);
  if (minutos < 60) return 'hace ' + minutos + ' min';
  var horas = Math.round(minutos / 60);
  return 'hace ' + horas + ' h';
}

/** Fuerza una recarga del dashboard ignorando la caché. */
function _refrescarDashboard() {
  CacheManager.invalidar('dashboard');
  cargarDashboard();
}

/**
 * Inicializa los filtros drill-down de la vista Métricas (Director/Comercial).
 * Carga datos de usuarios-dash (si no están en cache), renderiza los filtros
 * y conecta el handler de cambio para que filtren toda la sección (resumen,
 * análisis y tabla — vía MetricasLotesView.aplicarFiltroComercial).
 * Ruta de respaldo: solo se usa si api_obtenerDatosMetricas falló y
 * _renderizarMetricasCompleta no llegó a ejecutarse.
 * Usa patrón _navId para descartar respuestas tardías si el usuario navega fuera.
 */
function _inicializarFiltrosYGraficos() {
  var navIdLocal = _navId;

  // Cargar usuarios-dash y luego renderizar filtros
  _cargarUsuariosDash(function(usuarios) {
    if (!_sigueVigente(navIdLocal)) return;

    // Verificar que el container aún existe en el DOM (fail-safe)
    var filtersContainer = document.getElementById('drilldown-filters-container');
    if (!filtersContainer) return;

    var rol = APP_USUARIO ? APP_USUARIO.rol : '';
    var emailUsuario = APP_USUARIO ? APP_USUARIO.email : '';

    var filtrosHtml = DrillDownFilters.render(rol, usuarios, emailUsuario);
    filtersContainer.innerHTML = filtrosHtml;
    _actualizarVisibilidadFiltroEquipo(filtrosHtml !== '');

    DrillDownFilters._onFiltroChange = function() {
      if (!_sigueVigente(navIdLocal)) return;
      _aplicarFiltroDirectorComercial(CacheManager.get('lotes'), usuarios);
    };

    // Aplicar estado inicial (sin filtro de equipo todavía)
    _aplicarFiltroDirectorComercial(CacheManager.get('lotes'), usuarios);
  });
}

/**
 * Traduce la selección actual de Director/Comercial (DrillDownFilters) a un
 * conjunto de códigos de lote permitidos, y se lo pasa a MetricasLotesView
 * para que filtre el resumen, el análisis y la tabla — no solo un gráfico.
 * Si no hay lotes en cache todavía, los pide al servidor primero.
 * @param {Array|null} lotes - Lotes del equipo visible (o null si aún no están en cache)
 * @param {Array} usuarios - Lista de UsuarioDash
 */
function _aplicarFiltroDirectorComercial(lotes, usuarios) {
  if (typeof MetricasLotesView === 'undefined' || !MetricasLotesView.aplicarFiltroComercial) return;

  if (!lotes) {
    callServer('api_obtenerTodosLosLotes')
      .then(function(datos) {
        CacheManager.set('lotes', datos || []);
        _aplicarFiltroDirectorComercial(datos || [], usuarios);
      })
      .catch(function(err) {
        console.error('Error cargando lotes para filtro Director/Comercial:', err);
        _toast('No se pudo aplicar el filtro de equipo.', 'error');
      });
    return;
  }

  var emailsFiltrados = DrillDownFilters.getEmailsFiltrados(usuarios);

  if (emailsFiltrados === null) {
    MetricasLotesView.aplicarFiltroComercial(null);
    return;
  }

  // Mapear email → nombre (en MAYÚSCULAS, como viene lote.comercial)
  var nombresPorEmail = {};
  for (var i = 0; i < usuarios.length; i++) {
    var u = usuarios[i];
    if (u && u.email) nombresPorEmail[u.email.toLowerCase()] = (u.nombre || '').toUpperCase();
  }
  var nombresPermitidos = {};
  for (var j = 0; j < emailsFiltrados.length; j++) {
    var nombre = nombresPorEmail[emailsFiltrados[j].toLowerCase()];
    if (nombre) nombresPermitidos[nombre] = true;
  }

  // Códigos de lote (idLote) que pertenecen a un comercial permitido —
  // detallePorLote de Métricas se cruza por este mismo identificador
  // (mismo patrón que ya se usaba para cruzar sucursal por idLote).
  var loteIdsPermitidos = {};
  for (var k = 0; k < lotes.length; k++) {
    var lote = lotes[k];
    if (!lote || !lote.idLote) continue;
    var comercialLote = (lote.comercial || '').toUpperCase();
    if (nombresPermitidos[comercialLote]) {
      loteIdsPermitidos[lote.idLote.toUpperCase().trim()] = true;
    }
  }

  MetricasLotesView.aplicarFiltroComercial(loteIdsPermitidos);
}

function _kpiCompacto(titulo, valor, tema, filtroEstado) {
  var colorMap = { navy: 'var(--azul)', red: 'var(--rojo)', orange: 'var(--amarillo)', green: 'var(--verde)', teal: 'var(--azul-mid)' };
  var color = colorMap[tema] || colorMap.navy;
  var esClickable = filtroEstado && filtroEstado.length > 0;
  var onclick = esClickable ? ' onclick="_filtrarLotesPorEstado(\'' + filtroEstado + '\')"' : '';
  var cursor = esClickable ? 'cursor:pointer;' : '';

  return '<div class="metric-card"' + onclick + ' style="padding:16px;' + cursor + '">'
    + '<div class="metric-label" style="margin-bottom:8px;">' + titulo + '</div>'
    + '<div class="metric-value" style="font-size:1.6rem;margin-bottom:0;color:' + color + ';">' + _fmtNum(valor) + '</div>'
    + '</div>';
}

function _barraDistribucion(r, total) {
  var segmentos = [
    { label: 'Terminado', valor: r.terminados || 0, color: 'var(--color-success)' },
    { label: 'En análisis', valor: r.enAnalisis || 0, color: 'var(--color-primary-navy)' },
    { label: 'Pend. asignar', valor: r.pendienteAsignar || 0, color: '#5a6d8f' },
    { label: 'Pend. radicar', valor: r.pendienteRadicar || 0, color: '#8b9dc3' },
    { label: 'Error terceros', valor: r.errorTerceros || 0, color: 'var(--color-primary-red)' },
    { label: 'Pendiente paz y salvo', valor: r.pendientePS || 0, color: 'var(--color-accent-orange)' }
  ];

  var html = '<div style="display:flex;height:12px;border-radius:var(--radius-full);overflow:hidden;background:var(--color-mono-100);margin-bottom:var(--space-3);">';
  for (var s = 0; s < segmentos.length; s++) {
    var pct = Math.round((segmentos[s].valor / total) * 100);
    if (pct < 1 && segmentos[s].valor > 0) pct = 1;
    if (pct > 0) {
      html += '<div style="width:' + pct + '%;background:' + segmentos[s].color + ';transition:width var(--duration-slow);" title="' + segmentos[s].label + ': ' + segmentos[s].valor + '"></div>';
    }
  }
  html += '</div>';

  // Leyenda
  html += '<div style="display:flex;flex-wrap:wrap;gap:var(--space-3) var(--space-5);font-size:var(--text-xs);color:var(--color-mono-500);">';
  for (var l = 0; l < segmentos.length; l++) {
    if (segmentos[l].valor > 0) {
      html += '<div style="display:flex;align-items:center;gap:var(--space-1);">'
        + '<div style="width:8px;height:8px;border-radius:50%;background:' + segmentos[l].color + ';"></div>'
        + segmentos[l].label + ' (' + _fmtNum(segmentos[l].valor) + ')</div>';
    }
  }
  html += '</div>';

  return html;
}

function _kpiAdmin(titulo, valor, tema, filtroEstado) {
  var bgMap = { navy: 'var(--color-primary-navy)', red: 'var(--color-primary-red)', orange: 'var(--color-accent-orange)', green: 'var(--color-success)', teal: 'var(--color-accent-teal)' };
  var bg = bgMap[tema] || bgMap.navy;
  var esClickable = filtroEstado && filtroEstado.length > 0;
  var onclick = esClickable ? ' onclick="_filtrarLotesPorEstado(\'' + filtroEstado + '\')"' : '';
  var cursor = esClickable ? 'cursor:pointer;' : '';

  return '<div class="kpi-card"' + onclick + ' style="background:' + bg + ';color:var(--color-mono-0);' + cursor + '">'
    + '<div class="kpi-card__label">' + titulo + '</div>'
    + '<div class="kpi-card__value">' + _fmtNum(valor) + '</div>'
    + '</div>';
}

function _fmtNum(n) { return (n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }

function _filtrarLotesPorEstado(estado) {
  _filtroEstadoActivo = estado;
  navegarA('lotes');
}

var _filtroEstadoActivo = '';

// Hamburger menu toggle (mobile) — el sidebar nuevo se expande con hover
// en desktop (CSS puro); en móvil no hay hover, así que este botón fuerza
// la clase .sidebar-open y muestra un backdrop para cerrarlo al tocar fuera.
document.addEventListener('DOMContentLoaded', function() {
  var toggle = document.getElementById('menuToggle');
  var sidebar = document.getElementById('sidebar');
  var backdrop = document.getElementById('sidebarBackdrop');
  if (toggle && sidebar) {
    toggle.addEventListener('click', function() {
      sidebar.classList.toggle('sidebar-open');
      if (backdrop) backdrop.classList.toggle('show');
    });
  }
  if (backdrop && sidebar) {
    backdrop.addEventListener('click', function() {
      sidebar.classList.remove('sidebar-open');
      backdrop.classList.remove('show');
    });
  }
});

//  VISTA: MIS LOTES (con filtro local — sin re-llamar al servidor)
// ============================================================

var _lotesPageActual = 1;

function cargarMisLotes(pagina) {
  _lotesPageActual = pagina || 1;

  // Si ya tenemos todos los lotes en memoria, filtrar localmente
  if (CacheManager.get('lotes')) {
    _renderizarLotesFiltrados();
    return;
  }

  // Mostrar skeleton tipo tabla
  SkeletonSystem.mostrar('viewDashboard', 'tabla', {
    columnas: ['ID Lote', 'Fecha', 'Comercial', 'Contratos', 'Estado'],
    filas: 6,
    titulo: 'Lotes'
  });
  mostrarVista('viewDashboard');

  // 15s timeout
  var timeoutId = setTimeout(function() {
    if (_seccionActiva !== 'lotes') return;
    SkeletonSystem.reemplazar('viewDashboard',
      '<div class="card" style="text-align:center;padding:var(--space-8);">'
      + '<p style="color:var(--color-mono-500);">No pudimos conectar con el servidor.</p>'
      + '<button class="btn btn--primary" onclick="cargarMisLotes(1)">Reintentar</button></div>');
  }, 15000);

  // Reutilizar prefetch en vuelo si existe (evita llamada duplicada)
  var promesa = _prefetchLotesPromise || callServer('api_obtenerTodosLosLotes');

  promesa
    .then(function(datos) {
      clearTimeout(timeoutId);
      if (_seccionActiva !== 'lotes') return;
      if (!CacheManager.get('lotes')) {
        CacheManager.set('lotes', datos || []);
      }
      _renderizarLotesFiltrados();
    })
    .catch(function(err) {
      clearTimeout(timeoutId);
      if (_seccionActiva !== 'lotes') return;
      console.error('Error lotes:', err);
      SkeletonSystem.reemplazar('viewDashboard',
        '<div class="card" style="text-align:center;padding:var(--space-8);">'
        + '<p style="color:var(--color-mono-500);">No pudimos cargar los lotes.</p>'
        + '<button class="btn btn--primary" onclick="cargarMisLotes(1)">Reintentar</button></div>');
    });
}

function _renderizarLotesFiltrados() {
  var filtrados = CacheManager.get('lotes') || [];

  // Filtrar por estado
  if (_filtroEstadoActivo) {
    filtrados = filtrados.filter(function(l) { return l.estados && l.estados[_filtroEstadoActivo]; });
  }

  // Filtrar por búsqueda de ID
  if (_busquedaLoteActiva) {
    var busq = _busquedaLoteActiva.toUpperCase();
    filtrados = filtrados.filter(function(l) { return l.idLote.toUpperCase().indexOf(busq) !== -1; });
  }

  // Sort solo si el usuario lo activó (default: orden del servidor = más recientes primero)
  if (_lotesSort.campo) {
    filtrados = filtrados.slice(); // copia para no mutar el original
    _sortArray(filtrados, _lotesSort.campo, _lotesSort.dir);
  }

  // Paginación local
  var porPagina = 10;
  var total = filtrados.length;
  var totalPaginas = Math.ceil(total / porPagina);
  if (_lotesPageActual > totalPaginas) _lotesPageActual = 1;
  var inicio = (_lotesPageActual - 1) * porPagina;
  var paginados = filtrados.slice(inicio, inicio + porPagina);

  _renderizarLotesConDatos({ datos: paginados, total: total, pagina: _lotesPageActual, totalPaginas: totalPaginas });
}

var _lotesSort = { campo: '', dir: '' }; // campo y dirección de ordenamiento

function _renderizarLotesConDatos(resultado) {
      var container = document.getElementById('viewDashboard');
      if (!resultado || resultado.datos.length === 0) {
        var msgVacio = _busquedaLoteActiva ? 'No se encontró el lote "' + _busquedaLoteActiva + '".'
          : _filtroEstadoActivo ? 'No hay lotes con estado "' + _filtroEstadoActivo + '".'
          : 'No hay lotes para mostrar.';
        container.innerHTML = '<div class="stack">' + _filtroHeader()
          + '<div class="card card--flat" style="text-align:center; padding:var(--spacing-2xl);">'
          + '<div style="font-size:2.5rem; margin-bottom:var(--spacing-md);">📋</div>'
          + '<h3>' + msgVacio + '</h3></div></div>';
        mostrarVista('viewDashboard');
        return;
      }

      var html = '<div class="stack">' + _filtroHeader()
        + '<div class="flex flex--between"><h2>Lotes</h2>'
        + '<small>' + resultado.total + ' lote(s)</small></div>'
        + '<div class="card card--flat" style="padding:0; overflow:hidden;"><table class="table">'
        + '<thead><tr>' + _thSort('idLote','ID Lote','lotes') + _thSort('fecha','Fecha','lotes') + _thSort('comercial','Comercial','lotes') + _thSort('contratos','Contratos','lotes') + _thSort('estadoPrincipal','Estado','lotes') + '</tr></thead><tbody>';

      for (var i = 0; i < resultado.datos.length; i++) {
        var lote = resultado.datos[i];
        html += '<tr style="cursor:pointer;" onclick="_verDetalleLote(\'' + lote.idLote + '\')">'
          + '<td style="font-family:var(--font-mono); font-size:var(--text-sm);">' + lote.idLote + '</td>'
          + '<td>' + lote.fecha + '</td>'
          + '<td>' + (lote.comercial || '-') + '</td>'
          + '<td style="text-align:center;">' + lote.contratos + '</td>'
          + '<td>' + _badgeEstado(lote.estadoPrincipal) + '</td></tr>';
      }

      html += '</tbody></table></div>';
      if (resultado.totalPaginas > 1) {
        html += '<div class="flex flex--center flex--gap-md">'
          + '<button class="btn btn--ghost" ' + (_lotesPageActual <= 1 ? 'disabled' : '') + ' onclick="cargarMisLotes(' + (_lotesPageActual - 1) + ')">← Anterior</button>'
          + '<span style="font-size:var(--text-sm); color:var(--color-mono-500);">Página ' + _lotesPageActual + ' de ' + resultado.totalPaginas + '</span>'
          + '<button class="btn btn--ghost" ' + (_lotesPageActual >= resultado.totalPaginas ? 'disabled' : '') + ' onclick="cargarMisLotes(' + (_lotesPageActual + 1) + ')">Siguiente →</button></div>';
      }
      html += '</div>';
      container.innerHTML = html;
      mostrarVista('viewDashboard');
}

function _filtroHeader() {
  var html = '<div class="flex flex--gap-md" style="align-items:center; flex-wrap:wrap;">';

  // Barra de búsqueda
  html += '<div class="flex flex--gap-sm" style="flex:1; min-width:200px;">'
    + '<input class="input" id="inputBuscarLote" type="text" placeholder="Buscar por ID de lote..." value="' + (_busquedaLoteActiva || '') + '" style="flex:1; padding:10px 14px; font-size:var(--text-sm);" onkeydown="if(event.key===\'Enter\')_buscarLote()">'
    + '<button class="btn btn--primary" style="padding:10px 16px;" onclick="_buscarLote()">Buscar</button>'
    + '</div>';

  // Select de estado
  html += '<select class="input" style="width:auto; min-width:180px; padding:10px 14px; font-size:var(--text-sm);" onchange="_filtrarPorSelect(this.value)">'
    + '<option value="">Todos los estados</option>'
    + '<option value="PENDIENTE RADICAR"' + (_filtroEstadoActivo === 'PENDIENTE RADICAR' ? ' selected' : '') + '>Pendiente radicar</option>'
    + '<option value="RADICADO"' + (_filtroEstadoActivo === 'RADICADO' ? ' selected' : '') + '>Radicado</option>'
    + '<option value="PENDIENTE ASIGNAR"' + (_filtroEstadoActivo === 'PENDIENTE ASIGNAR' ? ' selected' : '') + '>Pendiente asignar</option>'
    + '<option value="EN ANÁLISIS"' + (_filtroEstadoActivo === 'EN ANÁLISIS' ? ' selected' : '') + '>En análisis</option>'
    + '<option value="ERROR EN TERCEROS"' + (_filtroEstadoActivo === 'ERROR EN TERCEROS' ? ' selected' : '') + '>Error en terceros</option>'
    + '<option value="PENDIENTE PAZ Y SALVO"' + (_filtroEstadoActivo === 'PENDIENTE PAZ Y SALVO' ? ' selected' : '') + '>Pendiente paz y salvo</option>'
    + '<option value="TERMINADO"' + (_filtroEstadoActivo === 'TERMINADO' ? ' selected' : '') + '>Terminado</option>'
    + '</select>';

  // Botón limpiar (si hay algún filtro activo)
  if (_filtroEstadoActivo || _busquedaLoteActiva) {
    html += '<button class="btn btn--ghost" style="font-size:var(--text-sm); padding:8px 12px;" onclick="_limpiarFiltro()">✕ Limpiar</button>';
  }

  html += '</div>';
  return html;
}

function _filtrarPorSelect(valor) {
  _filtroEstadoActivo = valor;
  _lotesPageActual = 1;
  _renderizarLotesFiltrados();
}

function _buscarLote() {
  var input = document.getElementById('inputBuscarLote');
  var valor = (input ? input.value : '').trim();
  _filtroEstadoActivo = '';
  _busquedaLoteActiva = valor;
  _lotesPageActual = 1;
  _renderizarLotesFiltrados();
}

var _busquedaLoteActiva = '';

function _limpiarFiltro() {
  _filtroEstadoActivo = '';
  _busquedaLoteActiva = '';
  _lotesPageActual = 1;
  _renderizarLotesFiltrados();
}

function _badgeEstado(estado) {
  var cls = 'badge--gray';
  if (estado === 'TERMINADO') cls = 'badge--success';
  else if (estado === 'EN ANÁLISIS') cls = 'badge--navy';
  else if (estado === 'ERROR EN TERCEROS') cls = 'badge--red';
  else if (estado === 'PENDIENTE PAZ Y SALVO') cls = 'badge--orange';
  else if (estado === 'RADICADO') cls = 'badge--teal';
  return '<span class="badge ' + cls + '">' + estado + '</span>';
}

function _marcarRadicadoAuxiliar(uuid) {
  // Recoger números de solicitud SAI
  var solicitudInq = document.getElementById('aux_solicitudInq');
  var numeros = {
    solicitudInquilino: solicitudInq ? solicitudInq.value.trim() : ''
  };

  // Recoger NRO de cada codeudor
  for (var n = 1; n <= 5; n++) {
    var input = document.getElementById('aux_nro_COA' + n);
    if (input) numeros['nroCoa' + n] = input.value.trim();
  }

  // Recoger siniestros
  var siniestros = '';
  var partes = [];
  // Inquilino
  var chkInq = document.getElementById('aux_siniestro_INQ');
  if (chkInq && chkInq.checked) {
    var numsInq = document.getElementById('aux_siniestro_nums_INQ');
    if (numsInq && numsInq.value.trim()) {
      partes.push('INQ:' + numsInq.value.trim());
    }
  }
  // Codeudores
  for (var s = 1; s <= 5; s++) {
    var chkCoa = document.getElementById('aux_siniestro_COA' + s);
    if (chkCoa && chkCoa.checked) {
      var numsCoa = document.getElementById('aux_siniestro_nums_COA' + s);
      if (numsCoa && numsCoa.value.trim()) {
        partes.push('COA' + s + ':' + numsCoa.value.trim());
      }
    }
  }
  if (partes.length > 0) siniestros = partes.join('|');
  numeros.siniestros = siniestros;

  // Validar que al menos el inquilino tenga número
  if (!numeros.solicitudInquilino) {
    _toast('Ingresa el número de solicitud SAI del inquilino.', 'warning');
    return;
  }

  _cerrarModalAuxiliar();

  OptimisticUpdater.ejecutar({
    cacheKey: 'cola-auxiliar',
    mutacion: function(datos) {
      return (datos || []).filter(function(s) { return s.uuid !== uuid; });
    },
    render: function() { _renderizarColaAuxiliar(); },
    serverFn: 'api_marcarRadicado',
    serverArgs: [uuid, numeros],
    invalidarKeys: ['dashboard']
  });
}

  // Inquilino
  html += _bloqueParticipanteError('INQ', s.arrendatario + ' (Inquilino)');

function _toggleReqs(id) {
  var checked = document.getElementById('et_check_' + id).checked;
  document.getElementById('et_reqs_' + id).style.display = checked ? 'block' : 'none';
}

function _enviarErrorTerceros(uuid, filaNum) {
  // Recoger datos del formulario
  var participantes = [];
  var checks = document.querySelectorAll('[id^="et_check_"]');
  for (var i = 0; i < checks.length; i++) {
    if (!checks[i].checked) continue;
    var id = checks[i].id.replace('et_check_', '');
    var reqs = [];
    var reqChecks = document.querySelectorAll('.et_req_' + id + ':checked');
    for (var r = 0; r < reqChecks.length; r++) {
      reqs.push(reqChecks[r].value);
    }
    if (reqs.length === 0) {
      _toast('Selecciona al menos un requerimiento para ' + id, 'warning');
      return;
    }
    participantes.push({ participante: id, requerimientos: reqs.join('|') });
  }

  if (participantes.length === 0) {
    _toast('Selecciona al menos un participante con error.', 'warning');
    return;
  }

  var nota = document.getElementById('et_nota').value.trim();

  // Feedback inmediato — deshabilitar botón
  var btnErr = document.querySelector('#modalErrorTerceros .btn--danger');
  if (btnErr) { btnErr.disabled = true; btnErr.textContent = '⏳ Guardando...'; }

  callServer('api_marcarErrorTerceros', uuid, participantes, nota, filaNum || undefined)
    .then(function(res) {
      _cerrarModalError();
      if (res && res.ok) {
        CacheManager.invalidar(['cola-auxiliar', 'dashboard']);
        _toast('Error registrado. Se notificó al comercial.', 'success');
        var colaActual = CacheManager.get('cola-auxiliar') || [];
        CacheManager.set('cola-auxiliar', colaActual.filter(function(s) { return s.uuid !== uuid; }));
        _renderizarColaAuxiliar();
      } else {
        _toast(res ? res.mensaje : 'Error al guardar.', 'error');
      }
    })
    .catch(function(err) {
      if (btnErr) { btnErr.disabled = false; btnErr.textContent = 'Guardar error y notificar'; }
      _toast('Error: ' + (err.message || err), 'error');
    });
}

function _cerrarModalError() {
  var modal = document.getElementById('modalErrorTerceros');
  if (modal) modal.remove();
}

function _cerrarModalAuxiliar() {
  var modal = document.getElementById('modalAuxiliar');
  if (modal) modal.remove();
}

function _thSort(campo, label, tabla) {
  var sortVar = tabla === 'lotes' ? _lotesSort : _solicitudesSort;
  var arrow = '';
  if (sortVar.campo === campo) {
    arrow = sortVar.dir === 'asc' ? ' ▲' : ' ▼';
  }
  return '<th style="cursor:pointer;user-select:none;" onclick="_ordenar(\'' + campo + '\',\'' + tabla + '\')">' + label + '<span style="opacity:0.5;font-size:10px;margin-left:4px;">' + arrow + '</span></th>';
}

var _solicitudesSort = { campo: '', dir: '' };

function _ordenar(campo, tabla) {
  var sortVar = tabla === 'lotes' ? _lotesSort : _solicitudesSort;

  if (sortVar.campo === campo) {
    sortVar.dir = sortVar.dir === 'asc' ? 'desc' : 'asc';
  } else {
    sortVar.campo = campo;
    sortVar.dir = 'asc';
  }

  if (tabla === 'lotes') {
    _lotesSort = sortVar;
    _renderizarLotesFiltrados();
  } else {
    _solicitudesSort = sortVar;
    _renderizarSolicitudesFiltradas();
  }
}

function _sortArray(arr, campo, dir) {
  if (!arr) return;
  arr.sort(function(a, b) {
    var va = a[campo] || '';
    var vb = b[campo] || '';
    // Intentar comparar como números
    var na = parseFloat(String(va).replace(/[^0-9.-]/g, ''));
    var nb = parseFloat(String(vb).replace(/[^0-9.-]/g, ''));
    if (!isNaN(na) && !isNaN(nb)) {
      return dir === 'asc' ? na - nb : nb - na;
    }
    // Comparar como strings
    va = String(va).toUpperCase();
    vb = String(vb).toUpperCase();
    if (va < vb) return dir === 'asc' ? -1 : 1;
    if (va > vb) return dir === 'asc' ? 1 : -1;
    return 0;
  });
}

function _cargarVistaAnalista() {
  // 1. Check cache first
  var cached = CacheManager.get('mis-solicitudes');
  if (cached) { _renderizarVistaAnalista(cached); return; }

  // 2. Cache miss → show skeleton
  SkeletonSystem.mostrar('viewDashboard', 'tabla', {
    columnas: ['Solicitud', 'Arrendatario', 'Estado', 'Fecha', ''],
    filas: 4,
    titulo: 'Mis solicitudes'
  });
  mostrarVista('viewDashboard');

  // 3. Fetch from server with 15s timeout
  var navIdLocal = _navId;
  var timeoutId = setTimeout(function() {
    if (!_sigueVigente(navIdLocal)) return;
    SkeletonSystem.reemplazar('viewDashboard',
      '<div class="card" style="text-align:center;padding:var(--space-8);">'
      + '<p style="color:var(--color-mono-500);">No pudimos conectar con el servidor.</p>'
      + '<button class="btn btn--primary" onclick="_cargarVistaAnalista()">Reintentar</button></div>');
  }, 15000);

  callServer('api_obtenerMisSolicitudesAnalista')
    .then(function(data) {
      clearTimeout(timeoutId);
      if (!_sigueVigente(navIdLocal)) return;
      CacheManager.set('mis-solicitudes', data);
      _renderizarVistaAnalista(data);
    })
    .catch(function(err) {
      clearTimeout(timeoutId);
      if (!_sigueVigente(navIdLocal)) return;
      console.error(err);
      SkeletonSystem.reemplazar('viewDashboard',
        '<div class="card" style="text-align:center;padding:var(--space-8);">'
        + '<p style="color:var(--color-mono-500);">No pudimos cargar tus solicitudes.</p>'
        + '<button class="btn btn--primary" onclick="_cargarVistaAnalista()">Reintentar</button></div>');
    });
}

function _renderizarVistaAnalista(data) {
  var container = document.getElementById('viewDashboard');
  var cupoRestante = data.cupo - data.activas;
  var btnDisabled = cupoRestante <= 0 ? 'disabled' : '';
  var btnLabel = cupoRestante <= 0 ? 'Cupo lleno' : 'Pedir solicitud';

  var html = '<div class="stack">'
    + '<div class="flex flex--between" style="align-items:center;">'
    + '<h2>Mis solicitudes</h2>'
    + '<div class="flex flex--gap-md" style="align-items:center;">'
    + '<span style="font-size:var(--text-sm);color:var(--color-mono-500);">' + data.activas + ' de ' + data.cupo + ' cupos</span>'
    + '<button class="btn btn--primary" ' + btnDisabled + ' onclick="_pedirSolicitudAnalista()">' + btnLabel + '</button>'
    + '</div></div>';

  if (data.solicitudes.length === 0) {
    html += '<div class="card card--flat" style="text-align:center;padding:var(--spacing-2xl);">'
      + '<div style="font-size:2.5rem;margin-bottom:var(--spacing-md);">📋</div>'
      + '<h3>No tienes solicitudes asignadas</h3>'
      + '<p>Haz clic en "Pedir solicitud" para que se te asigne una.</p>'
      + '</div>';
  } else {
    for (var i = 0; i < data.solicitudes.length; i++) {
      var s = data.solicitudes[i];
      html += '<div class="card card--flat" style="cursor:pointer;" onclick="_abrirEvaluacion(' + s.fila + ')">'
        + '<div class="flex flex--between" style="align-items:center;">'
        + '<div>'
        + '<strong style="font-family:var(--font-mono); font-size:var(--text-lg);">' + (s.solicitudInquilino || 'Sin número') + '</strong>'
        + '<br><span style="font-weight:600;">' + s.arrendatario + '</span>'
        + '<br><small style="color:var(--color-mono-500);">' + s.codigoLote + ' · Póliza ' + s.poliza + ' · ' + s.ciudad + '</small>'
        + '</div>'
        + '<button class="btn btn--primary" style="padding:6px 14px;font-size:var(--text-sm);">Evaluar →</button>'
        + '</div></div>';
    }
  }

  html += '</div>';
  container.innerHTML = html;
  mostrarVista('viewDashboard');
}

function _pedirSolicitudAnalista() {
  // Feedback inmediato — deshabilitar botón y mostrar estado
  var btns = document.querySelectorAll('button');
  for (var b = 0; b < btns.length; b++) {
    if (btns[b].textContent.indexOf('Pedir') !== -1) {
      btns[b].disabled = true;
      btns[b].textContent = '⏳ Asignando...';
      break;
    }
  }

  callServer('api_pedirSolicitudAnalista')
    .then(function(res) {
      if (res && res.ok) {
        CacheManager.invalidar(['mis-solicitudes', 'asignaciones']);
        _cargarVistaAnalista();
      } else {
        _toast(res ? res.mensaje : 'No se pudo asignar.', 'error');
        CacheManager.invalidar(['mis-solicitudes']);
        _cargarVistaAnalista(); // Recargar para restaurar botón
      }
    })
    .catch(function(err) {
      _toast('Error: ' + (err.message || err), 'error');
      CacheManager.invalidar(['mis-solicitudes']);
      _cargarVistaAnalista();
    });
}

function _selectEval(label, id, valorActual, opciones) {
  var html = '<div><label>' + label + '</label><select class="input" id="' + id + '" style="padding:10px 12px;">';
  for (var i = 0; i < opciones.length; i++) {
    var sel = opciones[i] === valorActual ? ' selected' : '';
    html += '<option value="' + opciones[i] + '"' + sel + '>' + (opciones[i] || '-- Seleccionar --') + '</option>';
  }
  return html + '</select></div>';
}

function _recogerCamposEval() {
  var campos = {};
  var inputs = document.querySelectorAll('[id^="eval_"]');
  for (var i = 0; i < inputs.length; i++) {
    var campo = inputs[i].id.replace('eval_', '');
    campos[campo] = inputs[i].value;
  }
  return campos;
}

    .catch(function(err) { _toast('Error: ' + err.message, 'error'); });
}

function _finalizarEvaluacion(filaNum) {
  if (!confirm('¿Estás seguro? La solicitud se marcará como evaluada y no podrás modificarla.')) return;
  var campos = _recogerCamposEval();
  callServer('api_guardarEvaluacion', filaNum, campos, true)
    .then(function(res) {
      if (res && res.ok) {
        CacheManager.invalidar(['mis-solicitudes']);
        _cargarVistaAnalista();
      } else {
        _toast(res ? res.mensaje : 'Error al finalizar.', 'error');
      }
    })
    .catch(function(err) { _toast('Error: ' + err.message, 'error'); });
}

function cargarVistaAsignaciones() {
  // 1. Check cache first
  var cached = CacheManager.get('asignaciones');
  if (cached) { _renderizarAsignaciones(cached); return; }

  // 2. Cache miss → show skeleton
  SkeletonSystem.mostrar('viewDashboard', 'tabla', {
    columnas: ['Analista', 'Solicitud', 'Arrendatario', 'Fecha asignación', 'Estado', ''],
    filas: 5,
    titulo: 'Asignaciones'
  });
  mostrarVista('viewDashboard');

  // 3. Fetch from server with 15s timeout
  var navIdLocal = _navId;
  var timeoutId = setTimeout(function() {
    if (!_sigueVigente(navIdLocal)) return;
    SkeletonSystem.reemplazar('viewDashboard',
      '<div class="card" style="text-align:center;padding:var(--space-8);">'
      + '<p style="color:var(--color-mono-500);">No pudimos conectar con el servidor.</p>'
      + '<button class="btn btn--primary" onclick="cargarVistaAsignaciones()">Reintentar</button></div>');
  }, 15000);

  callServer('api_obtenerAsignaciones')
    .then(function(datos) {
      clearTimeout(timeoutId);
      if (!_sigueVigente(navIdLocal)) return;
      CacheManager.set('asignaciones', datos || []);
      _renderizarAsignaciones(datos || []);
    })
    .catch(function(err) {
      clearTimeout(timeoutId);
      if (!_sigueVigente(navIdLocal)) return;
      console.error(err);
      SkeletonSystem.reemplazar('viewDashboard',
        '<div class="card" style="text-align:center;padding:var(--space-8);">'
        + '<p style="color:var(--color-mono-500);">No pudimos cargar las asignaciones.</p>'
        + '<button class="btn btn--primary" onclick="cargarVistaAsignaciones()">Reintentar</button></div>');
    });
}

function _renderizarAsignaciones(datos) {
  var container = document.getElementById('viewDashboard');

  // Agrupar por analista
  var porAnalista = {};
  for (var i = 0; i < datos.length; i++) {
    var a = datos[i].asignadaA;
    if (!porAnalista[a]) porAnalista[a] = [];
    porAnalista[a].push(datos[i]);
  }

  var html = '<div class="stack">'
    + '<div class="flex flex--between"><h2>Asignaciones</h2><small>' + datos.length + ' solicitud(es) en evaluación</small></div>';

  if (datos.length === 0) {
    html += '<div class="card card--flat" style="text-align:center;padding:var(--spacing-2xl);">'
      + '<h3>No hay solicitudes asignadas</h3></div>';
  } else {
    var analistas = Object.keys(porAnalista).sort();
    for (var a = 0; a < analistas.length; a++) {
      var email = analistas[a];
      var sols = porAnalista[email];
      html += '<div class="card card--flat" style="padding:0;overflow:hidden;">'
        + '<div style="padding:12px 16px;background:rgba(37,49,80,0.03);border-bottom:1px solid rgba(0,0,0,0.06);">'
        + '<strong>' + email.split('@')[0] + '</strong> <small style="color:var(--color-mono-500);">(' + sols.length + ' activas)</small>'
        + '</div><table class="table"><tbody>';

      for (var s = 0; s < sols.length; s++) {
        var sol = sols[s];
        html += '<tr>'
          + '<td><strong>' + sol.arrendatario + '</strong><br><small style="color:var(--color-mono-500);">' + sol.solicitud + '</small></td>'
          + '<td style="font-size:var(--text-sm);font-family:var(--font-mono);">' + sol.codigoLote + '</td>'
          + '<td style="width:120px;">'
          + '<button class="btn btn--ghost" style="padding:4px 8px;font-size:11px;" onclick="_liberarSolicitud(' + sol.fila + ')">Liberar</button>'
          + '</td></tr>';
      }

      html += '</tbody></table></div>';
    }
  }

  html += '</div>';
  container.innerHTML = html;
  mostrarVista('viewDashboard');
}

function _liberarSolicitud(filaNum) {
  if (!confirm('¿Liberar esta solicitud? Volverá a la cola de disponibles.')) return;
  callServer('api_reasignarSolicitud', filaNum, '')
    .then(function(res) {
      if (res && res.ok) {
        // Leer el caché ANTES de tocarlo: invalidar primero dejaba el get() en null
        // y la vista quedaba vacía (y el []  resultante se tomaba como cache-hit,
        // sin volver a pedir datos al servidor).
        var asignaciones = (CacheManager.get('asignaciones') || [])
          .filter(function(s) { return s.fila !== filaNum; });
        CacheManager.set('asignaciones', asignaciones);
        CacheManager.invalidar('mis-solicitudes');
        _renderizarAsignaciones(asignaciones);
      }
      else _toast(res ? res.mensaje : 'Error al liberar.', 'error');
    })
    .catch(function(err) { _toast('Error: ' + (err.message || err), 'error'); });
}

function _renderizarErroresComercial(errores) {
  var container = document.getElementById('viewDashboard');

  if (errores.length === 0) {
    container.innerHTML = '<div class="stack">'
      + '<h2>Pendientes de corrección</h2>'
      + '<div class="card" style="text-align:center;padding:var(--space-12);">'
      + '<div class="empty-state__icon">✅</div>'
      + '<div class="empty-state__title">Todo en orden</div>'
      + '<div class="empty-state__text">No tienes correcciones pendientes en este momento.</div>'
      + '</div></div>';
    mostrarVista('viewDashboard');
    return;
  }

  // Separar por estado
  var pendientes = errores.filter(function(e) { return e.participantes.some(function(p) { return p.estadoError === 'PENDIENTE'; }); });
  var enEspera = errores.filter(function(e) { return e.participantes.every(function(p) { return p.estadoError === 'CORRECCION_RECIBIDA'; }); });

  var esAdmin = APP_USUARIO && (APP_USUARIO.rol === 'LIDER' || APP_USUARIO.rol === 'ADMIN');

  var html = '<div class="stack stack--loose">'
    + '<div><h2>Pendientes de corrección</h2>'
    + '<p style="font-size:var(--text-sm);color:var(--color-mono-500);margin:var(--space-1) 0 0;">' + errores.length + ' caso(s) activos</p></div>';

  // Sección 1: Pendientes de respuesta
  if (pendientes.length > 0) {
    html += '<div><h3 style="font-size:var(--text-body);color:var(--color-primary-red);margin-bottom:var(--space-3);">⚠️ Requieren tu respuesta (' + pendientes.length + ')</h3>';
    for (var i = 0; i < pendientes.length; i++) {
      html += _renderCardError(pendientes[i], true, esAdmin);
    }
    html += '</div>';
  }

  // Sección 2: En espera de revisión
  if (enEspera.length > 0) {
    html += '<div><h3 style="font-size:var(--text-body);color:var(--color-accent-teal);margin-bottom:var(--space-3);">⏳ En espera de revisión (' + enEspera.length + ')</h3>';
    for (var j = 0; j < enEspera.length; j++) {
      html += _renderCardError(enEspera[j], false, esAdmin);
    }
    html += '</div>';
  }

  html += '</div>';
  container.innerHTML = html;
  mostrarVista('viewDashboard');
}

function _renderCardError(e, puedeResponder, esAdmin) {
  var tieneCorreccion = e.participantes.some(function(p) { return p.estadoError === 'CORRECCION_RECIBIDA'; });
  var borderColor = puedeResponder ? 'var(--color-primary-red)' : 'var(--color-accent-teal)';

  var html = '<div class="card" style="border-left:4px solid ' + borderColor + ';margin-bottom:var(--space-3);">'
    + '<div class="flex flex--between" style="margin-bottom:var(--space-4);flex-wrap:wrap;gap:var(--space-2);">'
    + '<div>'
    + '<h3 style="margin-bottom:var(--space-1);">' + e.arrendatario + '</h3>'
    + '<div style="font-size:var(--text-sm);color:var(--color-mono-500);">Lote: <strong>' + e.idLote + '</strong> · Radicado: ' + (e.fechaRadicacion || e.fechaError) + '</div>';

  if (tieneCorreccion && !puedeResponder) {
    html += '<span class="badge badge--teal" style="margin-top:var(--space-2);">✓ Corrección enviada — en espera de revisión</span>';
  }

  html += '</div>';

  if (puedeResponder) {
    html += '<button class="btn btn--primary" style="flex-shrink:0;" onclick=\'_abrirCorreccion(' + JSON.stringify(e).replace(/'/g, "\\'") + ')\'>Responder →</button>';
  }

  html += '</div>';

  // Detalle por participante
  for (var p = 0; p < e.participantes.length; p++) {
    var part = e.participantes[p];
    var tipoLabel = part.participante === 'INQ' ? 'Inquilino' : part.participante.replace('COA', 'Codeudor ');

    html += '<div style="padding:var(--space-3);background:' + (puedeResponder ? 'var(--color-error-bg)' : 'rgba(15,189,183,0.04)') + ';border-radius:var(--radius-sm);margin-bottom:var(--space-2);">'
      + '<div style="font-size:var(--text-sm);font-weight:var(--font-bold);color:var(--color-primary-navy);margin-bottom:var(--space-2);">'
      + '👤 ' + tipoLabel + ': ' + (part.nombreReal || part.participante) + '</div>';

    // Lo que se pidió
    if (part.requerimientosDetalle && part.requerimientosDetalle.length > 0) {
      html += '<ul style="margin:0 0 var(--space-2);padding-left:var(--space-5);font-size:var(--text-sm);">';
      for (var rd = 0; rd < part.requerimientosDetalle.length; rd++) {
        var req = part.requerimientosDetalle[rd];
        html += '<li style="margin-bottom:var(--space-1);">' + (req.instruccion || req.label) + '</li>';
      }
      html += '</ul>';
    }

    // Respuesta del comercial (si ya respondió) — visible para todos
    if (part.respuestaComercial) {
      html += '<div style="padding:var(--space-2) var(--space-3);background:var(--color-mono-0);border:1px solid var(--color-mono-100);border-radius:var(--radius-xs);font-size:var(--text-sm);margin-top:var(--space-2);">'
        + '<strong style="color:var(--color-mono-500);font-size:var(--text-xs);text-transform:uppercase;">Respuesta del comercial:</strong><br>'
        + part.respuestaComercial;
      if (part.archivosPath) {
        html += '<br><a href="' + part.archivosPath + '" target="_blank" style="color:var(--color-accent-teal);font-size:var(--text-sm);text-decoration:underline;">📎 Ver archivo adjunto →</a>';
      }
      html += '</div>';
    }

    html += '</div>';
  }

  html += '</div>';
  return html;
}

function _traducirRequerimientos(participantes) {
  var traducciones = {
    'celular_correo': 'Confirmar celular o correo',
    'doc_identidad': 'Adjuntar documento de identidad',
    'cert_existencia': 'Adjuntar cert. existencia y representación legal',
    'confirmar_destino': 'Confirmar destino del inmueble',
    'confirmar_direccion': 'Confirmar dirección'
  };
  var html = '';
  for (var p = 0; p < participantes.length; p++) {
    var part = participantes[p];
    var label = part.participante === 'INQ' ? 'Inquilino' : part.participante;
    var reqs = (part.requerimientos || '').split('|').map(function(r) {
      return traducciones[r] || r;

function _abrirCorreccion(error) {

    + '</div></div>';

  modal.innerHTML = html;
  document.body.appendChild(modal);
}

function _enviarCorreccion(uuid) {
  var textareas = document.querySelectorAll('.correccion-resp');
  var files = document.querySelectorAll('.correccion-file');
  var respuestas = [];
  var archivosPromises = [];

  for (var i = 0; i < textareas.length; i++) {
    var resp = textareas[i].value.trim();
    var file = files[i] ? files[i].files[0] : null;
    if (!resp && !file) { _toast('Completa la respuesta o adjunta un archivo para cada participante.', 'warning'); return; }
    respuestas.push({
      participante: textareas[i].getAttribute('data-participante'),
      respuesta: resp || '(Adjuntó archivo)'
    });
    archivosPromises.push(file ? _archivoABase64(file) : Promise.resolve(null));
  }

  // Feedback
  var btnEnv = document.querySelector('#modalCorreccion .btn--primary');
  if (btnEnv) { btnEnv.disabled = true; btnEnv.textContent = '⏳ Enviando...'; }

  // Convertir archivos a base64 y enviar con actualización optimista
  Promise.all(archivosPromises).then(function(archivos) {
    // Adjuntar info de archivos a respuestas
    for (var a = 0; a < archivos.length; a++) {
      respuestas[a].archivo = archivos[a]; // null o {bytes, nombre, tipo}
    }

    _cerrarModalCorreccion();

    OptimisticUpdater.ejecutar({
      cacheKey: 'errores',
      mutacion: function(datos) {
        return (datos || []).filter(function(e) { return e.uuid !== uuid; });
      },
      render: function() { _renderizarErroresComercial(CacheManager.get('errores') || []); },
      serverFn: 'api_enviarCorreccion',
      serverArgs: [uuid, respuestas],
      invalidarKeys: ['dashboard']
    });
  }).catch(function(err) {
    if (btnEnv) { btnEnv.disabled = false; btnEnv.textContent = 'Enviar corrección'; }
    _toast('Error: ' + (err.message || err), 'error');
  });
}

function _cerrarModalCorreccion() {
  var modal = document.getElementById('modalCorreccion');
  if (modal) modal.remove();
}

function _archivoCorreccionCargado(input) {
  var dropzone = input.closest('.correccion-dropzone');
  var label = dropzone.querySelector('.correccion-dropzone-label');
  if (input.files[0] && dropzone && label) {
    dropzone.style.borderColor = 'var(--color-success)';
    dropzone.style.borderStyle = 'solid';
    dropzone.style.background = 'var(--color-success-bg)';
    label.textContent = input.files[0].name + ' ✓';
    label.style.color = 'var(--color-success)';
  }
}

// ============================================================
//  VISTA: SOLICITUDES (registro analisis)
// ============================================================

var _solicitudesCache = null;
var _solicitudesFiltroEstado = '';
var _solicitudesBusqueda = '';
var _solicitudesPage = 1;
var _solicitudesTotal = 0;

function cargarVistaSolicitudes() {
  // 1. Check cache first
  var cached = CacheManager.get('solicitudes');
  if (cached) {
    _solicitudesCache = cached;
    _renderizarSolicitudesFiltradas();
    return;
  }

  // Reset sort al cargar por primera vez
  _solicitudesSort = { campo: '', dir: '' };

  // 2. Cache miss → show skeleton
  SkeletonSystem.mostrar('viewDashboard', 'tabla', {
    columnas: ['Arrendatario', 'Solicitud', 'Lote', 'Canon', 'Asignada a', 'Resultado análisis', 'Estado'],
    filas: 8,
    titulo: 'Solicitudes'
  });
  mostrarVista('viewDashboard');

  // 3. Fetch from server with 15s timeout
  var timeoutId = setTimeout(function() {
    if (_seccionActiva !== 'solicitudes') return;
    SkeletonSystem.reemplazar('viewDashboard',
      '<div class="card" style="text-align:center;padding:var(--space-8);">'
      + '<p style="color:var(--color-mono-500);">No pudimos conectar con el servidor.</p>'
      + '<button class="btn btn--primary" onclick="cargarVistaSolicitudes()">Reintentar</button></div>');
  }, 15000);

  callServer('api_obtenerSolicitudes', 0, 500)
    .then(function(res) {
      clearTimeout(timeoutId);
      if (_seccionActiva !== 'solicitudes') return;
      _solicitudesCache = res.datos || [];
      _solicitudesTotal = res.total || 0;
      CacheManager.set('solicitudes', _solicitudesCache);
      _renderizarSolicitudesFiltradas();
    })
    .catch(function(err) {
      clearTimeout(timeoutId);
      if (_seccionActiva !== 'solicitudes') return;
      console.error(err);
      SkeletonSystem.reemplazar('viewDashboard',
        '<div class="card" style="text-align:center;padding:var(--space-8);">'
        + '<p style="color:var(--color-mono-500);">No pudimos cargar las solicitudes.</p>'
        + '<button class="btn btn--primary" onclick="cargarVistaSolicitudes()">Reintentar</button></div>');
    });
}

function _cargarMasSolicitudes() {
  var cargadas = _solicitudesCache ? _solicitudesCache.length : 0;
  callServer('api_obtenerSolicitudes', cargadas, 300)
    .then(function(res) {
      if (res.datos && res.datos.length > 0) {
        _solicitudesCache = _solicitudesCache.concat(res.datos);
        CacheManager.set('solicitudes', _solicitudesCache);
      }
      _renderizarSolicitudesFiltradas();
    })
    .catch(function(err) { console.error(err); });
}

function _renderizarSolicitudesFiltradas() {
  var filtradas = _solicitudesCache || [];

  if (_solicitudesFiltroEstado) {
    filtradas = filtradas.filter(function(s) { return s.estado === _solicitudesFiltroEstado; });
  }
  if (_solicitudesBusqueda) {
    var busq = _solicitudesBusqueda.toUpperCase();
    filtradas = filtradas.filter(function(s) {
      return s.arrendatario.toUpperCase().indexOf(busq) !== -1
        || s.codigoLote.toUpperCase().indexOf(busq) !== -1
        || s.identificacion.indexOf(busq) !== -1
        || (s.solicitudInquilino && s.solicitudInquilino.toUpperCase().indexOf(busq) !== -1);
    });
  }

  // Sort solo si el usuario lo activó
  if (_solicitudesSort.campo) {
    filtradas = filtradas.slice();
    _sortArray(filtradas, _solicitudesSort.campo, _solicitudesSort.dir);
  }

  var porPagina = 15;
  var total = filtradas.length;
  var totalPaginas = Math.ceil(total / porPagina);
  if (_solicitudesPage > totalPaginas) _solicitudesPage = 1;
  var inicio = (_solicitudesPage - 1) * porPagina;
  var paginadas = filtradas.slice(inicio, inicio + porPagina);

  var container = document.getElementById('viewDashboard');

  // Header con filtros
  var cargadasInfo = _solicitudesCache ? _solicitudesCache.length : 0;
  var html = '<div class="stack">'
    + '<div class="flex flex--between"><h2>Solicitudes</h2><small>' + cargadasInfo + ' de ' + _solicitudesTotal + ' solicitud(es)</small></div>'
    + '<div class="flex flex--gap-md" style="align-items:center; flex-wrap:wrap;">'
    + '<input class="input" style="flex:1; min-width:200px; padding:10px 14px; font-size:var(--text-sm);" placeholder="Buscar por arrendatario, lote, ID o solicitud..." value="' + (_solicitudesBusqueda || '') + '" onkeydown="if(event.key===\'Enter\'){_solicitudesBusqueda=this.value;_solicitudesPage=1;_renderizarSolicitudesFiltradas();}">'
    + '<select class="input" style="width:auto; min-width:160px; padding:10px 14px; font-size:var(--text-sm);" onchange="_solicitudesFiltroEstado=this.value;_solicitudesPage=1;_renderizarSolicitudesFiltradas();">'
    + '<option value="">Todos los estados</option>'
    + '<option value="PENDIENTE"' + (_solicitudesFiltroEstado === 'PENDIENTE' ? ' selected' : '') + '>Pendiente</option>'
    + '<option value="EN EVALUACIÓN"' + (_solicitudesFiltroEstado === 'EN EVALUACIÓN' ? ' selected' : '') + '>En evaluación</option>'
    + '<option value="EVALUADA"' + (_solicitudesFiltroEstado === 'EVALUADA' ? ' selected' : '') + '>Evaluada</option>'
    + '</select>';

  if (_solicitudesFiltroEstado || _solicitudesBusqueda) {
    html += '<button class="btn btn--ghost" style="font-size:var(--text-sm);" onclick="_solicitudesFiltroEstado=\'\';_solicitudesBusqueda=\'\';_solicitudesPage=1;_renderizarSolicitudesFiltradas();">✕ Limpiar</button>';
  }
  html += '</div>';

  if (paginadas.length === 0) {
    html += '<div class="card card--flat" style="text-align:center; padding:var(--spacing-2xl);"><h3>No hay solicitudes para mostrar</h3></div>';
  } else {
    html += '<div class="card card--flat" style="padding:0; overflow:hidden;"><table class="table">'
      + '<thead><tr>' + _thSort('arrendatario','Arrendatario','solicitudes') + _thSort('solicitudInquilino','Solicitud','solicitudes') + _thSort('codigoLote','Lote','solicitudes') + _thSort('canon','Canon','solicitudes') + _thSort('asignadaA','Asignada a','solicitudes') + _thSort('resultadoSolicitud','Resultado análisis','solicitudes') + _thSort('estado','Estado','solicitudes') + '</tr></thead><tbody>';

    for (var i = 0; i < paginadas.length; i++) {
      var s = paginadas[i];
      var estadoBadge = s.estado === 'EVALUADA' ? 'badge--success' : s.estado === 'EN EVALUACIÓN' ? 'badge--navy' : 'badge--gray';
      html += '<tr style="cursor:pointer;" onclick="_verDetalleSolicitud(' + s.fila + ')">'
        + '<td><strong>' + s.arrendatario + '</strong><br><small style="color:var(--color-mono-500);">' + s.identificacion + '</small></td>'
        + '<td style="font-size:var(--text-sm); font-family:var(--font-mono);">' + (s.solicitudInquilino || '-') + '</td>'
        + '<td style="font-size:var(--text-sm); font-family:var(--font-mono);">' + s.codigoLote + '</td>'
        + '<td style="font-size:var(--text-sm);">$' + _fmtNum(s.canon) + '</td>'
        + '<td style="font-size:var(--text-sm); color:var(--color-mono-500);">' + (s.asignadaA ? s.asignadaA.split('@')[0] : '-') + '</td>'
        + '<td style="font-size:var(--text-sm);">' + (s.resultadoSolicitud || '-') + '</td>'
        + '<td><span class="badge ' + estadoBadge + '">' + s.estado + '</span></td>'
        + '</tr>';
    }
    html += '</tbody></table></div>';
  }

  // Paginación
  if (totalPaginas > 1) {
    html += '<div class="flex flex--center flex--gap-md">'
      + '<button class="btn btn--ghost" ' + (_solicitudesPage <= 1 ? 'disabled' : '') + ' onclick="_solicitudesPage--;_renderizarSolicitudesFiltradas();">← Anterior</button>'
      + '<span style="font-size:var(--text-sm); color:var(--color-mono-500);">Página ' + _solicitudesPage + ' de ' + totalPaginas + '</span>'
      + '<button class="btn btn--ghost" ' + (_solicitudesPage >= totalPaginas ? 'disabled' : '') + ' onclick="_solicitudesPage++;_renderizarSolicitudesFiltradas();">Siguiente →</button></div>';
  }

  // Botón cargar más si no se han cargado todas
  if (_solicitudesCache && _solicitudesCache.length < _solicitudesTotal) {
    html += '<div style="text-align:center;"><button class="btn btn--secondary" onclick="_cargarMasSolicitudes()">Cargar 300 más (' + (_solicitudesTotal - _solicitudesCache.length) + ' restantes)</button></div>';
  }

  html += '</div>';
  container.innerHTML = html;
  mostrarVista('viewDashboard');
}
